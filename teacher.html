<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ec; --paper:#fffdf8; --ink:#17262b; --ink2:#4b5b60; --muted:#8a9599;
  --line:#e3dfd4; --line2:#d3cec1;
  --accent:#0f6e64; --accent2:#e3f1ee; --accentInk:#0a4f48;
  --H:#1f8a4c; --S:#2563eb; --I:#c98a06; --A:#d23b3b; --D:#7c4dce;
  --Hbg:#e5f4ea; --Sbg:#e6eefe; --Ibg:#fbf1d9; --Abg:#fbe5e5; --Dbg:#efe7fb;
  --radius:12px; --shadow:0 1px 2px rgba(23,38,43,.06),0 4px 14px rgba(23,38,43,.05);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:232px;flex:none;background:var(--ink);color:#e8efee;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{font-size:18px;letter-spacing:-.02em;display:block}
.brand small{color:#93a8a6;font-size:12px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#c5d3d1;text-decoration:none;border:0;background:none;cursor:pointer;width:100%;text-align:left;font-weight:500}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:rgba(255,255,255,.1);color:#fff}
.nav svg{width:19px;height:19px;flex:none;opacity:.9}
.side .foot{margin-top:auto;font-size:12px;color:#93a8a6;padding:8px 12px}
.main{flex:1;min-width:0;padding:26px 30px 90px;max-width:1240px}
/* bottom nav */
.bnav{display:none}
@media (max-width:860px){
  .side{width:72px;padding:10px 5px calc(10px + env(safe-area-inset-bottom));gap:3px;height:100vh;height:100dvh;overflow-y:auto;z-index:30}
  .side .brand{padding:0 0 10px;justify-content:center}.side .brand>div:last-child{display:none}.side .logo{width:40px;height:40px}
  .side .nav{flex-direction:column;justify-content:center;gap:3px;padding:8px 2px;font-size:10.5px;line-height:1.1;text-align:center;letter-spacing:-.01em}
  .side .nav svg{width:22px;height:22px}
  .side .nav .nl{display:none}.side .nav .ns{display:block}
  .sideart,.side .foot{display:none!important}
  .main{padding:14px 10px 40px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .vw{min-width:640px}.vw.vw-kalender,.vw.vw-papan{min-width:0}.main .mhint{display:flex}
  .bnav{display:none!important}
}
.nav .ns{display:none}
/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:26px;letter-spacing:-.025em;line-height:1.15}
.top p{margin:4px 0 0;color:var(--ink2)}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--H);display:inline-block}
.save.busy i{background:var(--I)} .save.err i{background:var(--A)}
.banner{background:#fff6e0;border:1px solid #f0d896;color:#7a5600;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
.banner.red{background:var(--Abg);border-color:#f2b8b8;color:#8f1f1f}
/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{margin:0 0 12px;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(4,1fr)}@media (max-width:860px){.g4{grid-template-columns:repeat(2,1fr)}}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--mono)}
/* controls */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{border:1px solid var(--line2);background:var(--paper);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accentInk)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--A)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}.btn:disabled:hover{border-color:var(--line2)}
.btn svg{width:16px;height:16px}
select,input[type=text],input[type=date],input[type=number],input[type=url],textarea{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:8px 10px;font-size:14px;min-width:0}
textarea{width:100%;resize:vertical;min-height:70px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.seg{display:inline-flex;background:#ebe8df;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
label.f > *{font-weight:400;color:var(--ink)}
.form{display:grid;gap:12px}
.form .row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
/* chips / status */
.st{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:7px;font-weight:700;font-size:12px;font-family:var(--mono)}
.st.H{background:var(--Hbg);color:var(--H)} .st.S{background:var(--Sbg);color:var(--S)} .st.I{background:var(--Ibg);color:var(--I)} .st.A{background:var(--Abg);color:var(--A)} .st.D{background:var(--Dbg);color:var(--D)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#ece9e0;color:var(--ink2)}
.pill.acc{background:var(--accent2);color:var(--accentInk)}
/* attendance list */
.att{display:flex;flex-direction:column}
.att .r{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.att .r:last-child{border-bottom:0}
.att .no{width:26px;color:var(--muted);font-family:var(--mono);font-size:12px;text-align:right}
.att .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{display:flex;gap:4px}
.sw button{width:34px;height:32px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-weight:700;font-family:var(--mono);font-size:13px;cursor:pointer;color:var(--muted)}
.sw button.on.H{background:var(--H);border-color:var(--H);color:#fff}
.sw button.on.S{background:var(--S);border-color:var(--S);color:#fff}
.sw button.on.I{background:var(--I);border-color:var(--I);color:#fff}
.sw button.on.A{background:var(--A);border-color:var(--A);color:#fff}
.sw button.on.D{background:var(--D);border-color:var(--D);color:#fff}
@media (max-width:480px){.sw button{width:30px}}
.sum{display:flex;gap:8px;flex-wrap:wrap}
.sum span{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);max-height:72vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
table.t th,table.t td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t thead th{position:sticky;top:0;background:#f7f5ef;z-index:2;font-size:12px;color:var(--ink2);font-weight:700;vertical-align:bottom}
table.t .stk{position:sticky;left:0;background:var(--paper);z-index:1}
table.t thead .stk{z-index:3;background:#f7f5ef}
table.t .stk2{position:sticky;left:38px;background:var(--paper);z-index:1;border-right:1px solid var(--line)}
table.t thead .stk2{z-index:3;background:#f7f5ef}
@media (max-width:640px){table.t .stk2{max-width:118px;white-space:normal;font-size:12.5px;line-height:1.25}table.t th,table.t td{padding:6px 6px}}
table.t td.c,table.t th.c{text-align:center}
table.t tr:hover td{background:#faf8f2}
.colh{border:0;background:none;cursor:pointer;font:inherit;color:inherit;text-align:center;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.colh b{font-size:12px;color:var(--ink)}
.colh small{font-weight:500;color:var(--muted);font-size:11px}
.cellw{display:flex;align-items:center;gap:5px;justify-content:center}
input.cell{width:48px;text-align:center;padding:5px 2px;font-family:var(--mono);font-weight:700;font-size:14px;text-transform:uppercase;border-radius:7px}
input.cell.bad{outline:2px solid var(--A);background:var(--Abg)}
.ang{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;text-align:left}
.avg{font-family:var(--mono);font-weight:700}
.npick{position:fixed;z-index:60;background:var(--paper);border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 30px rgba(15,25,28,.18);padding:8px;display:flex;flex-direction:column;gap:6px;width:max-content;max-width:calc(100vw - 16px)}
.npick .nm{font-size:11.5px;color:var(--ink2);font-weight:600;padding:0 2px;max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.npick .rw{display:flex;gap:5px;flex-wrap:wrap}
.npick button{border:1px solid var(--line2);background:#fff;border-radius:8px;min-width:44px;height:38px;padding:0 8px;font-family:var(--mono);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.npick button small{display:block;font-size:10px;font-weight:500;color:var(--muted);line-height:1}
.npick button.p{background:var(--accent2);border-color:#bcdcd5;color:var(--accentInk);line-height:1.05}
.npick button.on{background:var(--ink);border-color:var(--ink);color:#fff}.npick button.on small{color:#cfd8d6}
.npick button.x{font-family:inherit;font-size:12px;color:var(--A)}
.npick button.k{font-family:inherit;font-size:12px}
.md{overflow-x:hidden}.md .mb{min-width:0}.form,.form .row,label.f{min-width:0}.form select,.form input,.form textarea{width:100%;max-width:100%;min-width:0}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.bk{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:2px solid var(--line);text-decoration:none;color:var(--ink);background:#fff}
.bk:hover{border-color:var(--line2);transform:translateY(-1px)}.bk.g{background:linear-gradient(135deg,#fff 40%,var(--mint))}.bk.s{background:linear-gradient(135deg,#fff 40%,var(--sky))}
.bk .bi{font-size:24px}.bk b{display:block;font-family:var(--head);font-weight:600;font-size:14px}.bk small{color:var(--ink2);font-size:12px}
.babbtn{display:flex;gap:6px;flex-wrap:wrap}
.flist{display:flex;flex-direction:column;gap:5px}.fl{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 8px;border-radius:10px;background:#faf6fd;border:1.5px solid var(--line)}
.fl a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--accentInk);text-decoration:none}
/* slide viewer */
.sv{position:fixed;inset:0;z-index:150;background:#2b2140;display:flex;flex-direction:column}
.sv .svbar{display:flex;align-items:center;gap:8px;padding:8px 12px;color:#fff;flex-wrap:wrap}
.sv .svbar .tt{flex:1;min-width:0;font-family:var(--head);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv .svbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.sv .svwrap{flex:1;display:grid;place-items:center;padding:6px 12px 12px;min-height:0}
.stage{container-type:inline-size;width:min(100%,calc((100vh - 120px) * 16 / 9));aspect-ratio:16/9;background:#fffaf3;border-radius:16px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:'Nunito',sans-serif;color:#3b2d52}
.sv .svnav{display:flex;justify-content:center;align-items:center;gap:12px;color:#fff;padding:0 0 12px;font-family:var(--head)}
.sv .svnav .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.sl{position:absolute;inset:0;padding:5cqw 6cqw;display:flex;flex-direction:column;gap:2.2cqw;background:radial-gradient(40cqw 30cqw at 0 0,#dff5ec 0,transparent 70%),radial-gradient(40cqw 30cqw at 100% 0,#efe4fb 0,transparent 70%),radial-gradient(36cqw 26cqw at 100% 100%,#fde3ea 0,transparent 70%),#fffaf3}
.sl h2{margin:0;font-family:'Fredoka',sans-serif;font-weight:600;font-size:4.2cqw;line-height:1.15;align-self:flex-start;background:linear-gradient(transparent 60%,#fbd3df 60%,#fbd3df 92%,transparent 92%);padding:0 .6cqw}
.sl .tag{font-family:'Fredoka';font-weight:600;font-size:1.5cqw;letter-spacing:.15em;color:#d0628a;text-transform:uppercase}
.sl ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1.3cqw;font-size:2.3cqw;line-height:1.35}
.sl ul li{padding-left:3cqw;position:relative}.sl ul li:before{content:'';position:absolute;left:.4cqw;top:.9cqw;width:1.3cqw;height:1.3cqw;border-radius:50%;background:#b9a1e6}
.sl .kt{margin-top:auto;background:#e9defa;border-radius:1.6cqw;padding:1.6cqw 2.2cqw;font-size:2cqw;font-weight:700;color:#5a3d9c}
.sl.cover{justify-content:center;align-items:flex-start;background:linear-gradient(135deg,#efe6fc 0%,#e3f5ee 60%,#fde7ee 100%)}
.sl.cover h1{font-family:'Fredoka';font-weight:700;font-size:6.6cqw;line-height:1.08;margin:0;max-width:75%;color:#3b2d52}
.sl.cover .sub{font-family:'Fredoka';font-weight:500;font-size:2.4cqw;background:#fff;border-radius:99px;padding:.6cqw 2.2cqw;color:#5a3d9c}
.sl .deco2{position:absolute;right:4cqw;bottom:4cqw;width:24cqw;opacity:.9}
.sl.tanya{justify-content:center;align-items:center;text-align:center}.sl.tanya .q{font-family:'Fredoka';font-weight:500;font-size:3.6cqw;line-height:1.3;max-width:80%;background:#fff;border:.4cqw dashed #d8c8f3;border-radius:3cqw;padding:3cqw 4cqw}
.sl.tanya .big{font-size:7cqw}
.sl.ur .uq{display:flex;gap:2cqw;align-items:flex-start;background:#fff;border:.3cqw solid #e3d5f3;border-radius:2cqw;padding:2.6cqw 3cqw;font-size:3cqw;font-weight:700;line-height:1.35}
.sl.ur .uq .no{flex:none;width:5.4cqw;height:5.4cqw;border-radius:50%;background:#e9defa;color:#5a3d9c;display:grid;place-items:center;font-family:'Fredoka';font-size:2.8cqw}
.sl.ur .ukb{align-self:flex-start;font:inherit;font-size:1.9cqw;font-weight:700;padding:1cqw 2.2cqw;border-radius:5cqw;border:.25cqw solid #cdbbe9;background:#fff;color:#5a3d9c;cursor:pointer}
.sl.ur .kt{margin-top:0;font-weight:600;line-height:1.4;font-size:2.1cqw}
.sl.ur.open{gap:1.5cqw}.sl.ur.open h2{font-size:3cqw}.sl.ur.open .uq{font-size:2.2cqw;padding:1.8cqw 2.4cqw}.sl.ur.open .uq .no{width:4cqw;height:4cqw;font-size:2cqw}.sl.ur.open .ukb{font-size:1.6cqw;padding:.7cqw 1.8cqw}
.sl.ur.open.lg .kt{font-size:1.65cqw}.sl.ur.open.lg .uq{font-size:2cqw}
.jg td.jgk{cursor:pointer;transition:transform .12s}.jg td.jgk:hover{filter:brightness(.95);outline:2px solid var(--accent);outline-offset:-2px}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const clone=(o)=>JSON.parse(JSON.stringify(o==null?null:o));
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const pad=(n)=>String(n).padStart(2,'0');
const iso=(d)=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=(s)=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const fmtD=(s)=>{const d=pd(s);return HARI[d.getDay()]+', '+d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()};
const fmtS=(s)=>{const d=pd(s);return d.getDate()+' '+BLS[d.getMonth()]+' '+d.getFullYear()};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const STAT=['H','S','I','A','D'];
const COARSE=(()=>{try{return matchMedia('(pointer:coarse)').matches}catch(e){return false}})();
const STATN={H:'Hadir',S:'Sakit',I:'Izin',A:'Alpa',D:'Dispensasi'};
const JENIS={'libur-nasional':'Libur Nasional','cuti':'Cuti Bersama','libur-sekolah':'Libur Sekolah','asesmen':'Asesmen','kegiatan':'Kegiatan Sekolah','lainnya':'Lainnya'};

/* ---------- store ---------- */
const Store={mode:'loading',db:null,data:{},dirty:{},timers:{},writing:{},again:{},readonly:false,loadedApp:false,loadedKelas:false,err:''};
const LSK='teacherdev:';
function lsGet(k){try{return JSON.parse(localStorage.getItem(LSK+k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LSK+k,JSON.stringify(v))}catch(e){}}
function lsKeys(){try{return Object.keys(localStorage).filter(k=>k.startsWith(LSK)).map(k=>k.slice(LSK.length))}catch(e){return []}}

function D(path){if(ARS){if(path==='app/settings')return ARS.meta.settings;if(path==='app/kalender')return ARS.meta.kalender;if(path==='app/rekap')return ARS.meta.rekap;if(path.slice(0,6)==='kelas/')return ARS.kd[path.slice(6)];if(path.slice(0,6)==='tugas/')return (ARS.kd[path.slice(6)]||{})._tugas||{list:[]}}return Store.data[path]}
const Hist={stack:[],cur:null,muted:false,label:null};
function histLabel(path){if(path==='app/settings')return 'pengaturan';if(path==='app/modul')return 'materi';if(path==='app/kalender')return 'kalender';return 'data kelas '+path.split('/')[1]}
function record(path){
  if(Hist.muted)return;
  if(!Hist.cur){Hist.cur={items:{},label:Hist.label||histLabel(path)};setTimeout(()=>{if(Hist.cur){Hist.stack.push(Hist.cur);if(Hist.stack.length>50)Hist.stack.shift();Hist.cur=null;Hist.label=null;updUndo()}},0)}
  if(!(path in Hist.cur.items))Hist.cur.items[path]=Store.data[path]===undefined?null:clone(Store.data[path]);
}
function updUndo(){const b=$('#undoBtn');if(!b)return;const top=Hist.stack[Hist.stack.length-1];b.disabled=!top;b.title=top?'Urungkan: '+top.label+' (Ctrl+Z)':'Belum ada perubahan untuk diurungkan';}
function undo(){
  const e=Hist.stack.pop();if(!e){toast('Tidak ada yang bisa diurungkan');return}
  Hist.muted=true;
  Object.entries(e.items).forEach(([path,before])=>{
    if(before==null){delete Store.data[path];if(Store.mode==='db')Store.db.doc(path).delete().catch(()=>{});else{try{localStorage.removeItem(LSK+path)}catch(x){}}}
    else put(path,before);
  });
  Hist.muted=false;hidePick();closeLayer();render();updUndo();toast('Dibatalkan: '+e.label);
}
function put(path,obj){if(ARS){toast('Mode arsip hanya untuk dilihat. Kembali ke tahun aktif untuk mengubah data.');return}record(path);Store.data[path]=obj;Store.dirty[path]=true;schedule(path);setSave('busy')}
function schedule(path){clearTimeout(Store.timers[path]);Store.timers[path]=setTimeout(()=>{delete Store.timers[path];flush(path)},500)}
async function flush(path){
  if(Store.writing[path]){Store.again[path]=true;return}
  Store.writing[path]=true;Store.dirty[path]=false;
  const body=clone(Store.data[path]);
  try{
    if(Store.mode==='db'){await Store.db.doc(path).set(body)}
    else lsSet(path,body);
    Store.writing[path]=false;
    if(Store.again[path]||Store.dirty[path]){Store.again[path]=false;flush(path);return}
    if(!Object.keys(Store.timers).length && !Object.values(Store.writing).some(Boolean)) setSave('ok');
  }catch(e){
    Store.writing[path]=false;Store.dirty[path]=true;
    const code=e&&e.code;
    if(code==='invalid_argument'){Store.readonly=true;setSave('err','Tidak punya izin menyimpan');banner('Kamu membuka aplikasi ini dengan akses lihat saja — perubahan tidak tersimpan.',true)}
    else if(code==='quota_exceeded'){setSave('err','Penyimpanan penuh');banner('Penyimpanan penuh. Hapus data lama (misalnya agenda tahun lalu) lalu coba lagi.',true)}
    else {setSave('err','Gagal menyimpan, mencoba lagi…');setTimeout(()=>schedule(path),2500+Math.random()*1500)}
  }
}

function onSnap(coll,snap,flagKey){
  let changed=false;
  snap.docs.forEach(d=>{
    const p=coll+'/'+d.id;
    if(Store.dirty[p]||Store.writing[p]||Store.timers[p])return;
    const nv=JSON.stringify(d.data());
    if(JSON.stringify(Store.data[p])!==nv){Store.data[p]=JSON.parse(nv);changed=true}
  });
  if(!snap.metadata.fromCache)Store[flagKey]=true;
  if(Store.loadedApp&&Store.loadedKelas){clearTimeout(loadTimer);if(Store.mode==='loading'){Store.mode='db';render()}else if(changed)softRender()}
  else if(changed&&Store.mode==='db')softRender();
}

async function boot(){
  let db=null;
  try{ if(window.__claudeX&&window.__claudeX.use) db=await window.__claudeX.use('db'); }catch(e){db=null}
  if(!db){
    Store.mode='local';
    lsKeys().forEach(k=>{Store.data[k]=lsGet(k)});
    try{if(window.__claudeX&&window.__claudeX.use)window.__claudeX.use('assets').then(a=>{ASSETS_OK=!!a;if(a)softRender()}).catch(()=>{})}catch(e){}
    banner('Mode perangkat: data hanya tersimpan di browser ini. Buka aplikasi dari claude.ai agar data tersimpan aman dan bisa dibuka di HP maupun laptop.');
    render();return;
  }
  Store.db=db;
  try{window.__claudeX.use('assets').then(a=>{ASSETS_OK=!!a;if(a&&ui.view==='modul')softRender()}).catch(()=>{})}catch(e){}
  loadTimer=setTimeout(()=>{
    if(Store.mode==='loading'){Store.mode='db';banner('Data belum bisa dimuat sepenuhnya — periksa koneksi internet. Yang tampil mungkin belum terbaru.',true);render()}
  },10000);
  const err=(e)=>{clearTimeout(loadTimer);if(Store.mode==='loading')Store.mode='db';banner('Koneksi ke penyimpanan terputus. Muat ulang halaman untuk menyambung kembali.',true);render()};
  try{
    db.collection('app').onSnapshot(s=>onSnap('app',s,'loadedApp'),err);
    db.collection('kelas').onSnapshot(s=>onSnap('kelas',s,'loadedKelas'),err);
    db.collection('slides').onSnapshot(s=>onSnap('slides',s,'loadedSlides'),()=>{});
    db.collection('kuis').onSnapshot(s=>onSnap('kuis',s,'loadedKuis'),()=>{});
    db.collection('asesmen').onSnapshot(s=>onSnap('asesmen',s,'loadedAsm'),()=>{});
    db.collection('tugas').onSnapshot(s=>onSnap('tugas',s,'loadedTugas'),()=>{});
    db.collection('arsip').onSnapshot(s=>onSnap('arsip',s,'loadedArsip'),()=>{});
  }catch(e){err(e)}
}

  const c=S().konversi;

  const n=Number(v.replace(',','.'));

function rkDoc(){const d=D('app/rekap')||{};return {skip:d.skip||{},refleksi:d.refleksi||{},stat:d.stat||{}}}
function rkSave(o,label){Hist.label=label||'Rekap';put('app/rekap',o)}
/* ---------- status materi (terintegrasi) ---------- */
function rkManual(k){const d=rkDoc();const m=Object.assign({},(d.stat||{})[k]||{});const sk=(d.skip||{})[k]||{};Object.keys(sk).forEach(pid=>{if(!m[pid])m[pid]={st:'tidak',alasan:sk[pid].alasan||''}});return m}
function rkSetManual(k,pid,val,label){const o=rkDoc();o.stat=Object.assign({},o.stat||{});o.stat[k]=Object.assign({},o.stat[k]||{});o.skip=Object.assign({},o.skip||{});
  if(o.skip[k]&&o.skip[k][pid]){o.skip[k]=Object.assign({},o.skip[k]);delete o.skip[k][pid]}
  if(val)o.stat[k][pid]=val;else delete o.stat[k][pid];rkSave(o,label||'Status materi')}
function agInfo(k){const m={};K(k).agenda.forEach(a=>{if(!a.pertemuanId)return;const x=m[a.pertemuanId]||(m[a.pertemuanId]={list:[]});x.list.push(a)});
  Object.values(m).forEach(x=>{x.list.sort((a,b)=>(a.tanggal+a.jam).localeCompare(b.tanggal+b.jam));x.tuntas=x.list.some(a=>a.tuntas!==false);x.last=x.list[x.list.length-1];x.done=x.list.filter(a=>a.tuntas!==false).pop()||x.last});return m}
function autoStatus(x){return x?(x.tuntas?'selesai':'proses'):null}
function rkStatus(k){
  const mods=modulList();const ag=agInfo(k);const man=rkManual(k);const res={};
  ['s1','s2'].forEach(sem=>{const flat=[];mods.filter(m=>(m.semester||'s1')===sem&&(m.pertemuan||[]).length).forEach(m=>m.pertemuan.forEach(p=>flat.push(p)));
    const base=flat.map(p=>{const mm=man[p.id];return mm&&mm.st?mm.st:autoStatus(ag[p.id])});
    let lastIdx=-1;base.forEach((s,i)=>{if(s==='selesai'||s==='proses'||s==='tidak')lastIdx=i});
    flat.forEach((p,i)=>{const mm=man[p.id];const a=ag[p.id];let st=base[i]||(i<lastIdx?'terlewat':'belum');
      res[p.id]={st,manual:!!(mm&&mm.st),ag:a?(st==='selesai'?a.done:a.last):null,tgl:(mm&&mm.tgl)||(a?(st==='selesai'?a.done.tanggal:a.last.tanggal):''),alasan:(mm&&mm.alasan)||'',auto:autoStatus(a)||'belum'}})});
  return res;
}
function doneSet(k,exceptId){const st=new Set();K(k).agenda.forEach(a=>{if(a.pertemuanId&&a.id!==exceptId&&a.tuntas!==false)st.add(a.pertemuanId)});
  const man=rkManual(k);Object.entries(man).forEach(([pid,v])=>{if(v.st==='selesai'||v.st==='tidak')st.add(pid);else if(v.st==='proses'||v.st==='belum')st.delete(pid)});return st}
const RK_LBL={selesai:'Selesai',proses:'Belum selesai',tidak:'Tidak dilaksanakan',terlewat:'Terlewat',belum:'Belum dilaksanakan'};

function rkSum(k,babs){const st=rkStatus(k);const c={selesai:0,proses:0,tidak:0,terlewat:0,belum:0,jp:0,jpAll:0};
  babs.forEach(m=>(m.pertemuan||[]).forEach(p=>{const s=st[p.id];if(!s)return;c[s.st]++;c.jpAll+=+p.jp||0;if(s.st==='selesai')c.jp+=+p.jp||0}));
  c.total=c.selesai+c.proses+c.tidak+c.terlewat+c.belum;c.pct=c.total?Math.round(c.selesai/c.total*100):0;return c}
function rkBabEval(m,k){
  const kd=K(k);const n=kd.siswa.length;const ags=kd.agenda.filter(a=>a.babId===m.id);
  let hs=[];ags.forEach(a=>{const ab=kd.absen[a.tanggal]||{};const x=Object.values(ab).filter(v=>v==='S'||v==='I'||v==='A').length;if(n)hs.push(100-x/n*100)});
  const hadir=hs.length?Math.round(hs.reduce((a,b)=>a+b,0)/hs.length):null;
  const nd=nilaiDoc(kd,m.semester||'s1');const cols=(nd.kolom||[]).filter(c=>c.babId===m.id&&!isUjian(c));let vs=[];
  kd.siswa.forEach(st=>{const row=nd.data[st.id]||{};cols.forEach(c=>{const v=nilaiAngka(row[c.id]);if(v!=null)vs.push(v)})});
  const nilai=vs.length?Math.round(vs.reduce((a,b)=>a+b,0)/vs.length):null;
  const kendala=ags.filter(a=>(a.catatan||'').trim()).map(a=>({tgl:a.tanggal,t:a.catatan.trim()}));
  return {hadir,nilai,nCol:cols.length,kendala,nAg:ags.length};
}

function tgStored(k){return ((D('tugas/'+k)||{}).list||[]).slice()}
const tgStrip=(t)=>{const o={};Object.keys(t).forEach(x=>{if(x[0]!=='_')o[x]=t[x]});return o};
function tgFindCol(kd,kolId,sem){for(const s of (sem?[sem,sem==='s1'?'s2':'s1']:['s1','s2'])){const c=nilaiDoc(kd,s).kolom.find(x=>x.id===kolId);if(c)return {c,sem:s}}return null}
function tgDecor(kd,t){t.sem=t.sem||semOf(t.dibuat||today());
  if(t.kolId){const f=tgFindCol(kd,t.kolId,t.sem);if(f){t.sem=f.sem;t._col=f.c;t.judul=f.c.nama;t.babId=f.c.babId||t.babId||'';const nd=nilaiDoc(kd,f.sem);t._nil={};Object.keys(nd.data).forEach(sid=>{const v=nd.data[sid][t.kolId];if(v!=null)t._nil[sid]=v})}else t._lost=true}
  return t}
function tgDoc(k){const kd=K(k);const st=tgStored(k);const used=new Set(st.map(t=>t.kolId).filter(Boolean));const out=st.map(t=>tgDecor(kd,clone(t)));
  ['s1','s2'].forEach(sem=>nilaiDoc(kd,sem).kolom.forEach(c=>{if(isUjian(c)||used.has(c.id))return;out.push(tgDecor(kd,{id:'kol_'+c.id,judul:c.nama,kolId:c.id,sem,bentuk:'langsung',babId:c.babId||'',tenggat:'',dibuat:c.tanggal||'',kumpul:{},_virtual:true}))}));
  return {list:out}}
function tgSave(k,doc,label){Hist.label=label||'Kantong tugas';put('tugas/'+k,{list:doc.list.filter(t=>!t._virtual).map(tgStrip)})}
function tgGet(k,id){return tgDoc(k).list.find(x=>x.id===id)}
function tgUpd(k,id,fn,label){const it=tgGet(k,id);if(!it)return;const nx=tgStrip(fn(clone(it)));const st=tgStored(k);const i=st.findIndex(x=>x.id===id);if(i>=0)st[i]=nx;else st.push(nx);Hist.label=label||'Kantong tugas';put('tugas/'+k,{list:st})}
function tgNil(t,sid){if(t._nil)return t._nil[sid]==null?null:t._nil[sid];const v=((t.kumpul||{})[sid]||{}).nilai;return v==null?null:v}
function tgStat(t,sid){const s=(t.kumpul||{})[sid]||{};const n=tgNil(t,sid);if(!s.ok&&n==null)return 'belum';return t.tenggat&&s.tgl&&s.tgl>t.tenggat?'telat':'sudah'}
function tgSetNilai(k,t,sid,v){
  if(t.kolId&&!t._lost){const kd=K(k);const nd=nilaiDoc(kd,t.sem);const row=Object.assign({},nd.data[sid]||{});if(v==null)delete row[t.kolId];else row[t.kolId]=v;nd.data=Object.assign({},nd.data,{[sid]:row});kd.nilai=Object.assign({},kd.nilai,{[t.sem]:nd});const st=kd.siswa.find(x=>x.id===sid);Hist.label='Nilai '+(st?st.nama:'')+' ('+t.judul+')';saveK(k,kd)}
  else tgUpd(k,t.id,x=>{const kk=Object.assign({},x.kumpul||{});const ss=Object.assign({files:[]},kk[sid]);ss.nilai=v;kk[sid]=ss;x.kumpul=kk;return x},'Nilai tugas')}
function tgLink(k,id){const t=tgGet(k,id);if(!t||(t.kolId&&!t._lost))return;const kd=K(k);const sem=t.sem||semOf(today());const nd=nilaiDoc(kd,sem);const kolId=uid();
  nd.kolom=nd.kolom.concat([{id:kolId,nama:t.judul,jenis:'Tugas',tanggal:t.tenggat||today(),babId:t.babId||'',ikut:true}]);
  kd.siswa.forEach(s=>{const v=((t.kumpul||{})[s.id]||{}).nilai;if(v!=null){const r=Object.assign({},nd.data[s.id]||{});r[kolId]=v;nd.data=Object.assign({},nd.data,{[s.id]:r})}});
  kd.nilai=Object.assign({},kd.nilai,{[sem]:nd});Hist.label='Hubungkan ke Daftar Nilai';saveK(k,kd);tgUpd(k,id,x=>Object.assign(x,{kolId,sem}));render();toast('Terhubung ke Daftar Nilai')}
function tgHapus(k,id){const t=tgGet(k,id);if(!t)return;const linked=t.kolId&&!t._lost;const nf=Object.values(t.kumpul||{}).reduce((n,s)=>n+((s.files||[]).length),0);
  modal('Hapus tugas','<p style="margin:0 0 10px">Hapus <b>'+esc(t.judul)+'</b>'+(nf?' beserta '+nf+' lampiran':'')+'?</p>'+(linked?'<label class="ck"><input type="checkbox" id="thKol"'+(t._virtual?' checked disabled':'')+'> Hapus juga kolom nilai ini di Daftar Nilai</label>'+(t._virtual?'<p class="small muted" style="margin:6px 0 0">Tugas ini berasal dari kolom Daftar Nilai, jadi kolomnya ikut terhapus.</p>':''):''),
    '<button class="btn" data-act="close">Batal</button><button class="btn pri" id="thOk" style="background:var(--A);border-color:var(--A)">Hapus</button>');
  $('#thOk').onclick=()=>{const delKol=linked&&$('#thKol')&&$('#thKol').checked;Hist.label='Hapus tugas';
    if(!t._virtual)put('tugas/'+k,{list:tgStored(k).filter(x=>x.id!==id)});
    if(delKol){const kd=K(k);const n=nilaiDoc(kd,t.sem);n.kolom=n.kolom.filter(x=>x.id!==t.kolId);const data={};Object.keys(n.data).forEach(sid=>{const r=Object.assign({},n.data[sid]);delete r[t.kolId];data[sid]=r});n.data=data;kd.nilai=Object.assign({},kd.nilai,{[t.sem]:n});saveK(k,kd)}
    ui.tgId=null;closeLayer();render();toast('Tugas dihapus')}}
function tgFileCount(k,kolId){const t=tgStored(k).find(x=>x.kolId===kolId);return t?Object.values(t.kumpul||{}).reduce((n,s)=>n+((s.files||[]).length),0):0}

function loadPdfjs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);if(PDFJSp)return PDFJSp;
  const add=(src)=>new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=()=>{sc.remove();rej()};document.head.appendChild(sc)});
  const bases=['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/'];
  PDFJSp=(async()=>{for(const b of bases){try{if(!window.pdfjsWorker)await add(b+'pdf.worker.min.js');if(!window.pdfjsLib)await add(b+'pdf.min.js');if(window.pdfjsLib){window.pdfjsLib.GlobalWorkerOptions.workerSrc=b+'pdf.worker.min.js';return window.pdfjsLib}}catch(e){}}PDFJSp=null;throw new Error('lib')})();return PDFJSp}

    else B.innerHTML='<div class="fvload">Jenis file ini tidak bisa ditampilkan. Gunakan tombol Unduh.</div>';

function fvLayout(){if(!FV||!FV.pdf)return;const B=$('#fvB');const w=Math.min(B.clientWidth-24,1000)*FV.zoom;const sc=w/FV.vw.width;const h=FV.vw.height*sc;

function pbFitS(){const st=$('#pbStage');return st?Math.max(.05,st.clientWidth/PB_W):1}

function pbClamp(s){const f=pbFitS();return Math.max(f*.25,Math.min(f*6,s))}

function pbXf(ctx){const d=PB.dpr||1,v=PB.view;ctx.setTransform(d*v.s,0,0,d*v.s,d*v.x,d*v.y)}

function pbLive(s){const c=$('#pbLive');if(!c)return;const ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);pbXf(ctx);
  if(s.t==='er'){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=s.w;ctx.strokeStyle='rgba(138,108,200,.35)';pbPath(ctx,s.p,1);ctx.stroke();ctx.restore();
    const ink=$('#pbInk').getContext('2d');pbXf(ink);pbDrawStroke(ink,{t:'er',w:s.w,p:s.p.slice(-2)},1);return}
  pbDrawStroke(ctx,s,1)}

function pbBgWorld(ctx,x0,y0,x1,y1,bg,pola,lw){const B=PB_BG[bg]||PB_BG.putih;ctx.fillStyle=B.c;ctx.fillRect(x0,y0,x1-x0,y1-y0);if(pola==='polos')return;const st=50;ctx.strokeStyle=B.g;ctx.lineWidth=lw;ctx.beginPath();
  for(let y=Math.ceil(y0/st)*st;y<y1;y+=st){ctx.moveTo(x0,y);ctx.lineTo(x1,y)}if(pola==='kotak')for(let x=Math.ceil(x0/st)*st;x<x1;x+=st){ctx.moveTo(x,y0);ctx.lineTo(x,y1)}ctx.stroke()}
function pbRedraw(){const b=$('#pbBgC'),k=$('#pbInk');if(!b||!k||!PB.view)return;const v=PB.view,d=PB.dpr||1;
  const bc=b.getContext('2d');bc.setTransform(1,0,0,1,0,0);bc.clearRect(0,0,b.width,b.height);pbXf(bc);const x0=-v.x/v.s,y0=-v.y/v.s,x1=x0+b.width/d/v.s,y1=y0+b.height/d/v.s;pbBgWorld(bc,x0,y0,x1,y1,PB.bg,PB.pola,1.2/v.s*pbFitS());
  const ctx=k.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,k.width,k.height);pbXf(ctx);pbPage().strokes.forEach(s=>pbDrawStroke(ctx,s,1))}
function pbBBox(page){let a=[0,0,PB_W,PB_H];page.strokes.forEach(s=>{if(s.t==='er')return;s.p.forEach(q=>{a[0]=Math.min(a[0],q[0]-s.w);a[1]=Math.min(a[1],q[1]-s.w);a[2]=Math.max(a[2],q[0]+s.w);a[3]=Math.max(a[3],q[1]+s.w)})});return [a[0]-30,a[1]-30,a[2]+30,a[3]+30]}
function pbRender(page,w){const bb=pbBBox(page);const ww=bb[2]-bb[0],hh=bb[3]-bb[1];const k=w/ww;const h=Math.round(hh*k);const out=document.createElement('canvas');out.width=w;out.height=h;const o=out.getContext('2d');
  o.setTransform(k,0,0,k,-bb[0]*k,-bb[1]*k);pbBgWorld(o,bb[0],bb[1],bb[2],bb[3],PB.bg,PB.pola,1.2);
  const ink=document.createElement('canvas');ink.width=w;ink.height=h;const ic2=ink.getContext('2d');ic2.setTransform(k,0,0,k,-bb[0]*k,-bb[1]*k);page.strokes.forEach(s=>pbDrawStroke(ic2,s,1));o.setTransform(1,0,0,1,0,0);o.drawImage(ink,0,0);return out}
function pbPath(ctx,p,sc){ctx.beginPath();if(p.length===1){ctx.moveTo(p[0][0]*sc,p[0][1]*sc);ctx.lineTo(p[0][0]*sc+.01,p[0][1]*sc);return}
  ctx.moveTo(p[0][0]*sc,p[0][1]*sc);for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0]*sc,p[i][1]*sc,mx*sc,my*sc)}const l=p[p.length-1];ctx.lineTo(l[0]*sc,l[1]*sc)}
function pbDrawStroke(ctx,s,sc){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=s.w*sc;
  if(s.t==='er'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='#000'}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=s.c;ctx.globalAlpha=s.t==='hl'?.38:1;if(s.t==='hl')ctx.lineCap='square'}
  pbPath(ctx,s.p,sc);ctx.stroke();ctx.restore()}

function pbAct(a,t){
  if(a==='pbtool'){PB.tool=t.dataset.v;render();return}
  if(a==='pbpen'){PB.pen=t.dataset.c;render();return}
  if(a==='pbhl'){PB.hl=t.dataset.c;render();return}
  if(a==='pbsize'){PB.size[PB.tool]=+t.dataset.v;render();return}
  if(a==='pbzi'||a==='pbzo'){const st=$('#pbStage');pbZoomAt(a==='pbzi'?1.25:.8,st.clientWidth/2,st.clientHeight/2);return}
  if(a==='pbzr'){const st=$('#pbStage');PB.view={s:st.clientWidth/PB_W,x:0,y:0,w0:st.clientWidth};pbRedraw();pbZoomLbl();return}
  if(a==='pbundo'){const s=pbPage().strokes.pop();if(s){PB.redo.push(s);PB.dirty=true;pbRedraw();pbRecBar()}return}
  if(a==='pbredo'){const s=PB.redo.pop();if(s){pbPage().strokes.push(s);PB.dirty=true;pbRedraw();pbRecBar()}return}
  if(a==='pbclear'){if(!pbPage().strokes.length)return;askConfirm('Bersihkan semua coretan di halaman ini?','Bersihkan',()=>{PB.redo=pbPage().strokes.slice().reverse();pbPage().strokes=[];PB.dirty=true;pbRedraw();pbRecBar()});return}
  if(a==='pbprev'){if(PB.i>0){PB.i--;PB.redo=[];render()}return}
  if(a==='pbnext'){if(PB.i<PB.pages.length-1){PB.i++;PB.redo=[];render()}return}
  if(a==='pbadd'){PB.pages.splice(PB.i+1,0,{strokes:[]});PB.i++;PB.redo=[];PB.dirty=true;render();return}
  if(a==='pbfull'){const w=$('#pbWrap');if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});return}(w.requestFullscreen?w.requestFullscreen():Promise.reject()).catch(()=>{document.body.classList.toggle('pbmax');setTimeout(()=>window.dispatchEvent(new Event('resize')),50)});return}
  if(a==='pblist'){pbList();return}
  if(a==='pbsave'){if(!PB.pages.some(p=>p.strokes.length)){toast('Papan masih kosong');return}pbSaveDialog();return}
  if(a==='pbdl'){pbDl();return}
  if(a==='pbnew'){const f=()=>{PB.view=null;PB.pages=[{strokes:[]}];PB.i=0;PB.redo=[];PB.rec=null;PB.dirty=false;render();toast('Papan baru siap')};if(PB.dirty&&PB.pages.some(p=>p.strokes.length))askConfirm('Coretan yang belum disimpan akan dihapus. Buat papan baru?','Ya, baru',f);else f();return}
}

  return {kd,L,rows}}

function tgAddFiles(k,id,sid,files){tgUpd(k,id,x=>{const kk=Object.assign({},x.kumpul||{});const ss=Object.assign({files:[]},kk[sid]);ss.files=(ss.files||[]).concat(files);if(!ss.ok){ss.ok=true;ss.tgl=today()}kk[sid]=ss;x.kumpul=kk;return x},'File tugas')}
async function tgUpload(k,id,sid,files){
  let as=null;try{as=await window.__claudeX.use('assets')}catch(e){}if(!as){toast('Unggah file tersedia saat dibuka dari claude.ai');return}
  const ok=[];let i=0;
  for(const f of files){i++;
    if(/presentation|powerpoint|msword|wordprocessing|officedocument|\.pptx?$|\.docx?$|\.xlsx?$/i.test(f.type+' '+f.name)){toast(f.name+': PowerPoint/Word/Excel belum bisa diunggah — simpan sebagai PDF atau pakai tautan');continue}
    if(f.size>20*1048576){toast(f.name+' lebih dari 20 MB');continue}
    toast('Mengunggah '+i+'/'+files.length+'…');
    try{const r=await as.upload(f);ok.push({id:r.id,nama:f.name,type:r.contentType,size:r.sizeBytes})}
    catch(e){toast(f.name+': '+(e&&e.code==='unsupported_type'?'jenis file tidak didukung':e&&e.code==='too_large'?'terlalu besar':'gagal diunggah'))}}
  if(ok.length){tgAddFiles(k,id,sid,ok);toast(ok.length+' file tersimpan')}
}

function rekapHadir(k){
  const kd=K(k);
  let dates=Object.keys(kd.absen);
  kd.agenda.forEach(a=>{if(!dates.includes(a.tanggal))dates.push(a.tanggal)});
  if(ui.rekap==='bulan')dates=dates.filter(d=>d.slice(0,7)===ui.bulan);
  else dates=dates.filter(d=>semOf(d)===ui.rekap&&(!S().tahunMulai||d>=S().tahunMulai));
  dates.sort();
  const rows=kd.siswa.map(s=>{
    const r={nama:s.nama,nis:s.nis||'',S:0,I:0,A:0,D:0,cells:[]};
    dates.forEach(d=>{const v=(kd.absen[d]||{})[s.id]||'H';r.cells.push(v);if(v!=='H')r[v]++});
    r.hadir=dates.length-r.S-r.I-r.A;r.pct=dates.length?Math.round(r.hadir/dates.length*100):0;return r;
  });
  return {dates,rows};
}
function hadirRows(k){
  const R=rekapHadir(k);const s=S();
  const label=ui.rekap==='bulan'?(BLN[+ui.bulan.slice(5)-1]+' '+ui.bulan.slice(0,4)):(ui.rekap==='s1'?'Semester Ganjil':'Semester Genap');
  const rows=[['REKAP DAFTAR HADIR '+(s.mapel||'').toUpperCase()],['Kelas: '+k+'   Periode: '+label+(s.tahun?'   TP '+s.tahun:'')],[],
    ['No','NIS','Nama'].concat(R.dates.map(d=>fmtS(d))).concat(['S','I','A','D','Hadir','%'])];
  R.rows.forEach((r,i)=>rows.push([i+1,r.nis,r.nama].concat(r.cells.map(v=>v==='H'?'':v)).concat([r.S,r.I,r.A,r.D,r.hadir,r.pct])));
  return {rows,label,n:R.dates.length};
}

function nilaiDoc(kd,sem){const n=kd.nilai[sem]||{};return {kolom:n.kolom||[],data:n.data||{}}}
function grupNilai(nd){const order=[];nd.kolom.forEach(c=>{if(c.ikut===false||isUjian(c))return;const g=c.babId||'_';if(!order.includes(g))order.push(g)});return order}
function grupLabel(g){if(g==='_')return 'Lainnya';const m=modulList().find(x=>x.id===g);return m?(m.kode||m.judul):'Lainnya'}
function hitung(nd,sid){
  const nol=S().kosongNol!==false;const row=nd.data[sid]||{};const groups={};const order=grupNilai(nd);
  order.forEach(g=>groups[g]=[]);
  nd.kolom.forEach(c=>{if(c.ikut===false||isUjian(c))return;const a=nilaiAngka(row[c.id]);if(a!=null)groups[c.babId||'_'].push(a);else if(nol)groups[c.babId||'_'].push(0)});
  const avgs={};order.forEach(g=>{const v=groups[g];avgs[g]=v.length?v.reduce((x,y)=>x+y,0)/v.length:null});
  const vals=order.map(g=>avgs[g]).filter(v=>v!=null);
  const harian=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
  const mean=(re)=>{const v=nd.kolom.filter(c=>re.test(c.jenis||'')&&c.ikut!==false).map(c=>nilaiAngka(row[c.id])).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  const sts=mean(/ASTS/),sas=mean(/ASAS/);const b=S().bobot;
  let rapor=null,final=false;
  if(harian!=null){let num=b.h*harian,den=b.h;if(sts!=null){num+=b.sts*sts;den+=b.sts}if(sas!=null){num+=b.sas*sas;den+=b.sas}rapor=num/den;final=sts!=null&&sas!=null}
  return {order,avgs,harian,sts,sas,rapor,final};
}

function agCopyDialog(k,id){

  const row=kk=>{const ada=K(kk).agenda.some(x=>x.tanggal===src.tanggal);return '<label class="cpk"><input type="checkbox" value="'+esc(kk)+'"'+(ada?'':' checked')+'><b>Kelas '+esc(kk)+'</b><span class="muted small">'+(ada?'sudah ada agenda di tanggal ini':'')+'</span></label>'};

    '<div class="row"><label class="f">Tanggal<select id="cpMode"><option value="same">Tanggal sama ('+esc(fmtS(src.tanggal))+')</option><option value="own">Tanggal lain…</option></select></label><label class="f" id="cpTw" style="display:none">Tanggal baru<input type="date" id="cpT" value="'+esc(src.tanggal)+'"></label></div>'+
    '<p class="small muted" style="margin:0">Jam ke- diisi otomatis dari jadwal mengajar kelas tujuan. Hasil salinan bisa diubah lewat tombol Ubah, dan dibatalkan dengan Urungkan.</p></div>',
    '<button class="btn" data-act="close">Batal</button><button class="btn pri" id="cpOk">'+ic('copy')+'Salin</button>');
  $('#cpMode').onchange=()=>{$('#cpTw').style.display=$('#cpMode').value==='own'?'':'none'};
  $('#cpOk').onclick=()=>{
    const ks=[...document.querySelectorAll('#cpK input:checked')].map(x=>x.value);if(!ks.length){toast('Pilih minimal satu kelas');return}
    const tgl=$('#cpMode').value==='own'?$('#cpT').value:src.tanggal;if(!tgl){$('#cpT').focus();return}
    Hist.label='salin agenda '+k+' ke '+ks.join(', ');
    ks.forEach(kk=>{const kd=K(kk);const it=JSON.parse(JSON.stringify(src));it.id=uid();it.tanggal=tgl;it.jam=jamOf(kk,tgl)||src.jam||'';it.ketAbsen='';it.diubah=Date.now();
      kd.agenda=kd.agenda.concat([it]);saveK(kk,kd)});
    closeLayer();render();toast('Agenda disalin ke kelas '+ks.join(', '));
  };
}
function agDelete(k,id){
  const kd=K(k);const a=kd.agenda.find(x=>x.id===id);if(!a)return;
  const nAbs=Object.keys(kd.absen[a.tanggal]||{}).length;const sameDay=kd.agenda.filter(x=>x.tanggal===a.tanggal&&x.id!==id).length;
  modal('Hapus agenda','<p style="margin-top:0">Hapus agenda <b>kelas '+esc(k)+'</b> tanggal <b>'+esc(fmtD(a.tanggal))+'</b>'+(a.jam?' jam ke-'+esc(a.jam):'')+'?</p>'+
    (kd.absen[a.tanggal]&&!sameDay?'<label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="dAbs"> Hapus juga daftar hadir tanggal ini'+(nAbs?' ('+nAbs+' siswa tidak hadir tercatat)':'')+'</label>':'')+
    '<p class="small muted">Bisa dibatalkan lewat tombol Urungkan.</p>',
    '<button class="btn" data-act="close">Batal</button><button class="btn pri" id="dOk" style="background:var(--A);border-color:var(--A);box-shadow:none">'+ic('trash')+'Hapus agenda</button>');
  $('#dOk').onclick=()=>{const kd2=K(k);Hist.label='hapus agenda '+k+' '+fmtS(a.tanggal);kd2.agenda=kd2.agenda.filter(x=>x.id!==id);
    if($('#dAbs')&&$('#dAbs').checked){const ab=Object.assign({},kd2.absen);delete ab[a.tanggal];kd2.absen=ab}
    saveK(k,kd2);closeLayer();render();toast('Agenda dihapus')};
}
function agRows(){
  const s=S();const kl=kelasList();let items=[];
  (ui.agKelas==='semua'?kl:[ui.agKelas]).forEach(k=>K(k).agenda.forEach(a=>items.push(Object.assign({kelas:k},a))));
  if(ui.agBulan)items=items.filter(a=>a.tanggal.slice(0,7)===ui.agBulan);
  items.sort((a,b)=>(a.tanggal+String(a.jam)).localeCompare(b.tanggal+String(b.jam)));
  const mods=modulList();
  const rows=[['JURNAL MENGAJAR'],['Nama Guru: '+(s.guru||'')+'   Mata Pelajaran: '+(s.mapel||'')+(s.tahun?'   Tahun Pelajaran: '+s.tahun:'')],[],
    ['No','Hari, Tanggal','Kelas','Jam Ke','Materi Pokok','Sub Materi / TP','Kegiatan','Hadir','Tidak Hadir','Keterangan','Catatan']];
  items.forEach((a,i)=>{const kd=K(a.kelas);const abs=absenText(a.kelas,a.tanggal);const n=abs.filter(x=>x.st!=='D').length;const m=mods.find(x=>x.id===a.babId);
    rows.push([i+1,fmtD(a.tanggal),a.kelas,a.jam,m?m.judul:'',a.materi,(a.guruHadir===false?'Guru tidak hadir ('+guruAbsenTxt(a)+')'+(a.tugasSiswa?'. Tugas: '+a.tugasSiswa:'')+(a.pengganti?'. Pengganti/piket: '+a.pengganti:'')+(a.kegiatan?' | ':''):'')+a.kegiatan,kd.siswa.length?kd.siswa.length-n:'',n,abs.map(x=>x.nama+' ('+x.st+')').join(', ')+(a.ketAbsen?' '+a.ketAbsen:''),a.catatan])});
  return rows;
}

function tableFromRows(rows,hi){return {t:'table',head:rows[hi].map(String),rows:rows.slice(hi+1).map(r=>r.map(v=>v==null?'':String(v)))}}
const WIDE_RE=/^(Nama|Materi Pokok|Sub Materi|Kegiatan|Keterangan|Catatan)/i;
let PDFp=null;
function loadPdfmake(){if(window.pdfMake&&window.pdfMake.vfs)return Promise.resolve(window.pdfMake);if(PDFp)return PDFp;
  const add=(src)=>new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=()=>{sc.remove();rej()};document.head.appendChild(sc)});
  const srcs=[['https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.min.js'],['https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js','https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js']];
  PDFp=(async()=>{for(const [a,b] of srcs){try{if(!window.pdfMake)await add(a);if(!(window.pdfMake&&window.pdfMake.vfs&&Object.keys(window.pdfMake.vfs).length))await add(b);if(window.pdfMake&&window.pdfMake.vfs)return window.pdfMake}catch(e){}}PDFp=null;throw new Error('lib')})();return PDFp}
const pdfTx=(t)=>String(t==null?'':t).replace(/→/g,'>').replace(/✓/g,'v').replace(/ᴬ/g,'A').replace(/ᴮ/g,'B');
function pdfDef(doc){
  const mm=72/25.4,land=doc.orient==='l';const W=FOLIO.wmm*mm,H=FOLIO.hmm*mm,M=FOLIO.mcm*10*mm;const cw=(land?H:W)-2*M;const st=S();const c=[];
  doc.blocks.forEach(bk=>{switch(bk.t){
    case 'title':if(bk.text)c.push({text:pdfTx(bk.text),bold:true,fontSize:bk.big?14:11,alignment:'center',margin:[0,0,0,1]});break;
    case 'sub':c.push({text:pdfTx(bk.text),fontSize:9,alignment:'center',margin:[0,1,0,3]});break;
    case 'hr':c.push({canvas:[{type:'line',x1:0,y1:0,x2:cw,y2:0,lineWidth:1.2,lineColor:'#8a6cc8'}],margin:[0,0,0,8]});break;
    case 'h':c.push({text:pdfTx(bk.text),bold:true,fontSize:bk.sm?10:11.5,color:'#5a3d9c',margin:bk.sm?[0,8,0,1]:[0,10,0,3]});break;
    case 'p':c.push({text:pdfTx(bk.text),italics:!!bk.i,bold:!!bk.b,fontSize:bk.size||10.5,margin:[bk.indent?18:0,bk.b?3:0,0,bk.sm?1:bk.b?1:4],lineHeight:bk.sm?1.05:1.15});break;
    case 'list':c.push({ol:bk.items.map(pdfTx),fontSize:10.5,margin:[0,0,0,4]});break;
    case 'kv':c.push({table:{widths:[120,'*'],body:bk.rows.map(r=>[{text:pdfTx(r[0]),bold:true},pdfTx(r[1])])},layout:'noBorders',fontSize:10.5,margin:[0,0,0,4]});break;
    case 'id':c.push({columns:[{text:'Nama: ..........................................................',width:'*'},{text:'Kelas: ..............',width:'auto'},{text:'     No. absen: ........',width:'auto'}],fontSize:bk.sm?9.5:10.5,margin:bk.sm?[0,0,0,3]:[0,2,0,6]});break;
    case 'q':c.push({columns:[{text:bk.no+'.',width:18},{text:pdfTx(bk.text),italics:!!bk.i,color:bk.i?'#555555':'#000000'}],fontSize:bk.sm?10:11,lineHeight:bk.sm?1.1:1.15,margin:bk.sm?[0,5,0,2]:[0,8,0,2]});break;
    case 'ans':c.push({text:[{text:'Jawaban: ',bold:true,color:'#5a3d9c'},pdfTx(bk.text)],fontSize:10.5,margin:[18,0,0,4]});break;
    case 'lines':for(let i=0;i<bk.n;i++)c.push({canvas:[{type:'line',x1:18,y1:0,x2:cw,y2:0,lineWidth:.5,dash:{length:1.5,space:2},lineColor:'#888888'}],margin:[0,bk.sm?15:17,0,0]});break;
    case 'table':{const n=bk.head.length;const fs=n>24?6:n>16?7:n>10?8:9;
      const widths=bk.head.map(h=>WIDE_RE.test(h)?'*':'auto');
      c.push({table:{headerRows:1,widths,body:[bk.head.map(h=>({text:pdfTx(h),bold:true,fillColor:'#efe6fc',alignment:'center'}))].concat(bk.rows.map(r=>r.map((v,j)=>({text:pdfTx(v),alignment:widths[j]==='*'?'left':'center'}))))},
        layout:{hLineWidth:()=>.5,vLineWidth:()=>.5,hLineColor:()=>'#999999',vLineColor:()=>'#999999',paddingLeft:()=>2,paddingRight:()=>2,paddingTop:()=>1.5,paddingBottom:()=>1.5},fontSize:fs,margin:[0,0,0,8]});break}
    case 'sign':c.push({unbreakable:true,margin:[0,14,0,0],fontSize:10.5,columns:[
      {width:'*',stack:['Mengetahui,','Kepala Sekolah',{text:st.kepsek||'...............................',bold:true,margin:[0,46,0,0]},'NIP '+(st.nipKepsek||'')]},
      {width:'*',stack:[tglPanjang(),'Guru Mata Pelajaran',{text:st.guru||'...............................',bold:true,margin:[0,46,0,0]},'NIP '+(st.nip||'')]}]});break;
    case 'br':c.push({text:'',pageBreak:'after'});break;
  }});
  return {pageSize:{width:W,height:H},pageOrientation:land?'landscape':'portrait',pageMargins:[M,M,M,M],content:c,defaultStyle:{font:'Roboto',fontSize:10.5,lineHeight:1.15},info:{title:doc.title,author:st.guru||'Teacher Dev'}};
}
async function savePdf(doc){
  toast('Menyiapkan PDF…');
  try{const pm=await loadPdfmake();const blob=await new Promise((res,rej)=>{try{pm.createPdf(pdfDef(doc)).getBlob(res)}catch(e){rej(e)}});await saveFile(doc.name+'.pdf',blob)}
  catch(e){console.error(e);toast('Gagal membuat PDF. Coba lagi atau pilih Word.')}
}
async function saveWord(doc){
  toast('Menyiapkan file Word…');
  try{
    const d=await loadDocx();const {Document,Packer,Paragraph,TextRun,AlignmentType,TabStopType,BorderStyle,Table,TableRow,TableCell,WidthType,PageOrientation,ShadingType}=d;const st=S();
    const F='Calibri';const R=(t,o)=>new TextRun(Object.assign({text:String(t==null?'':t),font:F,size:21},o||{}));
    const land=doc.orient==='l';const tw=(mm)=>Math.round(mm*56.693);const W=tw(FOLIO.wmm),H=tw(FOLIO.hmm),M=tw(FOLIO.mcm*10);const cw=(land?H:W)-2*M;
    const ch=[];const P=(runs,o)=>new Paragraph(Object.assign({children:[].concat(runs)},o||{}));
    const nb={style:BorderStyle.NONE,size:0,color:'FFFFFF'};const noB={top:nb,bottom:nb,left:nb,right:nb};const noTB=Object.assign({insideHorizontal:nb,insideVertical:nb},noB);
    doc.blocks.forEach(bk=>{switch(bk.t){
      case 'title':if(bk.text)ch.push(P(R(bk.text,{bold:true,size:bk.big?28:22}),{alignment:AlignmentType.CENTER}));break;
      case 'sub':ch.push(P(R(bk.text,{size:18}),{alignment:AlignmentType.CENTER,spacing:{after:40}}));break;
      case 'hr':ch.push(P(R(''),{spacing:{after:160},border:{bottom:{style:BorderStyle.SINGLE,size:12,color:'8A6CC8',space:1}}}));break;
      case 'h':ch.push(P(R(bk.text,{bold:true,size:bk.sm?20:23,color:'5A3D9C'}),{spacing:bk.sm?{before:140,after:20}:{before:200,after:60},keepNext:true}));break;
      case 'p':ch.push(P(R(bk.text,{italics:!!bk.i,bold:!!bk.b,size:bk.size?Math.round(bk.size*2):21}),{spacing:bk.sm?{before:0,after:20,line:240}:{before:bk.b?60:0,after:bk.b?20:80},keepNext:!!bk.b,indent:bk.indent?{left:400}:undefined}));break;
      case 'list':bk.items.forEach((x,i)=>ch.push(P([R((i+1)+'.\t'),R(x)],{tabStops:[{type:TabStopType.LEFT,position:360}],indent:{left:360,hanging:360},spacing:{after:40}})));break;
      case 'kv':ch.push(new Table({width:{size:cw,type:WidthType.DXA},columnWidths:[2400,cw-2400],borders:noTB,rows:bk.rows.map(r=>new TableRow({children:[new TableCell({borders:noB,width:{size:2400,type:WidthType.DXA},children:[P(R(r[0],{bold:true}))]}),new TableCell({borders:noB,width:{size:cw-2400,type:WidthType.DXA},children:[P(R(r[1]))]})]}))}));ch.push(P(R('')));break;
      case 'id':ch.push(P([R('Nama: ....................................................................   Kelas: ..............   No. absen: ........',bk.sm?{size:19}:{})],{spacing:bk.sm?{before:0,after:40}:{before:40,after:120}}));break;
      case 'q':ch.push(P([R(bk.no+'.\t',bk.sm?{size:19}:{}),R(bk.text,{italics:!!bk.i,color:bk.i?'555555':undefined,size:bk.sm?20:22})],{tabStops:[{type:TabStopType.LEFT,position:400}],indent:{left:400,hanging:400},spacing:bk.sm?{before:80,after:20,line:250}:{before:160,after:40},keepNext:true}));break;
      case 'ans':ch.push(P([R('Jawaban: ',{bold:true,color:'5A3D9C'}),R(bk.text)],{indent:{left:400},spacing:{after:80}}));break;
      case 'lines':for(let i=0;i<bk.n;i++)ch.push(P(R('\t',{color:'999999'}),{indent:{left:400},spacing:{before:bk.sm?140:200,after:0},keepNext:i<bk.n-1,tabStops:[{type:TabStopType.RIGHT,position:cw-20,leader:'dot'}]}));break;
      case 'table':{const n=bk.head.length;const sz=n>24?12:n>16?14:n>10?16:18;
        const wide=bk.head.map(h=>WIDE_RE.test(h));
        const wt=bk.head.map((h,j)=>{const hw=Math.max(...String(h).split(/\s+/).map(x=>x.length));const L=Math.max(0,...bk.rows.map(r=>String(r[j]==null?'':r[j]).length));return wide[j]?Math.max(18,Math.min(L,60)):Math.max(hw,Math.min(L,14))+1.5});
        const tot=wt.reduce((a,b)=>a+b,0);const ws=wt.map(x=>Math.floor(cw*x/tot));
        const cell=(t,j,hd)=>new TableCell({width:{size:ws[j],type:WidthType.DXA},margins:{left:40,right:40,top:20,bottom:20},shading:hd?{type:ShadingType.CLEAR,color:'auto',fill:'EFE6FC'}:undefined,children:String(t).split('\n').map(line=>P(R(line,{size:sz,bold:hd}),{alignment:hd||!wide[j]?AlignmentType.CENTER:AlignmentType.LEFT}))});
        ch.push(new Table({width:{size:cw,type:WidthType.DXA},columnWidths:ws,rows:[new TableRow({tableHeader:true,children:bk.head.map((h,j)=>cell(h,j,true))})].concat(bk.rows.map(r=>new TableRow({cantSplit:true,children:r.map((v,j)=>cell(v,j,false))})))}));ch.push(P(R('')));break}
      case 'sign':{const half=Math.floor(cw/2);
        const col=(lines)=>new TableCell({borders:noB,width:{size:half,type:WidthType.DXA},children:lines.map(l=>P(R(l.t,{bold:!!l.b}),{spacing:{before:l.gap?900:0}}))});
        ch.push(new Table({width:{size:cw,type:WidthType.DXA},columnWidths:[half,half],borders:noTB,rows:[new TableRow({cantSplit:true,children:[
          col([{t:'Mengetahui,'},{t:'Kepala Sekolah'},{t:st.kepsek||'...............................',b:1,gap:1},{t:'NIP '+(st.nipKepsek||'')}]),
          col([{t:tglPanjang()},{t:'Guru Mata Pelajaran'},{t:st.guru||'...............................',b:1,gap:1},{t:'NIP '+(st.nip||'')}])]})]}));break}
      case 'br':ch.push(P(R(''),{pageBreakBefore:true}));break;
    }});
    const wdoc=new Document({creator:st.guru||'Teacher Dev',title:doc.title,sections:[{properties:{page:{size:{width:W,height:H,orientation:land?PageOrientation.LANDSCAPE:PageOrientation.PORTRAIT},margin:{top:M,bottom:M,left:M,right:M,header:M,footer:M}}},children:ch}]});
    const blob=await Packer.toBlob(wdoc);await saveFile(doc.name+'.docx',blob);
  }catch(e){console.error(e);toast('Gagal membuat file Word. Coba lagi atau pilih PDF.')}
}

function docKuis(m,kz,mode){
  const isian=/isian/i.test(kz.jenis);const bl=[];const st=S();const sub='Mata pelajaran '+(st.mapel||'IPA')+' · '+(m.kode||'')+' '+(m.judul||'')+(st.tahun?' · TP '+st.tahun:'');
  if(mode!=='kunci'){bl.push(...docHead(kz.judul,sub),{t:'id'},{t:'p',i:true,text:'Petunjuk: '+(isian?'Isilah titik-titik berikut dengan jawaban yang tepat!':'Jawablah pertanyaan berikut dengan jelas dan lengkap!')});
    kz.soal.forEach((q,i)=>{bl.push({t:'q',no:i+1,text:isian?q.q.replace(/…/g,'.........................'):q.q});if(!isian)bl.push({t:'lines',n:4})})}

function vKalender(){
  const [y,mo]=ui.cal.split('-').map(Number);
  const first=new Date(y,mo-1,1);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const evs=events();const t=today();
  const agDates={};kelasList().forEach(k=>K(k).agenda.forEach(a=>{agDates[a.tanggal]=(agDates[a.tanggal]||0)+1}));
  let cells='';['Sen','Sel','Rab','Kam','Jum','Sab','Min'].forEach(h=>cells+='<div class="h">'+h+'</div>');
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d);
    if(i%7===0&&i>0&&(d.getMonth()!==mo-1)&&d>first)break;
    const de=evs.filter(e=>e.mulai<=s&&(e.selesai||e.mulai)>=s);
    cells+='<div class="d'+(d.getMonth()!==mo-1?' out':'')+(d.getDay()===0?' sun':'')+(s===t?' today':'')+'" data-act="calday" data-d="'+s+'"><span class="n">'+d.getDate()+'</span>'+
      (agDates[s]?'<span class="dot" title="'+agDates[s]+' agenda mengajar"></span>':'')+
      de.slice(0,3).map(e=>'<span class="ev j-'+esc(e.jenis)+'" title="'+esc(e.judul)+'">'+esc(e.judul)+'</span>').join('')+(de.length>3?'<span class="small muted">+'+(de.length-3)+'</span>':'')+'</div>';
  }
  const mStart=ui.cal+'-01',mEnd=ui.cal+'-31';
  const list=evs.filter(e=>e.mulai<=mEnd&&(e.selesai||e.mulai)>=mStart).sort((a,b)=>a.mulai.localeCompare(b.mulai));
  // hari efektif (Senin–Jumat tanpa libur/asesmen penuh)
  let ef=0;const dd=new Date(y,mo-1,1);
  while(dd.getMonth()===mo-1){const s=iso(dd);const w=dd.getDay();if(w>=1&&w<=5&&!evs.some(e=>e.mulai<=s&&(e.selesai||e.mulai)>=s&&/libur|cuti/.test(e.jenis)))ef++;dd.setDate(dd.getDate()+1)}
  const right='<button class="btn pri" data-act="evnew">'+ic('plus')+'Tambah</button>';
  return head('Kalender Akademik',esc(S().tahun?'Tahun pelajaran '+S().tahun:''),right)+

  (ui.cal!==t.slice(0,7)?'<button class="btn sm ghost" data-act="calnow">Bulan ini</button>':'')+'<span style="flex:1"></span><span class="pill acc">'+ef+' hari sekolah (Sen–Jum)</span></div>'+
  '<div class="cal">'+cells+'</div>'+
  '<div class="legend">'+Object.entries(JENIS).map(([k,v])=>'<span class="ev j-'+k+'" style="font-size:12px">'+v+'</span>').join('')+'<span class="small muted" style="display:inline-flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block"></span>ada agenda mengajar</span></div>'+

function parseBulk(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    let p=l.split('\t').map(x=>x.trim()).filter(x=>x!=='');
    if(p.length===1&&/[;,]/.test(l)&&/^\d/.test(l))p=l.split(/[;,]/).map(x=>x.trim()).filter(Boolean);
    if(p.length>1&&/^\d{1,3}\.?$/.test(p[0])&&p.length>=2&&!/^\d{4,}/.test(p[0]))p=p.slice(1); // buang nomor urut
    let nis='',nama='',jk='';
    p.forEach(x=>{if(!nis&&/^\d{4,}$/.test(x.replace(/[\s.]/g,'')))nis=x;else if(!jk&&/^(L|P)$/i.test(x))jk=x.toUpperCase();else if(!nama)nama=x});
    if(!nama&&p.length===1)nama=p[0];
    nama=nama.replace(/^\d+[.)]\s*/,'').trim();
    return nama?{id:uid(),nis,nama,jk}:null;
  }).filter(Boolean);
}

      askConfirm('Pulihkan data dari cadangan tanggal <b>'+esc((o.dibuat||'').slice(0,10))+'</b>? Isinya: '+tdRingkas(o.data)+'. Data yang sekarang akan diganti.','Pulihkan',async()=>{let n=0;Object.keys(o.data).forEach(p=>{if(/^(app|kelas|tugas|kuis|asesmen|slides|arsip)\/[A-Za-z0-9_.\-~:@+]+$/.test(p)){put(p,o.data[p]);n++}});render();tdInfo('⏳ Sedang menyimpan '+n+' bagian data…','Mohon tunggu dan jangan tutup halaman ini.');for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,500));if(!Object.keys(Store.timers).length&&!Object.values(Store.writing).some(Boolean))break}const err=Object.keys(Store.timers).length||Object.values(Store.writing).some(Boolean);if(Store.mode==='db'&&!err)tdInfo('✅ Data berhasil dipulihkan','Semua isi cadangan sudah dimasukkan dan <b>tersimpan di akun</b>, jadi bisa dibuka dari perangkat mana pun.<br><br>Yang dipulihkan: '+tdRingkas(o.data)+'.','#1f7a4d');else if(Store.mode==='db')tdInfo('⏳ Masih menyimpan…','Sebagian data masih dikirim ke akun. Biarkan halaman tetap terbuka sampai tanda simpan di atas berubah menjadi <b>Tersimpan</b>.','#b45309');else tdInfo('⚠️ Data dipulihkan, tapi BELUM tersimpan di akun','Isi cadangan sudah masuk ('+tdRingkas(o.data)+'), tetapi aplikasi sedang dalam <b>mode lokal</b>, jadi data hanya tersimpan di browser perangkat ini.<br><br>Pastikan sudah login claude.ai, buka lewat Chrome/Safari, muat ulang, lalu pulihkan lagi.','#b45309')})}catch(err){toast('File cadangan tidak valid')}};fr.readAsText(t.files[0]);t.value='';
  }
});
document.addEventListener('keydown',(e)=>{
  const t=e.target;
  if(SV){if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();moveSlide(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();moveSlide(-1)}else if(e.key==='Escape'&&!document.fullscreenElement)closeSlides();return}
  if(e.key==='Escape'&&$('#layer').children.length){closeLayer();return}
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(e.key==='z'||e.key==='Z')&&!(/INPUT|TEXTAREA|SELECT/.test(t.tagName)&&!t.classList.contains('cell')&&t.type!=='checkbox')){e.preventDefault();if(t.classList&&t.classList.contains('cell'))t.blur();undo();return}
  if(t.classList&&t.classList.contains('cell')&&(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();const ri=+t.dataset.ri+(e.key==='ArrowUp'?-1:1);
    const nx=$('input.cell[data-ri="'+ri+'"][data-ci="'+t.dataset.ci+'"]');
    if(nx){nx.focus();nx.select()}else t.blur();
  }
});

/* ---------- picker nilai ---------- */
let pickEl=null,pickInp=null;
function hidePick(){if(pickEl){pickEl.remove();pickEl=null}pickInp=null}
function placePick(){
  if(!pickEl||!pickInp)return;
  if(!document.body.contains(pickInp)){hidePick();return}
  const r=pickInp.getBoundingClientRect(),w=pickEl.offsetWidth,h=pickEl.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  let top=r.bottom+6;if(top+h>vh-70)top=r.top-h-6;if(top<6)top=6;
  let left=r.left+r.width/2-w/2;left=Math.max(8,Math.min(left,vw-w-8));
  pickEl.style.top=top+'px';pickEl.style.left=left+'px';
}
function showPick(inp){
  const nd=nilaiDoc(K(curKelas()),ui.sem);const col=nd.kolom.find(c=>c.id===inp.dataset.kid);
  const st=K(curKelas()).siswa.find(x=>x.id===inp.dataset.sid);
  const s=S();const cur=(nd.data[inp.dataset.sid]||{})[inp.dataset.kid];
  const uj=isUjian(col);
  const nums=uj?[]:[100,98,95,90,85,80].filter(n=>n>=s.min&&n<=s.max);
  const b=(v,cls,lab)=>'<button type="button" data-pv="'+esc(v)+'" class="'+cls+(String(cur)===String(v)?' on':'')+'">'+lab+'</button>';
  let html='<div class="nm">'+esc(st?st.nama:'')+' · '+esc(col?col.nama:'')+'</div>';
  if(!uj)html+='<div class="rw">'+Object.entries(s.konversi).map(([a,n])=>b(a,'p',esc(a)+'<small>'+n+'</small>')).join('')+'</div><div class="rw">'+nums.map(n=>b(n,'',n)).join('')+'</div>';
  else html+='<div class="small muted" style="max-width:240px;padding:0 2px">Nilai '+esc(col.jenis)+': ketik angka 0–100.</div>';
  html+='<div class="rw">'+b('__del','x','Hapus')+(COARSE?'<button type="button" class="k" data-pv="__type">⌨ Ketik</button>':'')+'<button type="button" class="k" data-pv="__close">Tutup</button></div>';
  if(!pickEl){pickEl=document.createElement('div');pickEl.className='npick';document.body.appendChild(pickEl);
    pickEl.addEventListener('pointerdown',e=>e.preventDefault());
    pickEl.addEventListener('click',onPick);}
  pickEl.innerHTML=html;pickInp=inp;placePick();
  if(uj&&COARSE&&inp.inputMode==='none'){inp.inputMode='decimal';inp.blur();setTimeout(()=>inp.focus(),30)}
}
function onPick(e){
  const btn=e.target.closest('button[data-pv]');if(!btn||!pickInp)return;
  const v=btn.dataset.pv,inp=pickInp;
  if(v==='__close'){inp.blur();hidePick();return}
  if(v==='__type'){inp.inputMode='text';inp.blur();setTimeout(()=>{inp.focus();inp.select()},30);return}
  setNilai(inp.dataset.sid,inp.dataset.kid,v==='__del'?null:(/^\d/.test(v)?Number(v):v));
  const nx=$('input.cell[data-ri="'+(+inp.dataset.ri+1)+'"][data-ci="'+inp.dataset.ci+'"]');
  if(nx){nx.focus();nx.scrollIntoView({block:'nearest',inline:'nearest'});}else{inp.blur();hidePick()}
}
document.addEventListener('focusin',e=>{const t=e.target;if(t.classList&&t.classList.contains('cell')&&!ui.chip)showPick(t);else if(pickEl&&!(t.closest&&t.closest('.npick')))hidePick()});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('cell'))setTimeout(()=>{const a=document.activeElement;if(!(a&&a.classList&&a.classList.contains('cell')))hidePick()},120)});
window.addEventListener('scroll',placePick,true);window.addEventListener('resize',placePick);

boot();
})();
</script>
