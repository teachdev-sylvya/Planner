(function(){

  function txt(c){var f=c.querySelector('input,select,textarea');if(f&&c.children.length===1)return String(f.value||f.placeholder||'');return c.textContent||''}
  function mark(){var cells=document.querySelectorAll('td,th');for(var i=0;i<cells.length;i++){var c=cells[i];
    if(c.closest&&c.closest('.kartu,.no-al,table.nb')){c.classList.remove('al-c');continue}var t=txt(c).replace(/\s+/g,' ').trim();var on=c.tagName==='TH'?(c.colSpan>1||t.length<=14):(t!==''&&t.length<=14&&(NUM.test(t)||KLS.test(t)||GRD.test(t)));
    if(on)c.classList.add('al-c');else c.classList.remove('al-c')}}
  var q=false;function sched(){if(q)return;q=true;requestAnimationFrame(function(){q=false;try{mark()}catch(e){}})}
  function start(){mark();new MutationObserver(sched).observe(document.body,{childList:true,subtree:true,characterData:true})}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();

})();

function persist(c,id,obj){

  const once=()=>body?S.db.collection(c).doc(id).set(body):S.db.collection(c).doc(id).delete();
  const run=async()=>{touched[k]=Date.now();for(let a=0;a<5;a++){try{await once();touched[k]=Date.now();return}catch(e){const code=e&&e.code;if((code==='unavailable'||code==='resource_exhausted')&&a<4){await new Promise(r=>setTimeout(r,(code==='resource_exhausted'?1500:500)*(a+1)+Math.random()*400));continue}writeErr(e);return}}};

async function initStore(){
  let db=null;
  try{if(window.__claudeX&&__claudeX.use){db=await __claudeX.use('db');__claudeX.use('downloads').then(d=>{S.dl=d;}).catch(()=>{})}}catch(e){db=null}

  S.db=db;S.mode='db';setBanner('Memuat data…');
  const timer=setTimeout(()=>{if(S.loaded.size<COLS.length+1)setBanner('Data belum bisa dijangkau. Periksa koneksi; halaman akan memperbarui otomatis.')},10000);
  const done=()=>{if(S.loaded.size>=COLS.length+1){clearTimeout(timer);setBanner('');}};
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      let ch=false;
      snap.docChanges().forEach(x=>{
        const d=x.doc,k=c+'/'+d.id;
        if(touched[k]&&Date.now()-touched[k]<4000)return;
        if(d.metadata&&d.metadata.hasPendingWrites)return;
        if(x.type==='removed'){SH(c,d.id,null);if(S.data[c][d.id]){delete S.data[c][d.id];ch=true}}
        else{const v=Object.assign({},d.data(),{id:d.id});if(c==='siswa'&&v.nama)v.nama=NMS(v.nama);SH(c,d.id,v);if(stable(v)!==stable(S.data[c][d.id]||null)){S.data[c][d.id]=v;ch=true}}
      });
      if(!snap.metadata.fromCache){S.loaded.add(c);done()}
      if(ch||!S.firstRendered)scheduleRender();
    },e=>{S.loaded.add(c);done();if(e&&e.code==='revoked')setBanner('Akses ke data dicabut.')});
  });
  db.doc('pengaturan/ttd').onSnapshot(d=>{const k='pengaturan/ttd';if(touched[k]&&Date.now()-touched[k]<4000)return;const v=d.exists?d.data():{};if(v.ttd!==S.ttdKS||v.cap!==S.capKS||!!v.gabung!==!!S.ttdGabung){S.ttdKS=v.ttd||null;S.capKS=v.cap||null;S.ttdGabung=!!v.gabung;scheduleRender()}},()=>{});
  db.doc('pengaturan/kop').onSnapshot(d=>{const k='pengaturan/kop';if(touched[k]&&Date.now()-touched[k]<4000)return;const v=d.exists?d.data().data:null;if(v!==S.kop){S.kop=v;S.kopData=null;scheduleRender()}},()=>{});
  db.doc('pengaturan/sekolah').onSnapshot(d=>{
    const k='pengaturan/sekolah';
    if(!(touched[k]&&Date.now()-touched[k]<4000)&&d.exists){S.cfg=Object.assign(JSON.parse(JSON.stringify(DEF_CFG)),d.data());CFGSH=clone(S.cfg);scheduleRender()}
    if(!d.metadata.fromCache){S.loaded.add('cfg');done()}
  },()=>{S.loaded.add('cfg');done()});
  try{const u=await __claudeX.use('user');if(u&&u.can){const w=await u.can('data.write');if(w===false){S.readOnly=true;setBanner('Anda hanya memiliki akses melihat.')}}}catch(e){}
  render();
}

  const sts=num(row.sts),sas=num(row.sas);

  const w=parts.reduce((s,p)=>s+p[1],0);if(!parts.length||!w)return null;

function openModal(html,wide){const b=$('#mbox');b.className='mbox'+(wide?' wide':'');b.innerHTML=html;$('#modal').classList.remove('hidden');setTimeout(()=>{const f=b.querySelector('input,select,textarea');if(f&&!wide)f.focus()},30)}

/* ============================ FORM GENERIK ============================ */
function fieldHTML(f,v){
  const id='f_'+f.k;const full=f.full?' full':'';
  if(f.t==='textarea')return `<label class="full">${esc(f.l)}<textarea id="${id}" rows="3">${esc(v)}</textarea></label>`;
  if(f.t==='select'){const o=(typeof f.o==='function'?f.o():f.o);return `<label class="${full}">${esc(f.l)}<select id="${id}">${o.map(x=>{const [val,lab]=Array.isArray(x)?x:[x,x];return `<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(lab)}</option>`}).join('')}</select></label>`}
  if(f.t==='multi'){const o=(typeof f.o==='function'?f.o():f.o);const arr=v||[];return `<label class="full">${esc(f.l)}<div class="checks" id="${id}">${o.map(x=>`<label><input type="checkbox" value="${esc(x)}" ${arr.includes(x)?'checked':''}>${esc(x)}</label>`).join('')||'<span class="muted">Belum ada pilihan</span>'}</div></label>`}
  return `<label class="${full}">${esc(f.l)}<input id="${id}" type="${f.t||'text'}" value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}></label>`;
}
function readForm(fields){const o={};fields.forEach(f=>{const el=$('#f_'+f.k);if(!el)return;if(f.t==='multi')o[f.k]=[...el.querySelectorAll('input:checked')].map(i=>i.value);else if(f.t==='number')o[f.k]=el.value===''?'':Number(el.value);else o[f.k]=el.value.trim()});return o}
function formModal(title,fields,rec,onSave){

  $('#fsave').onclick=()=>{const o=readForm(fields);const req=fields.find(f=>f.req&&!o[f.k]);if(req){toast(req.l+' wajib diisi');return}onSave(Object.assign({},rec||{},o));closeModal();toast('Tersimpan')};
}

function sinkronDapodik(){
  openModal(`<h2>Sinkron data siswa dari Dapodik</h2>

  <div class="card" style="margin:10px 0"><b>Atau pilih file unduhan Dapodik (.xlsx)</b><div class="small muted">Menu Dapodik → Peserta Didik → Unduh. File tidak diunggah ke mana pun, dibaca di browser ini saja.</div><input type="file" id="dpFile" accept=".xlsx,.xls" style="margin-top:6px"></div>

  $('#dpFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#dpInfo').textContent='Membaca file…';
    try{await dapoLib();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const recs=dapoParse(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}));
      if(!recs.length){$('#dpInfo').textContent='Kolom NISN / Rombel Saat Ini tidak ditemukan. Pastikan ini file daftar peserta didik dari Dapodik.';return}
      dapoPratinjau(recs,f.name)}catch(err){$('#dpInfo').textContent='Gagal membaca file: '+err.message}}
}
function dapoLib(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('pustaka Excel tidak bisa dimuat'));document.head.appendChild(s)})}
function dapoParse(rows){
  const hi=rows.findIndex(r=>r.some(x=>String(x).trim()==='NISN')&&r.some(x=>String(x).trim()==='Rombel Saat Ini'));if(hi<0)return [];
  const H=rows[hi].map(x=>String(x).trim()),c=n=>H.indexOf(n),s=x=>String(x??'').trim(),ok=x=>!['','-','0'].includes(s(x));
  const AG={Budha:'Buddha',Katholik:'Katolik',Khonghucu:'Konghucu'};const iA=c('Data Ayah'),iI=c('Data Ibu'),iW=c('Data Wali');
  const tgl=x=>{x=s(x);let m=x.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=x.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return x};
  return rows.slice(hi+1).filter(r=>s(r[c('Nama')])&&/\d/.test(s(r[c('NISN')])+s(r[c('NIPD')]))).map(r=>{
    const rt=s(r[c('RT')]),rw=s(r[c('RW')]);
    const al=[ok(r[c('Alamat')])?s(r[c('Alamat')]):'',ok(rt)?`RT ${rt.padStart(3,'0')}/RW ${rw.padStart(3,'0')}`:'',...['Dusun','Kelurahan','Kecamatan'].map(n=>ok(r[c(n)])?s(r[c(n)]):'')].filter(Boolean).join(', ');
    return {nis:s(r[c('NIPD')]),nisn:s(r[c('NISN')]),nama:s(r[c('Nama')]),jk:s(r[c('JK')]).toUpperCase().startsWith('P')?'P':'L',rombel:s(r[c('Rombel Saat Ini')]).replace(/\s+/g,''),
      tempatLahir:s(r[c('Tempat Lahir')]),tglLahir:tgl(r[c('Tanggal Lahir')]),agama:AG[s(r[c('Agama')])]||s(r[c('Agama')]),ortu:[iA,iI,iW].map(i=>i>=0&&ok(r[i])?s(r[i]):'').find(Boolean)||'',hp:ok(r[c('HP')])?s(r[c('HP')]):'',alamat:al}})}
function dapoKelas(rb){const R={7:'VII',8:'VIII',9:'IX'};const m=String(rb).toUpperCase().match(/^(VII|VIII|IX|7|8|9)\s*-?\s*([A-Z])$/);if(!m)return null;const t=R[m[1]]||m[1];
  return get('kelas','k'+({VII:7,VIII:8,IX:9}[t]||t)+m[2])||kelasList().find(k=>k.nama.toUpperCase().replace(/[\s-]+/g,' ').trim()===t+' '+m[2])||null}
function dapoPratinjau(recs,sumber){
  const S0=all('siswa'),nz=x=>String(x||'').replace(/\D/g,''),key=s=>String(s.nama||'').toUpperCase().replace(/\s+/g,' ').trim()+'|'+(s.tglLahir||'');
  const byN={},byS={},byK={};S0.forEach(s=>{if(nz(s.nisn))byN[nz(s.nisn)]=s;if(nz(s.nis))byS[nz(s.nis)]=s;byK[key(s)]=s});
  const F=['nama','jk','nis','nisn','kelasId','tempatLahir','tglLahir','agama'],ISI=['ortu','hp','alamat'],LBL={nama:'nama',jk:'L/P',nis:'NIS',nisn:'NISN',kelasId:'kelas',tempatLahir:'tempat lahir',tglLahir:'tgl lahir',agama:'agama'};
  const P={baru:[],pindah:[],ubah:[],sama:0,tanpaKelas:[],out:[]};const seen=new Set();
  const MT=new Map(),used=new Set();[r=>nz(r.nisn)&&byN[nz(r.nisn)],r=>nz(r.nis)&&byS[nz(r.nis)],r=>byK[key(r)]].forEach(fn=>recs.forEach(r=>{if(MT.has(r))return;const e=fn(r);if(e&&!used.has(e.id)){MT.set(r,e);used.add(e.id)}}));
  recs.forEach(r=>{const k=dapoKelas(r.rombel);if(!k)P.tanpaKelas.push(r);const v={...r,kelasId:k?.id||''};delete v.rombel;
    const ex=MT.get(r);
    if(!ex){const o={...v,status:'Aktif',id:'s'+(nz(r.nisn)||nz(r.nis)||uid())};P.baru.push(o);P.out.push(o);return}
    seen.add(ex.id);const o=clone(ex);const beda=[];
    const U=x=>String(x||'').toUpperCase().replace(/\s+/g,' ').trim();F.forEach(f=>{if(v[f]&&U(v[f])!==U(ex[f])){if(f!=='kelasId')beda.push(LBL[f]);o[f]=v[f]}});ISI.forEach(f=>{if(v[f]&&!ex[f]){o[f]=v[f];beda.push(f)}});
    if((ex.status||'Aktif')!=='Aktif'){o.status='Aktif';beda.push('status')}
    const pindah=v.kelasId&&v.kelasId!==ex.kelasId;
    if(pindah)P.pindah.push({s:o,dari:ex.kelasId});else if(beda.length)P.ubah.push({s:o,beda});
    if(pindah||beda.length)P.out.push(o);else P.sama++});
  P.hilang=S0.filter(s=>!seen.has(s.id)&&(s.status||'Aktif')==='Aktif'&&!P.baru.some(b=>b.id===s.id));
  const li=(arr,f,n=40)=>arr.length?`<ul class="small" style="margin:4px 0;padding-left:18px">${arr.slice(0,n).map(f).join('')}${arr.length>n?`<li class="muted">… dan ${arr.length-n} lagi</li>`:''}</ul>`:'<div class="small muted">Tidak ada.</div>';
  openModal(`<h2>Pratinjau sinkron Dapodik</h2><p class="small muted">Sumber: ${esc(sumber||'')} · ${recs.length} siswa di Dapodik · ${S0.length} data di aplikasi</p>
  <div style="max-height:56vh;overflow:auto">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0"><div class="kpi"><div class="l">sudah sama</div><div class="v">${P.sama}</div></div><div class="kpi"><div class="l">pindah kelas</div><div class="v">${P.pindah.length}</div></div><div class="kpi"><div class="l">data diperbarui</div><div class="v">${P.ubah.length}</div></div><div class="kpi"><div class="l">siswa baru</div><div class="v">${P.baru.length}</div></div><div class="kpi"><div class="l">tidak ada di Dapodik</div><div class="v">${P.hilang.length}</div></div></div>
  <h3>Pindah kelas</h3>${li(P.pindah,x=>`<li>${esc(x.s.nama)}: ${esc(kNama(x.dari)||'—')} → <b>${esc(kNama(x.s.kelasId))}</b></li>`)}
  <h3>Data diperbarui</h3>${li(P.ubah,x=>`<li>${esc(x.s.nama)} (${esc(kNama(x.s.kelasId))}): ${esc(x.beda.join(', '))}</li>`)}
  <h3>Siswa baru</h3>${li(P.baru,x=>`<li>${esc(x.nama)} · ${esc(kNama(x.kelasId)||'tanpa kelas')} · NISN ${esc(x.nisn)}</li>`)}
  ${P.tanpaKelas.length?`<h3>Rombel tidak dikenali</h3>${li(P.tanpaKelas,x=>`<li>${esc(x.nama)}: "${esc(x.rombel)}"</li>`)}`:''}
  <h3>Aktif di aplikasi, tidak ada di Dapodik</h3>${li(P.hilang,x=>`<li>${esc(x.nama)} · ${esc(kNama(x.kelasId)||'—')}</li>`)}
  ${P.hilang.length?`<label class="small"><input type="checkbox" id="dpMut"> Ubah status ${P.hilang.length} siswa ini menjadi <b>Mutasi Keluar</b></label>`:''}
  </div><div class="mfoot"><span class="small muted" style="margin-right:auto">Bisa dibatalkan dengan ↶ Urungkan.</span><button class="btn" onclick="closeModal()">Batal</button><button class="btn p" id="dpGo">Simpan perubahan</button></div>`);
  $('#dpGo').onclick=async()=>{const arr=P.out.slice();if($('#dpMut')?.checked)P.hilang.forEach(s=>arr.push(Object.assign(clone(s),{status:'Mutasi Keluar'})));closeModal();
    if(!arr.length){toast('Data siswa sudah sama dengan Dapodik');return}
    await bulk('siswa',arr,'Sinkron Dapodik');S.cfg.dapodikSinkron={tgl:Date.now(),sumber:sumber||''};saveCfg();toast(arr.length+' data siswa diperbarui dari Dapodik')}}

function dukSticky(){document.querySelectorAll('.dukwrap table.duk').forEach(t=>{

const BULAN_P=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function dukPer(){return UI.dukPer||today().slice(0,7)}
function dukPerL(){const [y,m]=dukPer().split('-');return BULAN_P[+m-1]+' '+y}
function perEnd(per){const [y,m]=per.split('-').map(Number);return new Date(y,m,0)}
function mkAt(g,per){const e=perEnd(per);
  if(g.mkTahun!==''&&g.mkTahun!=null&&g.mkPer){const [y,m]=g.mkPer.split('-').map(Number);const add=(e.getFullYear()-y)*12+(e.getMonth()+1-m);const t=(+g.mkTahun||0)*12+(+g.mkBulan||0)+add;return t<0?null:[Math.floor(t/12),t%12]}
  if(!g.tmtKerja)return null;const a=new Date(g.tmtKerja);if(isNaN(a))return null;let t=(e.getFullYear()-a.getFullYear())*12+(e.getMonth()-a.getMonth());if(e.getDate()<a.getDate())t--;return t<0?null:[Math.floor(t/12),t%12]}
function usiaAt(d,per){if(!d)return '';const a=new Date(d),b=perEnd(per);if(isNaN(a))return '';let y=b.getFullYear()-a.getFullYear();if(b.getMonth()<a.getMonth()||(b.getMonth()===a.getMonth()&&b.getDate()<a.getDate()))y--;return y}
const dmy=d=>{if(!d)return '';const x=String(d).split('-');return x.length===3?x[2]+'-'+x[1]+'-'+x[0]:d};
const ttlL=g=>{const t=g.tglLahir?(()=>{const [y,m,d]=g.tglLahir.split('-');return y&&m&&d?`${+d} ${BULAN_P[+m-1]} ${y}`:g.tglLahir})():'';return [g.tempatLahir,t].filter(Boolean).join(', ')};
const pangkatDUK=g=>g.pangkat||(String(g.gol||'').startsWith('PPPK ')?g.gol.slice(5):(GOL.find(x=>x[0]===g.gol)?.[1]||'').replace(/^(\S+) (.*)$/,'$2, $1'));
const ketDUK=g=>({'PPPK':'P3K','PPPK Paruh Waktu':'P3K PW'})[g.status]||g.status||'';
function dukRow(g,per){const mk=mkAt(g,per);return [ttlL(g),g.nip||'',pangkatDUK(g),dmy(g.tmtGol),g.jabatan||'',dmy(g.tmtJabatan),mk?mk[0]:'',mk?mk[1]:'',g.ptNama||'',g.lulusTahun||'',g.pendidikan||'',g.jurusan||'',usiaAt(g.tglLahir,per),g.catatanMutasi||'',ketDUK(g)]}
function dukHead(){return `<thead><tr><th rowspan="2" class="sl0">NO URUT</th><th rowspan="2" class="sl1">NAMA</th><th rowspan="2">TEMPAT, TGL LAHIR</th><th rowspan="2">NIP</th><th colspan="2">PANGKAT</th><th colspan="2">JABATAN</th><th colspan="2">MASA KERJA KESELURUHAN</th><th colspan="4">PENDIDIKAN</th><th rowspan="2">USIA</th><th rowspan="2">CATATAN MUTASI</th><th rowspan="2">KETERANGAN</th></tr>
  <tr><th>GOL RUANG</th><th>TMT</th><th>NAMA</th><th>TMT</th><th>TAHUN</th><th>BULAN</th><th>NAMA</th><th>LULUS TAHUN</th><th>TINGKAT IJAZAH</th><th>MAPEL</th></tr>
  <tr>${Array.from({length:17},(_,i)=>`<th style="font-weight:400"${i<2?` class="sl${i}"`:''}>${i+1}</th>`).join('')}</tr></thead>`}
function dukTable(list,per,mode){
  const cen=new Set([0,4,5,7,8,9,11,12,15,17]);
  const body=list.map((g,i)=>{const r=[i+1,mode==='app'?`<b>${esc(g.nama)}</b>${isKepsek(g)?' <span class="tag pri">Kepala Sekolah</span>':''}`:esc(g.nama),...dukRow(g,per).map(v=>esc(String(v)))];
    return `<tr>${r.map((v,j)=>`<td style="${cen.has(j)?'text-align:center;':''}${[3,5,7].includes(j)?'white-space:nowrap;':''}"${j===3?' class="txt"':j<2?` class="sl${j}"`:''}>${v}</td>`).join('')}</tr>`}).join('');
  return `<table class="duk">${dukHead()}<tbody>${body}</tbody></table>`}
function dukData(){
  const gs=guruList().filter(g=>!/Non-DUK/.test(g.status||''));const jabR=j=>JAB.indexOf(j||'');
  const grp=g=>/PNS/.test(g.status||'')&&g.gol?0:/PPPK/.test(g.status||'')?1:2;
  const cmp=(a,b)=>(grp(a)-grp(b))||(golRank(b.gol)-golRank(a.gol))||String(a.tmtGol||'9').localeCompare(String(b.tmtGol||'9'))||(jabR(b.jabatan)-jabR(a.jabatan))||String(a.tmtKerja||'9').localeCompare(String(b.tmtKerja||'9'))||String(a.tglLahir||'9').localeCompare(String(b.tglLahir||'9'));
  const ks=gs.filter(isKepsek);const rest=gs.filter(g=>!ks.includes(g));
  const ber=rest.filter(g=>+g.urutDUK>0).sort((a,b)=>(+a.urutDUK)-(+b.urutDUK));
  const pend=[...ks,...ber,...rest.filter(g=>!(+g.urutDUK>0)).sort(cmp)];
  const tend=all('tendik').sort(MOD.tendik.sort);
  return {pend,tend};
}
const DUK_HEAD=['NO URUT','NAMA','TEMPAT, TGL LAHIR','NIP','GOL RUANG','TMT PANGKAT','JABATAN','TMT JABATAN','MASA KERJA (TAHUN)','MASA KERJA (BULAN)','NAMA PENDIDIKAN','LULUS TAHUN','TINGKAT IJAZAH','MAPEL','USIA','CATATAN MUTASI','KETERANGAN'];

  if(tab==='ag')return tabs+vCetakJadwal('jurnal');
  if(tab==='rekapjp'){setTimeout(dukSticky,0);return tabs+vRekapJP()}
  if(tab==='waktu')return tabs+vWaktu();
  if(tab==='p_induk')return tabs+vCetakJadwal('induk');
  if(tab==='p_indukm')return tabs+vCetakJadwal('indukm');
  if(tab==='p_hadir')return tabs+vCetakJadwal('hadir');
  if(tab==='p_rekapjp')return tabs+vCetakSimple('Rekap JP Guru',()=>[gRekapJPDoc()]);
  if(tab==='p_piket')return tabs+vCetakSimple('Jadwal Guru Piket',()=>[gPiketDoc()]);
  if(tab==='p_semua')return tabs+vPaketCetak();
  if(tab==='susun')return tabs+vSusun();
  if(tab==='versi')return tabs+vVersi();
  if(tab==='aturan')return tabs+vAturan();
  const bar=`<div class="bar">${clashes.size?`<span class="tag bad">${clashes.size} sel bentrok</span>`:'<span class="tag ok">Tidak ada bentrok</span>'}<span class="sp"></span><button class="btn" onclick="exportJadwal()">Ekspor</button><button class="btn d" onclick="kosongkanJadwal()">Kosongkan semua</button><button class="btn p" onclick="UI.tab.jadwal='susun';render()">⚡ Susun ulang</button></div>`;
  if(tab==='kelas'){
    const k=get('kelas',UI.kelasSel);const jd=get('jadwal',k.id)||{id:k.id,slots:{}};
    const ts=all('tugas').filter(t=>t.kelasId===k.id&&!get('mapel',t.mapelId)?.lintas).sort((a,b)=>(get('mapel',a.mapelId)?.urut||99)-(get('mapel',b.mapelId)?.urut||99));
    const cnt={};Object.values(jd.slots||{}).forEach(t=>cnt[t]=(cnt[t]||0)+1);
    let rows='';for(let j=1;j<=maxJam;j++){rows+=`<tr><th class="c">${j}</th>`+c.hari.map((h,hi)=>{if(j>(+c.jam[h]||0))return '<td style="background:#f3f1ec"></td>';const s=hi+'-'+j;const v=jd.slots?.[s]||'';const x=clashes.has(k.id+'|'+s);
      const lk=!!(jd.kunci&&jd.kunci[s]&&v);return `<td class="${x?'x':''}${lk?' lk':''}"><div style="display:flex;gap:3px;align-items:center"><select style="flex:1" onchange="setSlot('${k.id}','${s}',this.value)"><option value="">—</option>${ts.map(t=>`<option value="${t.id}" ${t.id===v?'selected':''}>${esc(mKode(t.mapelId))} · ${esc(short(gNama(t.guruId)))}</option>`).join('')}</select><button class="btn sm" style="padding:2px 5px" title="${lk?'Dikunci — klik untuk membuka':'Klik untuk mengunci slot ini'}" ${v?'':'disabled'} onclick="kunciSlot('${k.id}','${s}')">${lk?'🔒':'🔓'}</button></div>${x?'<div class="small" style="color:var(--bad)">bentrok</div>':''}</td>`}).join('')+'</tr>'}
    return tabs+bar+`<div class="bar"><select onchange="UI.kelasSel=this.value;render()">${kl.map(x=>`<option value="${x.id}" ${x.id===k.id?'selected':''}>${esc(x.nama)}</option>`).join('')}</select><span class="muted small">Wali kelas: ${esc(gNama(k.waliId))}</span><span class="sp"></span><span class="small muted">${Object.keys(jd.kunci||{}).filter(x=>jd.slots?.[x]).length} slot dikunci</span><button class="btn sm" onclick="kunciKelas('${k.id}',true)">🔒 Kunci semua yang terisi</button><button class="btn sm" onclick="kunciKelas('${k.id}',false)">🔓 Buka semua kunci</button></div>
    <div class="grid" style="grid-template-columns:minmax(0,3fr) minmax(220px,1fr)"><div class="tw"><table class="sched"><thead><tr><th>Jam</th>${c.hari.map((h,hi)=>`<th class="h${hi}">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card" style="margin:0"><h3>Pemenuhan JP</h3>${(()=>{const need=ts.reduce((a,t)=>a+tugasJP(t),0),cap=c.hari.reduce((a,h)=>a+(+c.jam[h]||0),0);return `<div class="small" style="margin-bottom:6px">Kebutuhan <b>${need}</b> JP · slot tersedia <b>${cap}</b> ${need>cap?'<span class="tag bad">slot kurang</span>':''}</div>`})()}<table>${ts.map(t=>{const need=tugasJP(t),got=cnt[t.id]||0;return `<tr><td class="small"><b>${esc(mKode(t.mapelId))}</b> ${esc(short(gNama(t.guruId)))}</td><td class="n"><span class="tag ${got===need?'ok':got>need?'warn':'bad'}">${got}/${need}</span></td></tr>`}).join('')}</table></div></div>`;
  }
  if(tab==='guru'){
    const gs=guruList().filter(g=>all('tugas').some(t=>t.guruId===g.id));if(!UI.guruSel||!gs.find(g=>g.id===UI.guruSel))UI.guruSel=gs[0]?.id;
    const map={};all('jadwal').forEach(jd=>Object.entries(jd.slots||{}).forEach(([s,tid])=>{const t=get('tugas',tid);if(t&&t.guruId===UI.guruSel)(map[s]=map[s]||[]).push(t)}));
    let rows='';for(let j=1;j<=maxJam;j++){rows+=`<tr><th class="c">${j}</th>`+c.hari.map((h,hi)=>{if(j>(+c.jam[h]||0))return '<td style="background:#f3f1ec"></td>';const v=map[hi+'-'+j]||[];return `<td class="${v.length>1?'x':''}"><div class="cell">${v.map(t=>`<b>${esc(kNama(t.kelasId))}</b><br>${esc(mKode(t.mapelId))}`).join('<hr>')}</div></td>`}).join('')+'</tr>'}
    const tot=Object.values(map).reduce((s,v)=>s+v.length,0);
    return tabs+bar+`<div class="bar"><select onchange="UI.guruSel=this.value;render()">${gs.map(g=>`<option value="${g.id}" ${g.id===UI.guruSel?'selected':''}>${esc(g.nama)}</option>`).join('')}</select><span class="muted small">${tot} JP terjadwal dari ${bebanGuru(get('guru',UI.guruSel)||{id:''}).jpMengajar} JP</span></div><div class="tw"><table class="sched"><thead><tr><th>Jam</th>${c.hari.map((h,hi)=>`<th class="h${hi}">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  // semua
  return tabs+bar+hlBar()+c.hari.map((h,hi)=>{const n=+c.jam[h]||0;let hd='';for(let j=1;j<=n;j++)hd+=`<th class="c">${j}</th>`;
    return `<div class="card"><h3><span class="tag h${hi}" style="font-size:13px;color:var(--ink)">${h}</span></h3><div class="tw"><table class="sched"><thead><tr><th>Kelas</th>${hd}</tr></thead><tbody>${kl.map(k=>{const jd=get('jadwal',k.id);let r='';for(let j=1;j<=n;j++){const s=hi+'-'+j;const t=get('tugas',jd?.slots?.[s]);r+=`<td class="${clashes.has(k.id+'|'+s)?'x':''}"${t?` data-g="${t.guruId}"`:''}><div class="cell">${t?`<b>${esc(mKode(t.mapelId))}</b><br><span class="muted">${esc(short(gNama(t.guruId)))}</span>${jd?.kunci?.[s]?' 🔒':''}`:''}</div></td>`}return `<tr><th class="t${k.tingkat}">${esc(k.nama)}</th>${r}</tr>`}).join('')}</tbody></table></div></div>`}).join('');
}
/* ============================ JADWAL: WAKTU, PIKET, REKAP & CETAK ============================ */
const KEG_DEF={Senin:'Upacara',Selasa:'Literasi Budaya',Rabu:'Kepramukaan',Kamis:'Budaya Membaca',Jumat:'Pengajian'};
const WAKTU_STD=[['k','07.00–07.40'],['jp','07.40–08.15'],['jp','08.15–08.50'],['jp','08.50–09.25'],['br','09.25–09.50','Istirahat'],['br','09.50–10.20','Makan Bergizi Gratis (MBG)'],['jp','10.20–10.55'],['jp','10.55–11.30'],['jp','11.30–12.05'],['br','12.05–12.40','Istirahat, Sholat & Makan (Ishoma)'],['jp','12.40–13.15'],['jp','13.15–13.50'],['jp','13.50–14.25']];
const WAKTU_JUM=[['k','07.00–07.40'],['jp','07.40–08.15'],['jp','08.15–08.50'],['jp','08.50–09.25'],['br','09.25–09.50','Istirahat'],['br','09.50–10.15','Makan Bergizi Gratis (MBG)'],['jp','10.15–10.50'],['jp','10.50–11.25']];
function waktuDef(h){return (h==='Jumat'?WAKTU_JUM:WAKTU_STD).map(([t,w,ket])=>({t,w,ket:t==='k'?(KEG_DEF[h]||'Pembiasaan'):(ket||'')}))}
function rowsHari(h){let rs=clone(S.cfg.waktu?.[h])||waktuDef(h);const need=+S.cfg.jam[h]||0;let n=rs.filter(r=>r.t==='jp').length;
  if(n>need){let keep=0;rs=rs.filter(r=>r.t!=='jp'||++keep<=need);while(rs.length&&rs[rs.length-1].t==='br')rs.pop()}
  while(n<need){rs.push({t:'jp',w:''});n++}
  let j=0;rs.forEach(r=>{if(r.t==='jp')r.j=++j;else r.j=r.t==='k'?0:null});return rs}
const kodeG=g=>{if(!g)return '';const m=String(g.kode||'').match(/\d+/);return m?String(+m[0]):String(g.kode||'')};
const kodeNum=g=>{const k=+kodeG(g);return isNaN(k)?9999:k};
const guruJadwalList=()=>guruList().filter(g=>all('tugas').some(t=>t.guruId===g.id&&get('kelas',t.kelasId))).sort((a,b)=>kodeNum(a)-kodeNum(b)||String(a.nama).localeCompare(b.nama));
const hurufK=k=>{const p=String(k?.nama||'').trim().split(/\s+/);return p.length>1?p[p.length-1]:String(k?.nama||'')};
const kk=k=>k?(k.tingkat?k.tingkat+hurufK(k):k.nama):'';
const slotT=(kid,hi,j)=>get('tugas',get('jadwal',kid)?.slots?.[hi+'-'+j]);
function petaGuru(gid){const map={};all('jadwal').forEach(jd=>Object.entries(jd.slots||{}).forEach(([s,tid])=>{const t=get('tugas',tid);if(t&&t.guruId===gid)(map[s]=map[s]||[]).push(t)}));return map}
function ringkasKelas(ks){const by={};ks.forEach(k=>{(by[k.tingkat]=by[k.tingkat]||[]).push(hurufK(k))});
  return Object.keys(by).sort().map(t=>{const L=[...new Set(by[t])].sort();const out=[];let i=0;while(i<L.length){let j=i;while(j+1<L.length&&L[j+1].length===1&&L[j].length===1&&L[j+1].charCodeAt(0)===L[j].charCodeAt(0)+1)j++;out.push(j>i?L[i]+'-'+L[j]:L[i]);i=j+1}return t+out.join(', '+t)}).join(', ')}
function mapelGuruTeks(gid){const by={};all('tugas').filter(t=>t.guruId===gid&&get('kelas',t.kelasId)).forEach(t=>{(by[t.mapelId]=by[t.mapelId]||[]).push(get('kelas',t.kelasId))});
  return Object.entries(by).sort((a,b)=>(get('mapel',a[0])?.urut||99)-(get('mapel',b[0])?.urut||99)).map(([m,ks])=>mNama(m)+' '+ringkasKelas(ks)).join('; ')}
const mapelGuruNama=gid=>[...new Set(all('tugas').filter(t=>t.guruId===gid&&get('kelas',t.kelasId)).map(t=>mNama(t.mapelId)))].join(', ');
const targetJP=gid=>all('tugas').filter(t=>t.guruId===gid&&get('kelas',t.kelasId)&&!get('mapel',t.mapelId)?.lintas).reduce((s,t)=>s+tugasJP(t),0);
const waliDari=gid=>kelasList().filter(k=>k.waliId===gid).map(k=>k.nama).join(', ');
const semTxt=()=>`Semester ${S.cfg.semester==='Genap'?'2':'1'} – Tahun Pelajaran ${String(S.cfg.tahun||'').replace('/','-')}`;
const SEKOLAH=()=>String(S.cfg.sekolah||'').toUpperCase();
const ttdDua=(kanan,namaK,nipK)=>`<div class="ttd2" style="page-break-inside:avoid;margin-top:14px"><div>Mengetahui,<br>Kepala Sekolah,${ttdBlok(TTDON())}<u>${esc(S.cfg.kepsek||'')}</u><br>NIP. ${esc(S.cfg.nipKepsek||'')}</div><div>${esc(S.cfg.tempatSK||'')}, ……………………<br>${kanan}<br><br><br><br><u>${esc(namaK||'……………………………')}</u><br>NIP. ${esc(nipK||'……………………')}</div></div>`;

/* ---- tab Rekap JP Guru ---- */
function rekapJPData(){const c=S.cfg;return guruJadwalList().map(g=>{const m=petaGuru(g.id);const per=c.hari.map((h,hi)=>{let n=0;for(let j=1;j<=(+c.jam[h]||0);j++)n+=(m[hi+'-'+j]||[]).length;return n});const tot=per.reduce((a,b)=>a+b,0);const tg=targetJP(g.id);return {g,per,tot,tg,cek:tot===tg?'OK':tot<tg?'Kurang '+(tg-tot):'Lebih '+(tot-tg)}})}
function vRekapJP(){const c=S.cfg;const R=rekapJPData();const bad=R.filter(r=>r.cek!=='OK').length;
  return `<div class="bar">${bad?`<span class="tag bad">${bad} guru belum sesuai</span>`:'<span class="tag ok">Semua guru OK</span>'}<span class="muted small">Total JP di jadwal dibandingkan dengan JP di Pembagian Tugas.</span><span class="sp"></span><button class="btn" onclick="exportTable('Rekap JP Guru',['Kode','Nama Guru','Mapel',...S.cfg.hari,'Total','Target','Cek'],rekapJPData().map(r=>[kodeG(r.g),r.g.nama,mapelGuruTeks(r.g.id),...r.per,r.tot,r.tg,r.cek]))">Salin tabel</button></div>
  <div class="tw dukwrap"><table class="duk"><thead><tr><th class="sl0">Kode</th><th class="sl1">Nama Guru</th><th>Mapel & kelas</th>${c.hari.map((h,hi)=>`<th class="h${hi}">${h}</th>`).join('')}<th>Total</th><th>Target</th><th>Cek</th></tr></thead><tbody>
  ${R.map(r=>`<tr><td class="sl0" style="text-align:center">${esc(kodeG(r.g))}</td><td class="sl1"><b>${esc(r.g.nama)}</b></td><td class="small" style="white-space:normal;min-width:220px">${esc(mapelGuruTeks(r.g.id))}</td>${r.per.map(n=>`<td style="text-align:center">${n||''}</td>`).join('')}<td style="text-align:center"><b>${r.tot}</b></td><td style="text-align:center">${r.tg}</td><td><span class="tag ${r.cek==='OK'?'ok':'bad'}">${r.cek}</span></td></tr>`).join('')}</tbody></table></div>`}

/* ---- tab Waktu & Piket ---- */
function vWaktu(){const c=S.cfg;const gl=guruJadwalList().length?guruJadwalList():guruList();
  const tbl=h=>{const rs=rowsHari(h);return `<div class="card"><h3>${h} <small>${rs.filter(r=>r.t==='jp').length} JP</small></h3>
   <div class="tw"><table><thead><tr><th>Jam ke</th><th>Jenis</th><th>Waktu</th><th>Keterangan / kegiatan</th><th></th></tr></thead><tbody>${rs.map((r,i)=>`<tr><td class="c">${r.j===null?'–':r.j}</td>
   <td><select style="width:140px" onchange="wkSet('${h}',${i},'t',this.value)">${[['k','Kegiatan jam 0'],['jp','Jam pelajaran'],['br','Istirahat / jeda']].map(([v,l])=>`<option value="${v}" ${r.t===v?'selected':''}>${l}</option>`).join('')}</select></td>
   <td><input style="width:105px" value="${esc(r.w||'')}" placeholder="07.00–07.40" onchange="wkSet('${h}',${i},'w',this.value)"></td>
   <td>${r.t==='jp'?'<span class="muted small">diisi dari jadwal</span>':`<input style="width:100%" value="${esc(r.ket||'')}" onchange="wkSet('${h}',${i},'ket',this.value)">`}</td>
   <td style="white-space:nowrap"><button class="btn sm" title="Sisipkan baris di bawah" onclick="wkAdd('${h}',${i})">＋</button> <button class="btn sm d" onclick="wkDel('${h}',${i})">✕</button></td></tr>`).join('')}</tbody></table></div>
   <div class="bar" style="margin:8px 0 0">${h===c.hari[0]?`<button class="btn sm" onclick="wkCopy('${h}')">Salin pola ${h} ke hari lain (kecuali Jumat)</button>`:''}<button class="btn sm" onclick="wkReset('${h}')">Kembalikan bawaan</button></div>
   <div style="margin-top:12px"><b class="small">Guru piket ${h}</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${(c.piket?.[h]||[]).map(id=>`<span class="tag">${esc(gNama(id))} <a style="cursor:pointer" onclick="pkDel('${h}','${id}')">✕</a></span>`).join('')||'<span class="muted small">Belum ada</span>'}
   <select onchange="pkAdd('${h}',this.value)"><option value="">+ tambah guru piket</option>${gl.filter(g=>!(c.piket?.[h]||[]).includes(g.id)).map(g=>`<option value="${g.id}">${esc(g.nama)}</option>`).join('')}</select></div></div></div>`};
  return `<div class="card small" style="background:var(--pri2);border-color:#cfe2da">Atur urutan jam, waktu, kegiatan jam 0 (pembiasaan), dan istirahat tiap hari. Jumlah baris <b>Jam pelajaran</b> menentukan jumlah JP per hari di jadwal. Semua dokumen cetak memakai pengaturan ini.</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(560px,1fr))">${c.hari.map(tbl).join('')}</div>`}
function wkSave(h,rs){S.cfg.waktu=Object.assign({},S.cfg.waktu||{});S.cfg.waktu[h]=rs.map(r=>({t:r.t,w:r.w||'',ket:r.ket||''}));S.cfg.jam=Object.assign({},S.cfg.jam,{[h]:rs.filter(r=>r.t==='jp').length});saveCfg();render()}
function wkSet(h,i,k,v){const rs=rowsHari(h);rs[i][k]=v;if(k==='t'&&v==='k'&&!rs[i].ket)rs[i].ket=KEG_DEF[h]||'Pembiasaan';if(k==='t'&&v==='br'&&!rs[i].ket)rs[i].ket='Istirahat';wkSave(h,rs)}
function wkAdd(h,i){const rs=rowsHari(h);rs.splice(i+1,0,{t:'jp',w:''});wkSave(h,rs)}
function wkDel(h,i){const rs=rowsHari(h);rs.splice(i,1);wkSave(h,rs)}
function wkReset(h){const rs=waktuDef(h);S.cfg.waktu=Object.assign({},S.cfg.waktu||{});delete S.cfg.waktu[h];S.cfg.jam=Object.assign({},S.cfg.jam,{[h]:rs.filter(r=>r.t==='jp').length});saveCfg();render()}
function wkCopy(h){const src=rowsHari(h);S.cfg.waktu=Object.assign({},S.cfg.waktu||{});const jam=Object.assign({},S.cfg.jam);S.cfg.hari.forEach(x=>{if(x===h||x==='Jumat')return;S.cfg.waktu[x]=src.map(r=>({t:r.t,w:r.w||'',ket:r.t==='k'?(rowsHari(x).find(z=>z.t==='k')?.ket||KEG_DEF[x]||r.ket):r.ket||''}));jam[x]=src.filter(r=>r.t==='jp').length});S.cfg.jam=jam;saveCfg();render();toast('Pola waktu disalin')}
function pkAdd(h,id){if(!id)return;S.cfg.piket=Object.assign({},S.cfg.piket||{});S.cfg.piket[h]=[...(S.cfg.piket[h]||[]),id];saveCfg();render()}
function pkDel(h,id){S.cfg.piket=Object.assign({},S.cfg.piket||{});S.cfg.piket[h]=(S.cfg.piket[h]||[]).filter(x=>x!==id);saveCfg();render()}

/* ---- dokumen cetak ---- */
const JCSS=`<style>.paper table.j td,.paper table.j th{padding:1px 3px;font-size:10.5px;line-height:1.25}.paper .ti{font-style:italic;background:#fff6dc}.paper .br{font-style:italic;color:#555;background:#f2f2f2}.paper .sub{text-align:center;font-style:italic;margin:0 0 6px}</style>`;
function gJadwalInduk(mode){const c=S.cfg;const kl=kelasList();const T=[7,8,9].map(t=>kl.filter(k=>+k.tingkat===t)).filter(x=>x.length);const nk=kl.length;
  const fs=nk>24?7:nk>18?8:9;
  const css=`<style>.paper table.ji td,.paper table.ji th{padding:0 1px;font-size:${fs}px;line-height:1.2;text-align:center}.paper table.ji .l{text-align:left}.paper table.ji .vt{position:relative;width:${Math.round(fs*1.8)}px;padding:0}.paper table.ji .vt .rot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font-weight:700;letter-spacing:1px}.paper table.dg td,.paper table.dg th{padding:0 2px;font-size:${fs}px;line-height:1.2}.paper .ji .br{background:#f2f2f2;font-style:italic}.paper .ji .k{background:#fff6dc;font-style:italic}</style>`;
  const pkW=Math.max(1,...c.hari.map(h=>(c.piket?.[h]||[]).length))*Math.ceil((fs-0.5)*1.45)+4;
  let body='';c.hari.forEach((h,hi)=>{const rs=rowsHari(h);const pk=(c.piket?.[h]||[]).map((id,i,a)=>`<div data-g="${id}" style="writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;padding:0 1px;line-height:1.3;${i?'border-right:0.5px solid #999;':''}">${esc(gNama(id))}</div>`).join('');
    rs.forEach((r,ri)=>{let row=ri===0?`<td rowspan="${rs.length}" class="vt h${hi}"><span class="rot">${h.toUpperCase()}</span></td>`:'';row+=`<td style="white-space:nowrap">${esc(r.w||'')}</td>`;
      if(r.t==='jp')row+=kl.map(k=>{const t=slotT(k.id,hi,r.j);if(!t)return '<td></td>';const g=orang(t.guruId);return `<td data-g="${t.guruId}">${mode==='mapel'?`<b>${esc(mKode(t.mapelId))}</b> ${esc(kodeG(g))}`:esc(kodeG(g))}</td>`}).join('');
      else row+=T.map(L=>`<td colspan="${L.length}" class="${r.t==='k'?'k':'br'}">${esc(r.ket||'')}</td>`).join('');

  const ld=(g,d)=>tLoad[g+'@'+d]||0;
  const un=mi=>{const m=meets[mi];if(m.d<0)return;for(let h=m.s;h<m.s+m.L;h++){cls[m.k][m.d][h]=-1;tch[m.g][m.d][h]=-1}tLoad[m.g+'@'+m.d]-=m.L;m.d=-1;m.s=-1};
  const pl=(mi,d,s)=>{const m=meets[mi];for(let h=s;h<s+m.L;h++){cls[m.k][d][h]=mi;tch[m.g][d][h]=mi}tLoad[m.g+'@'+d]=ld(m.g,d)+m.L;m.d=d;m.s=s;m.mv++};
  const byG={};meets.forEach(m=>(byG[m.g]=byG[m.g]||[]).push(m.mi));const has1=meets.some(m=>m.L===1);const cap=H.reduce((a,b)=>a+b,0);const tg={};Object.keys(byG).forEach(g=>{const j=byG[g].reduce((a,o)=>a+meets[o].L,0)/cap;tg[g]=j>0.55?3*(j-0.55):0});
  const mustiahil=meets.filter(m=>!m.cand.length);let open=meets.filter(m=>m.cand.length).map(m=>m.mi);
  if(pakaiLama&&seed){const rest=[];open.forEach(mi=>{const m=meets[mi];const ok=m.cand.find(([d,s,op])=>{if(!op)return false;for(let h=s;h<s+m.L;h++)if(cls[m.k][d][h]!==-1||tch[m.g][d][h]!==-1)return false;if(byTug[m.tid].some(o=>o!==mi&&meets[o].d===d))return false;return ld(m.g,d)+m.L<=MX});if(ok)pl(mi,ok[0],ok[1]);else rest.push(mi)});open=rest}
  const t0=Date.now();let best=null,bestN=1e9,it=0,lastImp=0;const snap=()=>meets.map(m=>[m.d,m.s]);if(!open.length)best=snap();
  while(Date.now()-t0<budget){
    if(!open.length){best=snap();bestN=0;break}
    let bi=Math.floor(Math.random()*open.length);for(let i=0;i<4;i++){const j=Math.floor(Math.random()*open.length);if(meets[open[j]].cand.length<meets[open[bi]].cand.length)bi=j}
    const mi=open[bi];open[bi]=open[open.length-1];open.pop();const m=meets[mi];
    let bc=1e9,bx=null,bset=null;
    for(const [d,s,op] of m.cand){const set=new Set();for(let h=s;h<s+m.L;h++){const a=cls[m.k][d][h];if(a>=0)set.add(a);const b=tch[m.g][d][h];if(b>=0)set.add(b)}
      for(const o of byTug[m.tid])if(o!==mi&&meets[o].d===d)set.add(o);
      let gl=ld(m.g,d)+m.L;for(const o of set)if(meets[o].g===m.g&&meets[o].d===d)gl-=meets[o].L;if(gl>MX){for(const o of byG[m.g]){if(gl<=MX)break;if(meets[o].d===d&&!set.has(o)&&Math.random()<0.8){set.add(o);gl-=meets[o].L}}if(gl>MX)continue}
      let cost=0;for(const o of set)cost+=1+Math.min(meets[o].mv,60)*0.03+(tg[meets[o].g]||0);
      {const row=cls[m.k][d],n=H[d];let run=0,sg=0;for(let h=1;h<=n+1;h++){const fr=h<=n&&!(h>=s&&h<s+m.L)&&(row[h]===-1||(row[h]>=0&&set.has(row[h])));if(fr)run++;else{if(run===1)sg++;run=0}}cost+=sg*(has1?0:0.7)}
      cost+=(gl>ID?0.45*(gl-ID):0)+(gl>=9?1.5:0)+(ld(m.g,d)===0?-0.2:0)-(pakaiLama&&op?0.4:0)+Math.random()*0.35;
      if(cost<bc){bc=cost;bx=[d,s];bset=set}}
    if(!bx){open.push(mi);const gs=byG[m.g].filter(o=>meets[o].d>=0);if(gs.length){const o=gs[Math.floor(Math.random()*gs.length)];un(o);open.push(o)}}
    else{for(const o of bset){un(o);open.push(o)}pl(mi,bx[0],bx[1]);if(open.length<bestN){bestN=open.length;best=snap();lastImp=it}}
    if(it-lastImp>6000){lastImp=it;for(let q=0;q<12;q++){const o=Math.floor(Math.random()*meets.length);if(meets[o].d>=0){un(o);open.push(o)}}}
    if(++it%2500===0){info&&info(`Menyusun… ${meets.length-open.length-mustiahil.length}/${meets.length} pertemuan · ${Math.round((Date.now()-t0)/1000)} dtk`);await new Promise(r=>setTimeout(r,0))}
  }
  meets.forEach(m=>un(m.mi));if(best)best.forEach(([d,s],i)=>{if(d>=0)pl(i,d,s)});
  const res={};P.kl.forEach(k=>res[k.id]=Object.assign({},P.fixed[k.id]));meets.forEach(m=>{if(m.d<0)return;for(let h=m.s;h<m.s+m.L;h++)res[m.k][m.d+'-'+h]=m.tid});
  const now=slotsNow();let beda=0;P.kl.forEach(k=>{const a=res[k.id],b=now[k.id]||{};new Set([...Object.keys(a),...Object.keys(b)]).forEach(s=>{if((a[s]||'')!==(b[s]||''))beda++})});
  const L={};P.kl.forEach(k=>Object.entries(res[k.id]).forEach(([s,tid])=>{const t=get('tugas',tid);if(t){const x=t.guruId+'@'+s.split('-')[0];L[x]=(L[x]||0)+1}}));
  return {res,un:meets.filter(m=>m.d<0).map(m=>({k:m.k,m:m.m,g:m.g,L:m.L})),placed:meets.filter(m=>m.d>=0).length,total:meets.length,beda,berat:Object.values(L).filter(v=>v>ID).length,t:Date.now()}}

      all('tugas').forEach(t=>{let jp=tugasJP(t);if(!get('kelas',t.kelasId)||get('mapel',t.mapelId)?.lintas)return;while(jp>0){const sz=jp>=2?2:1;blocks.push({t,sz});jp-=sz}});
      const gLoad={};all('tugas').forEach(t=>gLoad[t.guruId]=(gLoad[t.guruId]||0)+tugasJP(t));
      blocks.sort((a,b)=>(gLoad[b.t.guruId]-gLoad[a.t.guruId])||(b.sz-a.sz)||(Math.random()-.5));
      if(attempt>0)for(let i=blocks.length-1;i>0;i--){if(Math.random()<.25){const j=Math.max(0,i-3);[blocks[i],blocks[j]]=[blocks[j],blocks[i]]}}
      let un=0;
      blocks.forEach(b=>{
        const t=b.t;const cand=[];
        c.hari.forEach((h,hi)=>{const n=+c.jam[h]||0;for(let j=1;j+b.sz-1<=n;j++){let ok=true;for(let d=0;d<b.sz;d++){const s=hi+'-'+(j+d);if(kelasBusy[t.kelasId+'@'+s]||guruBusy[t.guruId+'@'+s]){ok=false;break}}if(ok){const same=dayMapel[t.kelasId+'@'+hi+'@'+t.mapelId]||0;cand.push({hi,j,pen:same*10+Math.random()})}}});
        if(!cand.length){

            for(let r=0;r<2;r++){const c1=[];slots.forEach(([hi,j])=>{const s=hi+'-'+j;if(!kelasBusy[t.kelasId+'@'+s]&&!guruBusy[t.guruId+'@'+s])c1.push({hi,j,pen:(dayMapel[t.kelasId+'@'+hi+'@'+t.mapelId]||0)*10+Math.random()})});
              if(!c1.length){un++;continue}c1.sort((a,b)=>a.pen-b.pen);const x=c1[0];const s=x.hi+'-'+x.j;kelasBusy[t.kelasId+'@'+s]=guruBusy[t.guruId+'@'+s]=1;res[t.kelasId][s]=t.id;dayMapel[t.kelasId+'@'+x.hi+'@'+t.mapelId]=(dayMapel[t.kelasId+'@'+x.hi+'@'+t.mapelId]||0)+1}
          }else un++;return}
        cand.sort((a,b)=>a.pen-b.pen);const x=cand[0];
        for(let d=0;d<b.sz;d++){const s=x.hi+'-'+(x.j+d);kelasBusy[t.kelasId+'@'+s]=guruBusy[t.guruId+'@'+s]=1;res[t.kelasId][s]=t.id}
        dayMapel[t.kelasId+'@'+x.hi+'@'+t.mapelId]=(dayMapel[t.kelasId+'@'+x.hi+'@'+t.mapelId]||0)+1;
      });
      if(un<best.score){best.score=un;best.res=res}if(un===0)break;
    }

    toast(best.score?`Jadwal tersusun; ${best.score} JP belum mendapat slot (cek kapasitas jam/guru).`:'Jadwal tersusun tanpa bentrok ✓');
  },'Susun');

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}})();
function buatZip(files){const enc=new TextEncoder();const parts=[],cen=[];let off=0;const N=new Date(),DT=(N.getHours()<<11)|(N.getMinutes()<<5)|(N.getSeconds()>>1),DD=((N.getFullYear()-1980)<<9)|((N.getMonth()+1)<<5)|N.getDate();files.forEach(f=>{const nm=enc.encode(f.name),d=new Uint8Array(f.data),crc=CRC(d);const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,DT,true);h.setUint16(12,DD,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);parts.push(new Uint8Array(h.buffer),nm,d);

  const cs=cen.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'})}

function rpSet(sid,mp,s,v){const d=clone(rp(sid));d.id=sid;d.n=d.n||{};d.n[mp]=Object.assign({},d.n[mp]||{});const n=String(v).trim()===''?null:Number(String(v).replace(',','.'));if(n==null||isNaN(n))delete d.n[mp][s];else d.n[mp][s]=n;put('rapor',d,{silent:true});const e=document.getElementById('ra_'+sid);if(e&&s!=='us')e.textContent=f2(rataMP(sid,mp))}
function rpParse(t){const rows=String(t||'').split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split('\t'));if(rows.length<2)return {err:'Sertakan baris judul kolom.'};const H=rows[0].map(x=>x.trim().toUpperCase().replace(/\s+/g,' '));
  const iN=H.findIndex(h=>h==='NISN');if(iN<0)return {err:'Kolom NISN tidak ditemukan di baris judul.'};const map=[];const MPS=RAPOR_MP.map(x=>x[0]);
  H.forEach((h,i)=>{let m=h.match(/^([A-Z]+) ([1-6])$/);if(m&&MPS.includes(m[1]))map.push([i,m[1],m[2]]);m=h.match(/^US ([A-Z]+)$/);if(m&&MPS.includes(m[1]))map.push([i,m[1],'us'])});
  const nn=x=>String(x||'').replace(/\D/g,'');const out=[];let miss=0;
  rows.slice(1).forEach(r=>{const s=all('siswa').find(x=>nn(x.nisn)&&nn(x.nisn)===nn(r[iN]));if(!s){if(nn(r[iN]))miss++;return}const vals=[];map.forEach(([i,m,sm])=>{const v=String(r[i]??'').trim().replace(',','.');if(v!==''&&!isNaN(+v)&&+v!==0)vals.push([m,sm,+v])});out.push({s,vals})});
  return {out,miss,kol:map.length}}

function exportRapor(){const k=get('kelas',UI.rpK);const ss=siswaKelas(UI.rpK);const H=['No','Nama','JK','NISN','Kelas'];RAPOR_MP.forEach(([m])=>{SEMS.forEach(x=>H.push(m+' '+x));H.push('RATA-2 '+m,'US '+m)});SEMS.forEach(x=>H.push('RATA2 SMT '+x));

    </tbody></table></div><p class="small muted">Tekan Tab/Enter untuk pindah sel. SLM = sumatif lingkup materi, STS = sumatif tengah semester, SAS = sumatif akhir semester.</p>`:'<div class="card empty">Belum ada siswa di kelas ini.</div>'}`;

    <tr><th></th><th>Rata-rata mapel</th>${mps.map((m,j)=>{const v=L.map(r=>r.v[j]).filter(x=>x!=null);return `<th class="c">${v.length?r1(v.reduce((a,b)=>a+b,0)/v.length):''}</th>`}).join('')}<th></th><th></th><th></th></tr>

    const f=UI.f.remed||'Remedial';const list=items.filter(x=>x[0]===f&&(!UI.f.remedK||x[1].id===UI.f.remedK));
    return tabs+`<div class="bar"><select onchange="UI.f.remed=this.value;render()"><option ${f==='Remedial'?'selected':''}>Remedial</option><option ${f==='Pengayaan'?'selected':''}>Pengayaan</option></select><select onchange="UI.f.remedK=this.value;render()"><option value="">Semua kelas</option>${kl.map(x=>`<option value="${x.id}" ${UI.f.remedK===x.id?'selected':''}>${esc(x.nama)}</option>`).join('')}</select><span class="muted small">${f==='Remedial'?'Nilai rapor < KKTP (VII '+kktpOf(7)+' · VIII '+kktpOf(8)+' · IX '+kktpOf(9)+')':'Nilai rapor ≥ '+c.pengayaan}</span><span class="sp"></span><button class="btn" onclick="exportTable(window._remed[0],window._remed[1],window._remed[2])">Ekspor</button>${(window._remed=['Daftar '+f,['No','Kelas','Nama','Mapel','Nilai','Pengampu'],list.map((x,i)=>[i+1,x[1].nama,x[3].nama,x[2].nama,x[4],all('tugas').filter(t=>t.kelasId===x[1].id&&t.mapelId===x[2].id).map(t=>gNama(t.guruId)).join(', ')])],'')}</div>

  </tbody></table></div>`;
}
function legerData(k){const c=S.cfg;const mps=mapelList().filter(m=>mapelJP(m,k.tingkat)>0);const L=siswaKelas(k.id).map(s=>{const v=mps.map(m=>{const d=nilaiDoc(k.id,m.id);return nilaiRapor(d?.skor?.[s.id],c,d?.kolom||defKolom())});const f=v.filter(x=>x!=null);return {s,v,sum:f.reduce((a,b)=>a+b,0),avg:f.length?f.reduce((a,b)=>a+b,0)/f.length:null}});
  const sorted=L.filter(r=>r.avg!=null).sort((a,b)=>b.avg-a.avg);sorted.forEach((r,i)=>r.rank=i>0&&sorted[i-1].avg===r.avg?sorted[i-1].rank:i+1);return L}
function exportLeger(){const k=get('kelas',UI.kelasSel);const mps=mapelList().filter(m=>mapelJP(m,k.tingkat)>0);exportTable('Leger '+k.nama,['No','NIS','Nama',...mps.map(m=>m.kode),'Jumlah','Rata-rata','Peringkat'],legerData(k).map((r,i)=>[i+1,r.s.nis,r.s.nama,...r.v.map(v=>v??''),r.sum,r.avg!=null?r1(r.avg):'',r.rank||'']))}
const nilaiTimers={};
function curNilaiDoc(){const id=UI.kelasSel+'__'+UI.mapelSel;let d=get('nilai',id);if(!d){d={id,kelasId:UI.kelasSel,mapelId:UI.mapelSel,kolom:defKolom(),skor:{}};S.data.nilai[id]=d}return d}
function setNilai(inp){
  const tr=inp.closest('tr');const sid=tr.dataset.s;const d=curNilaiDoc();d.skor=d.skor||{};d.skor[sid]=Object.assign({},d.skor[sid]);
  let v=inp.value;if(v!==''&&(+v>100||+v<0)){inp.style.background='var(--bad2)'}else inp.style.background='';
  d.skor[sid][inp.dataset.k]=v===''?'':Number(v);
  const nr=nilaiRapor(d.skor[sid],S.cfg,d.kolom||defKolom());tr.querySelector('.nr').innerHTML=`<b>${nr??''}</b>`;tr.querySelector('.ket').innerHTML=nr==null?'':nr>=S.cfg.kktp?'<span class="tag ok">Tuntas</span>':'<span class="tag bad">Remedial</span>';
  clearTimeout(nilaiTimers[d.id]);nilaiTimers[d.id]=setTimeout(()=>{d.diubah=Date.now();rec('nilai',d.id,d);if(S.mode==='db')persist('nilai',d.id,d);else saveLocal()},700);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.nil input')){e.preventDefault();const td=e.target.closest('td');const idx=[...td.parentNode.children].indexOf(td);const nx=td.parentNode.nextElementSibling;const i=nx?.children[idx]?.querySelector('input');if(i){i.focus();i.select()}}});
function kolomSLM(dir){const d=Object.assign({},curNilaiDoc());let ko=[...(d.kolom||defKolom())];const slm=ko.filter(x=>x.t==='slm');
  if(dir>0){const n=slm.length+1;ko.splice(slm.length,0,{k:'slm'+Date.now().toString(36),l:'SLM '+n,t:'slm'})}else{if(slm.length<=1)return;ko=ko.filter(x=>x!==slm[slm.length-1])}
  ko.filter(x=>x.t==='slm').forEach((x,i)=>x.l='SLM '+(i+1));d.kolom=ko;put('nilai',d)}
function exportNilai(){const d=curNilaiDoc();const ko=d.kolom||defKolom();const k=get('kelas',UI.kelasSel);exportTable(`Nilai ${mNama(UI.mapelSel)} ${k.nama}`,['No','NIS','Nama',...ko.map(x=>x.l),'Nilai Rapor','Ket'],siswaKelas(k.id).map((s,i)=>{const r=d.skor?.[s.id]||{};const nr=nilaiRapor(r,S.cfg,ko);return [i+1,s.nis,s.nama,...ko.map(x=>r[x.k]??''),nr??'',nr==null?'':nr>=S.cfg.kktp?'Tuntas':'Remedial']}))}
function tempelNilai(){const d=curNilaiDoc();const ko=d.kolom||defKolom();
  openModal(`<h2>Tempel nilai dari Excel</h2><p class="small">Salin kolom nilai dari Excel dengan urutan baris <b>sama dengan urutan nama di tabel</b> (alfabetis). Urutan kolom: <b>${ko.map(x=>x.l).join(' · ')}</b>.</p><textarea id="tn" rows="10" style="width:100%;font-family:monospace"></textarea><div class="mfoot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn p" id="tnGo">Tempel</button></div>`);
  $('#tnGo').onclick=()=>{const rows=$('#tn').value.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(/\t|;/));const sis=siswaKelas(UI.kelasSel);const nd=Object.assign({},d,{skor:Object.assign({},d.skor)});rows.forEach((r,i)=>{const s=sis[i];if(!s)return;const o=Object.assign({},nd.skor[s.id]);ko.forEach((x,j)=>{const v=num(r[j]);if(v!=null)o[x.k]=v});nd.skor[s.id]=o});put('nilai',nd);closeModal();toast(Math.min(rows.length,sis.length)+' baris nilai ditempel')}}

function vSupervisi(){

  const tabs=`<div class="tabs"><a class="${tab==='rekap'?'on':''}" onclick="UI.supTab='rekap';render()">Rekap Kinerja Guru</a><a class="${tab==='riwayat'?'on':''}" onclick="UI.supTab='riwayat';render()">Riwayat Supervisi</a></div>`;
  const bar=`<div class="bar"><span class="muted small">Instrumen observasi berbasis prinsip Pembelajaran Mendalam (berkesadaran, bermakna, menggembirakan). Skor 1–4; indikator bisa diubah di Pengaturan.</span><span class="sp"></span><button class="btn p" onclick="supForm()">+ Supervisi baru</button></div>`;

  if(tab==='rekap'){
    const rows=guruList().map(g=>{const s=supTerakhir(g.id);const n=all('supervisi').filter(x=>x.guruId===g.id).length;const b=bebanGuru(g);const pk=perangkatPct(g.id);const p=s?predikat(s.nilai):null;

}

   <label>Jenis<select id="spJ">${['Observasi Pembelajaran','Supervisi Akademik (perangkat)','Pendampingan Pembelajaran Mendalam','Penilaian Kinerja Tahunan'].map(x=>`<option ${x===rec.jenis?'selected':''}>${x}</option>`).join('')}</select></label>

  <div class="form" style="margin-top:12px"><label class="full">Kekuatan / praktik baik<textarea id="spKu" rows="2">${esc(rec.kekuatan||'')}</textarea></label><label class="full">Area pengembangan<textarea id="spAr" rows="2">${esc(rec.area||'')}</textarea></label><label class="full">Rencana tindak lanjut<textarea id="spRt" rows="2">${esc(rec.tindak||'')}</textarea></label></div>
  <div class="mfoot"><span id="spNil" class="muted" style="margin-right:auto"></span><button class="btn" onclick="closeModal()">Batal</button><button class="btn p" id="spGo">Simpan</button></div>`,true);

function kinerja(gid){
  const ts=ttGuru(gid);const pk=get('pk',gid)||{};const asp=REF().aspek;const b=+REF().bobotAspek/100;
  const sk=asp.map((_,i)=>num(pk.skor?.[i])).filter(v=>v!=null);
  const rata=sk.length?Math.round(sk.reduce((a,c)=>a+c,0)/sk.length*100)/100:null;
  const nAspek=rata==null?null:Math.round(rata/5*1000)/10;
  const O=ts.length;const P=ts.filter(t=>t.berperan==='Ya'||(!t.berperan&&num(t.nilai)>0)).length;const Q=ts.filter(t=>t.berperan==='Tidak').length;const R=O-P-Q;
  const pct=P+Q?P/(P+Q):null;
  const dn=ts.filter(t=>t.berperan!=='Tidak'&&num(t.nilai)>0);const sum=dn.reduce((a,t)=>a+num(t.nilai),0);
  const nPel=dn.length+Q?Math.round(sum/((dn.length+Q)*5)*1000)/10:null;
  const akhir=nAspek==null&&nPel==null?null:nAspek==null?nPel:nPel==null?nAspek:Math.round((nAspek*b+nPel*(1-b))*10)/10;
  const pan=ts.filter(isPanitia);const pY=pan.filter(t=>t.berperan==='Ya').length,pT=pan.filter(t=>t.berperan==='Tidak').length;const pn=pan.filter(t=>num(t.nilai)>0);
  return {ts,O,P,Q,R,pct,nPel,rata,nAspek,akhir,jTT:ts.filter(t=>!isPanitia(t)).length,jPan:pan.length,pY,pT,pPct:pY+pT?pY/(pY+pT):null,pRata:pn.length?Math.round(pn.reduce((a,t)=>a+num(t.nilai),0)/pn.length*100)/100:null};
}

   <div class="mfoot"><span class="small muted" id="tbInfo" style="margin-right:auto"></span><button class="btn" onclick="closeModal()">Batal</button><button class="btn p" id="tbGo">Simpan</button></div>`,true);

  $('#tbK').onchange=fill;$('#tbJ').onchange=mark;fill();
  $('#tbQ').oninput=e=>{const q=e.target.value.toLowerCase();const tuOk=!['Wali Kelas','Kepala Sekolah','Layanan BK'].includes($('#tbK').value);document.querySelectorAll('#tbG label').forEach(l=>l.style.display=l.dataset.n.includes(q)&&(tuOk||!l.dataset.tu)?'':'none')};

}

function ttKinerja(){
  const sub=UI.ttKs||'nilai';const R=REF();const gs=guruList();const K=gs.map(g=>[g,kinerja(g.id)]);
  const dinilai=K.filter(x=>x[1].akhir!=null);const avg=dinilai.length?dinilai.reduce((a,x)=>a+x[1].akhir,0)/dinilai.length:null;
  const dist=['Sangat Baik','Baik','Cukup','Kurang'].map(p=>[p,dinilai.filter(x=>predTT(x[1].akhir)[0]===p).length]);
  const head=`<div class="grid g4" style="margin-bottom:14px"><div class="kpi"><div class="l">Guru sudah dinilai</div><div class="v">${dinilai.length}<span class="muted" style="font-size:15px"> / ${gs.length}</span></div></div>
   <div class="kpi"><div class="l">Rata-rata nilai akhir utuh</div><div class="v">${avg==null?'–':r1(avg)}</div></div>
   <div class="kpi"><div class="l">Nilai tertinggi</div><div class="v">${dinilai.length?r1(Math.max(...dinilai.map(x=>x[1].akhir))):'–'}</div></div>
   <div class="kpi"><div class="l">Sebaran predikat</div><div class="s" style="margin-top:6px">${dist.map(([p,n])=>`<span class="tag ${predTT(p==='Sangat Baik'?95:p==='Baik'?80:p==='Cukup'?65:0)[1]}">${p} ${n}</span>`).join(' ')}</div></div></div>
   <div class="bar"><div class="tabs" style="margin:0;border:0"><a class="${sub==='nilai'?'on':''}" onclick="UI.ttKs='nilai';render()">Nilai per guru</a><a class="${sub==='matriks'?'on':''}" onclick="UI.ttKs='matriks';render()">Matriks kepanitiaan</a></div><span class="sp"></span>
   <span class="small muted">Nilai akhir = ${R.bobotAspek}% aspek + ${100-R.bobotAspek}% pelaksanaan tugas</span><button class="btn" onclick="exportKinerja()">Ekspor</button></div>`;
  if(sub==='matriks'){
    const pj=[...new Set([...(R.jenis['Kepanitiaan']||[]),...ttAll().filter(isPanitia).map(t=>t.jenis)])];
    return head+`<p class="small muted">angka = nilai 1–5 · <b>T</b> = tidak berperan · ✓ = anggota belum dinilai · kosong = bukan anggota</p><div class="tw"><table class="mx"><thead><tr><th>Nama</th><th class="n">Berperan</th><th class="n">Tidak</th><th class="n">%</th><th class="n">Rata²</th>${pj.map(j=>`<th class="c" style="white-space:normal;min-width:70px;font-size:11px">${esc(j)}</th>`).join('')}</tr></thead><tbody>
    ${K.map(([g,k])=>`<tr><td><b>${esc(g.nama)}</b></td><td class="n">${k.pY}</td><td class="n">${k.pT}</td><td class="n">${k.pPct==null?'':Math.round(k.pPct*100)+'%'}</td><td class="n">${k.pRata??''}</td>${pj.map(j=>{const t=k.ts.find(x=>isPanitia(x)&&x.jenis===j);if(!t)return '<td></td>';if(t.berperan==='Tidak')return '<td class="c" style="color:var(--bad);font-weight:700">T</td>';return `<td class="c">${num(t.nilai)>0?`<b>${t.nilai}</b>`:'<span class="muted">✓</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  const o=v=>['','5','4','3','2','1'].map(x=>`<option value="${x}" ${String(v??'')===x?'selected':''}>${x||'—'}</option>`).join('');
  return head+`<p class="small muted">Isi 6 aspek (skala 1–5) per guru. Kolom pelaksanaan tugas dihitung otomatis dari isian Berperan & Nilai di tab Input Tugas; tugas berstatus "Tidak" dihitung 0, yang belum dinilai tidak dihitung.</p>
  <div class="tw"><table class="mx"><thead><tr><th>Nama</th><th class="n">TT</th><th class="n">Panitia</th>${R.aspek.map(a=>`<th class="c" style="white-space:normal;min-width:74px;font-size:11px">${esc(a)}</th>`).join('')}<th class="n">Rata²</th><th class="n">Nilai aspek</th><th class="n">Jml tugas</th><th class="n">Jalan</th><th class="n">Tidak</th><th class="n">Belum</th><th class="n">% jalan</th><th class="n">Nilai pelaksanaan</th><th class="n">Nilai akhir</th><th>Predikat</th><th>Catatan</th></tr></thead><tbody>
  ${K.map(([g,k])=>{const pk=get('pk',g.id)||{};const p=predTT(k.akhir);return `<tr><td><b>${esc(g.nama)}</b></td><td class="n">${k.jTT}</td><td class="n">${k.jPan}</td>${R.aspek.map((_,i)=>`<td class="c"><select onchange="pkSet('${g.id}',${i},this.value)">${o(pk.skor?.[i])}</select></td>`).join('')}
   <td class="n">${k.rata??''}</td><td class="n">${k.nAspek??''}</td><td class="n">${k.O}</td><td class="n">${k.P}</td><td class="n">${k.Q||''}</td><td class="n">${k.R||''}</td><td class="n">${k.pct==null?'':Math.round(k.pct*100)+'%'}</td><td class="n">${k.nPel??''}</td><td class="n"><b>${k.akhir??''}</b></td><td>${p[0]?`<span class="tag ${p[1]}">${p[0]}</span>`:''}</td>
   <td><input style="width:150px" value="${esc(pk.catatan||'')}" onchange="pkSet('${g.id}','catatan',this.value)"></td></tr>`}).join('')}</tbody></table></div>`;
}

function gLampVI(){const rows=all('tu').sort(MOD.tu.sort);const grp=[];rows.forEach(r=>{const k=(r.urut||'')+'|'+nkey(r.nama);const last=grp[grp.length-1];if(last&&last.k===k)last.items.push(r);else grp.push({k,r,items:[r]})});

    out.push({no:no++,kiri:a.k.id,bkiri:a.b,kanan:b?b.k.id:'',bkanan:b?b.b:1,lokasi:''})}
  return out}

  ${G.map(gr=>{const row=u.pengawas?.[String(gr.lead)]||[];const j=gr.sesi[0];return `<tr><th style="position:sticky;left:0;background:#faf9f5;text-align:left;min-width:150px;z-index:1">${esc(hariOf(j.tanggal))} <span class="muted">${esc(tglL(j.tanggal))}</span><div style="font-weight:600">${esc(grupLabel(gr))}</div></th>

function ujAwas(lead,no,v){const u=UJ();u.pengawas=Object.assign({},u.pengawas);const row=[...(u.pengawas[String(lead)]||[])];while(row.length<no)row.push('');row[no-1]=v;u.pengawas[String(lead)]=row;saveUJ(u);render()}
function ujBagiPengawas(all_){const u=UJ();const P=peserta(u);const R=ruangInfo(u,P);const G=grupList(u);const pool=guruList().filter(g=>u.flags?.[g.id]?.pengawas).map(g=>g.id);if(!pool.length){toast('Tandai guru sebagai Pengawas di tab 3 dulu');return}
  const cnt={};pool.forEach(g=>cnt[g]=0);const pw=all_?{}:JSON.parse(JSON.stringify(u.pengawas||{}));if(!all_)Object.values(pw).forEach(row=>row.forEach(g=>{if(g in cnt)cnt[g]++}));
  G.forEach(gr=>{const row=pw[String(gr.lead)]=pw[String(gr.lead)]||[];while(row.length<R.length)row.push('');const usedRow=new Set(row.filter(Boolean));
    R.forEach(r=>{if(row[r.no-1])return;const own=g=>gr.sesi.some(j=>[r.kKiri,r.kKanan].filter(Boolean).some(k=>{const m=mapelSesi(j,k.tingkat);return m&&korektorOf(u,k.id,m)===g}));
      const cand=pool.filter(g=>!usedRow.has(g)).sort((a,b)=>(own(a)-own(b))||(cnt[a]-cnt[b])||(Math.random()-.5));const g=cand[0];if(!g)return;row[r.no-1]=g;usedRow.add(g);cnt[g]++})});
  u.pengawas=pw;saveUJ(u,1);render();toast('Pengawas dibagi merata')}

const tglBesar=d=>d?`${hariOf(d).toUpperCase()}, ${tglL(d).toUpperCase()}`:'';
const mapelSesiTeks=j=>{const ms=[j.m7,j.m8,j.m9];const u=[...new Set(ms.filter(Boolean))];if(u.length<=1)return u[0]||'';return [7,8,9].filter(t=>j['m'+t]).map(t=>`${j['m'+t]} (${ROMAWI[t]})`).join(' / ')};
const wib=x=>{x=String(x||'').trim();return x&&!/wib/i.test(x)?x+' WIB':x};
function hariUjian(u){const by={};sesiList(u).forEach(j=>{const k=j.tanggal||('?'+j.sesi);(by[k]=by[k]||[]).push(j)});return Object.entries(by).sort((a,b)=>a[0].localeCompare(b[0])).map(([t,js])=>({t,js}))}
function kegHari(u,t){const d=(u.kegHari||{})[t]||{};const jum=hariOf(t)==='Jumat';return {pre:d.pre??'PTM + Pengarahan',preJam:d.preJam??(jum?'07.00 - 07.30':'07.00 - 08.00'),post:d.post??(jum?'Solat Jumat + Piket ruangan':'Solat Zuhur + Piket ruangan'),postJam:d.postJam??(jum?'11.30 - 12.30':'12.00 - 12.30')}}

function gJadwalASAS(u){const H=hariUjian(u);
  const rows=H.map((h,i)=>{const k=kegHari(u,h.t);const items=[k.pre?[k.pre,k.preJam,1]:null,...h.js.map(j=>[mapelSesiTeks(j),j.jam,0]),k.post?[k.post,k.postJam,1]:null].filter(Boolean);
    return `<tr><td class="c" rowspan="${items.length+1}" style="vertical-align:top!important"><b>${i+1}.</b></td><td colspan="2" style="background:#dbe7f3"><b>${esc(tglBesar(h.t))}</b></td></tr>`+items.map(([m,w,x])=>`<tr><td style="padding-left:16px${x?';font-style:italic':''}">${esc(m)}</td><td class="c">${esc(wib(w))}</td></tr>`).join('')}).join('');
  return [`${kopHtml()}${judulUjian(u)}<table style="font-size:13px"><thead><tr><th style="width:42px">NO</th><th>KETERANGAN</th><th style="width:170px">WAKTU</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="c">Isi jadwal di tab 4. Jadwal</td></tr>'}</tbody></table>
  ${u.set.catatanJadwal!==''?`<p style="margin-top:14px"><b>CATATAN:</b><br>${esc(u.set.catatanJadwal??`Jadwal ${u.set.kalimat||'ujian'} dibuat berdasarkan Edaran dari Dinas Pendidikan Kota Tangerang`)}</p>`:''}`]}
function pengawasPool(u){const ids=new Set();sesiList(u).forEach(j=>{(u.pengawas?.[String(grupLeader(u,j.sesi))]||[]).forEach(g=>{if(g)ids.add(g)})});guruList().filter(g=>u.flags?.[g.id]?.pengawas).forEach(g=>ids.add(g.id));return [...ids].map(id=>get('guru',id)).filter(Boolean).sort((a,b)=>kodeNum(a)-kodeNum(b)||String(a.nama).localeCompare(b.nama))}
function gJadwalAwas(u,P,hl){const HL='background:#f39ac2;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact';const R=ruangInfo(u,P);const H=hariUjian(u);const n=R.length;const fs=n>24?8:n>16?9:10;
  const rows=H.map((h,i)=>h.js.map((j,ji)=>`<tr>${ji===0?`<td class="c" rowspan="${h.js.length}">${i+1}.</td><td rowspan="${h.js.length}" class="c" style="white-space:nowrap">${esc(hariOf(h.t).toUpperCase())},<br><span style="font-size:${fs-1}px">${esc(tglL(h.t).toUpperCase())}</span></td>`:''}<td style="white-space:nowrap">${String.fromCharCode(97+ji)}. ${esc(mapelSesiTeks(j))}</td><td class="c" style="white-space:nowrap">${esc(wib(j.jam))}</td>${R.map(r=>{const g=get('guru',pengawasOf(u,j.sesi,r.no));return `<td class="c"${g&&hl&&g.id===hl?` style="${HL}"`:''}>${g?esc(kodeG(g)):''}</td>`}).join('')}</tr>`).join('')).join('');
  const pool=pengawasPool(u);const per=Math.ceil(pool.length/5)||1;const cols=[0,1,2,3,4].map(c=>pool.slice(c*per,c*per+per));

  <p style="margin:10px 0 3px;font-size:${fs}px"><b>PENGAWAS :</b></p><div style="display:flex;gap:10px;font-size:${fs}px">${cols.map(L=>`<div style="flex:1">${L.map(g=>hl&&g.id===hl?`<span style="${HL};padding:0 3px">${esc(kodeG(g))}. ${esc(g.nama)}</span>`:`${esc(kodeG(g))}. ${esc(g.nama)}`).join('<br>')}</div>`).join('')}</div>`]}
function peranPanitia(u,gid){const x=panitiaList(u).find(p=>p.g.id===gid);if(!x)return '';return /penanggung jawab/i.test(x.jab)?'Penanggung Jawab':(/panitia/i.test(x.jab)?x.jab:x.jab+' Panitia')}
function peranST(u,P,gid){const ov=(u.stPeran||{})[gid];if(ov)return ov;const t=tugasSurat(u,P,gid);return [peranPanitia(u,gid),t.awas?'Pengawas':''].filter(Boolean).join(' dan ')}
function tugasSurat(u,P,gid){const awas=sesiList(u).some(j=>ruangInfo(u,P).some(r=>pengawasOf(u,j.sesi,r.no)===gid));const kor=[...new Set(korektorData(u,P).filter(r=>r.g.id===gid).map(r=>r.m))];return {awas,kor}}
function stGuruList(u,P){const ids=new Set();panitiaList(u).forEach(p=>ids.add(p.g.id));sesiList(u).forEach(j=>(u.pengawas?.[String(grupLeader(u,j.sesi))]||[]).forEach(g=>g&&ids.add(g)));korektorData(u,P).forEach(r=>ids.add(r.g.id));return [...ids].map(id=>get('guru',id)).filter(Boolean).sort((a,b)=>kodeNum(a)-kodeNum(b)||String(a.nama).localeCompare(b.nama))}
function gSuratTugas(u,P,gid){const g=get('guru',gid);if(!g)return [''];const T=tugasSurat(u,P,gid);const J=sesiList(u).filter(j=>j.tanggal).map(j=>j.tanggal).sort();
  const t1=J[0],t2=J[J.length-1];const rentang=!t1?'……':t1===t2?tglL(t1):(t1.slice(0,7)===t2.slice(0,7)?`${+t1.slice(8)} ${BLN_L[+t1.slice(5,7)-1]}`:tglL(t1).replace(/ \d{4}$/,t1.slice(0,4)===t2.slice(0,4)?'':' '+t1.slice(0,4)))+' s.d. '+tglL(t2);
  const sek=S.cfg.sekolah||'';const sekK=sek.replace(/^UPT\s+(Satuan Pendidikan\s+)?/i,'');const items=[];
  const peran=peranST(u,P,gid);const V={PERAN:peran,KEGIATAN:u.set.stKegiatan||u.set.kalimat||'ujian',TAHUN:u.set.stTahun||u.set.tahun||S.cfg.tahun||'',TANGGAL:u.set.stTanggal||rentang,TEMPAT:u.set.stTempat||sek,SEKOLAH:sekK||sek,MAPEL:T.kor.join(', '),NAMA:g.nama};
  const isi=t=>esc(String(t||'')).replace(/\{([A-Z]+)\}/g,(m,k)=>k in V?esc(V[k]):m).replace(/_([^_]+)_/g,'<i>$1</i>');const ST=stTeks(u);
  const khusus=((u.stIsi||{})[gid]||'').trim();
  if(khusus)khusus.split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>items.push(isi(x)));
  else{if(peran)items.push(isi(ST.butir));if(T.kor.length)items.push(isi(ST.kor))}
  const pg=[g.jabatan,golTxt(g)!=='-'?golTxt(g):''].filter(Boolean).join(' / ');
  const row=(a,b)=>`<tr><td style="width:150px;padding:2px 0">${a}</td><td style="width:12px;padding:2px 0">:</td><td style="padding:2px 0">${b}</td></tr>`;
  return [`<div style="font-family:Arial,Helvetica,sans-serif;font-size:13.5px;line-height:1.6">${kopHtml()}<p class="ttl" style="font-size:19px;margin-top:14px;font-family:Arial,Helvetica,sans-serif;letter-spacing:.5px">SURAT TUGAS</p><p class="c" style="margin:0 0 22px">Nomor : ${esc(u.set.noST||'…………………………………')}</p>

  <table class="nb" style="font-size:13.5px;margin-left:0">${row('N a m a',esc(g.nama))}${row('N I P',esc(g.nip||'-'))}${row('Pangkat, Gol Ruang',esc(pg||'-'))}${row('Jabatan','Guru')}${row('Unit Kerja',esc(sek))}</table>
  <p style="margin:16px 0 4px">Untuk melaksanakan tugas sebagai:</p><ol style="margin:0;padding-left:22px;text-align:justify">${items.map(x=>`<li>${x}</li>`).join('')||'<li>……………………</li>'}</ol>
  <p style="text-align:justify;margin:16px 0 0">${isi(ST.penutup)}</p>
  <div style="display:flex;justify-content:flex-end;margin-top:28px"><div style="min-width:240px">${esc(u.set.kota||S.cfg.tempatSK||'')}, ${esc(u.set.tglST||u.set.tglTtd||'……………………')}<br>Kepala Sekolah,${ttdBlok(TTDON())}<u>${esc(S.cfg.kepsek||'')}</u><br>NIP. ${esc(S.cfg.nipKepsek||'')}</div></div></div>`]}

  <label>Tanggal pelaksanaan (mis. 30 November s.d. 4 Desember 2026)<input id="stD" value="${esc(u.set.stTanggal||'')}" placeholder="otomatis dari jadwal"></label><label class="full">Tempat<input id="stP" value="${esc(u.set.stTempat||'')}" placeholder="${esc(S.cfg.sekolah||'')}"></label></div>
