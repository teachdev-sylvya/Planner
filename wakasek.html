  $('#stGo').onclick=()=>{u.set=Object.assign({},u.set,{noST:$('#stN').value.trim(),tglST:$('#stT').value.trim(),stKegiatan:$('#stK').value.trim(),stTahun:$('#stY').value.trim(),stTanggal:$('#stD').value.trim(),stTempat:$('#stP').value.trim(),stTeks:Object.fromEntries(Object.keys(ST_DEF).map(k=>[k,document.getElementById('stX_'+k).value.trim()]).filter(([k,v])=>v&&v!==ST_DEF[k]))});saveUJ(u,1);closeModal();render()}}

function ujCetakV(u,P,tab){const R=ruangInfo(u,P);const J=sesiList(u);const c=UI.ujc=UI.ujc||{};if(!c.r||!R.find(x=>x.no===c.r))c.r=R[0]?.no;if(!c.s||!J.find(x=>x.sesi===c.s))c.s=J[0]?.sesi;if(!c.k||!get('kelas',c.k))c.k=kelasList()[0]?.id;c.pos=c.pos||'all';
  const rSel=`<select onchange="UI.ujc.r=+this.value;render()">${R.map(r=>`<option value="${r.no}" ${r.no===c.r?'selected':''}>Ruang ${r.no} (${esc(r.kKiri?.nama||'')} & ${esc(r.kKanan?.nama||'')})</option>`).join('')}</select>`;
  const sSel=`<select onchange="UI.ujc.s=+this.value;render()">${J.map(j=>`<option value="${j.sesi}" ${j.sesi===c.s?'selected':''}>Sesi ${j.sesi} · ${esc(hariOf(j.tanggal))} ${esc(tglL(j.tanggal))} · ${esc([...new Set([j.m7,j.m8,j.m9].filter(Boolean))].join('/'))}</option>`).join('')}</select>`;
  const kSel=`<select onchange="UI.ujc.k=this.value;render()">${kelasList().map(k=>`<option value="${k.id}" ${k.id===c.k?'selected':''}>${esc(k.nama)}</option>`).join('')}</select>`;
  const allR=fn=>()=>R.flatMap(r=>fn(r.no));const nm=t=>`${t} - ${u.nama}`;
  let bar='',pages=[],extra='';
  switch(tab){
    case 'jadwalasas':pages=gJadwalASAS(u);bar=`<button class="btn" onclick="ujKegEdit()">Ubah kegiatan & catatan</button>`+cetakBar(nm('Jadwal Ujian'),()=>gJadwalASAS(u));extra='<p class="small muted">Mata pelajaran & jam diambil dari tab 4. Jadwal. Bila mapel kelas VII/VIII/IX berbeda, ditulis per jenjang.</p>';break;
    case 'jawas':{const pool=pengawasPool(u);if(c.hl&&!pool.find(g=>g.id===c.hl))c.hl='';pages=gJadwalAwas(u,P,c.hl);
      bar=`<select onchange="UI.ujc.hl=this.value;render()"><option value="">Tanpa sorotan (semua)</option>${pool.map(g=>`<option value="${g.id}" ${g.id===c.hl?'selected':''}>Sorot: ${esc(kodeG(g))}. ${esc(g.nama)}</option>`).join('')}</select><button class="btn" onclick="ujKegEdit()">Ubah catatan</button>`+cetakBar(nm('Jadwal Mengawas'+(c.hl?' - '+(get('guru',c.hl)?.nama||''):'')),()=>gJadwalAwas(u,P,UI.ujc.hl),`Unduh per pengawas (${pool.length} lembar, masing-masing disorot)`,()=>pengawasPool(u).flatMap(g=>gJadwalAwas(u,P,g.id)));}extra='<p class="small muted">Angka di kolom ruang = kode guru pengawas (dari tab 5. Pengawas). Pilih <b>Sorot</b> untuk menandai jadwal satu guru, atau <b>Cetak per pengawas</b> untuk mencetak satu lembar per guru dengan sorotannya masing-masing.</p>';break;
    case 'stugas':{const L=stGuruList(u,P);if(!c.g||!L.find(g=>g.id===c.g))c.g=L[0]?.id;pages=c.g?gSuratTugas(u,P,c.g):['<p>Belum ada pengawas atau korektor. Isi tab 5 dan 6 dulu.</p>'];
      bar=`<select onchange="UI.ujc.g=this.value;render()">${L.map(g=>{const t=tugasSurat(u,P,g.id);return `<option value="${g.id}" ${g.id===c.g?'selected':''}>${esc(kodeG(g))}. ${esc(g.nama)} — ${esc([peranST(u,P,g.id),t.kor.length?'Korektor':''].filter(Boolean).join(', '))}</option>`}).join('')}</select>${c.g?`<label class="small">Tugas<input style="width:230px" value="${esc((u.stPeran||{})[c.g]||'')}" placeholder="${esc(peranST(Object.assign({},u,{stPeran:{}}),P,c.g))}" onchange="ujSTPeran('${c.g}',this.value)"></label>`:''}<label class="small">Nomor surat tugas<input style="width:250px" value="${esc(u.set.noST||'')}" placeholder="mis. 256/400.3.5.08/SMP 5/XI/2026" onchange="ujSTSet('noST',this.value)"></label><label class="small">Tanggal surat<input style="width:170px" value="${esc(u.set.tglST||'')}" placeholder="${esc(u.set.tglTtd||'mis. 27 November 2026')}" onchange="ujSTSet('tglST',this.value)"></label><button class="btn" onclick="ujSTEdit()">✎ Isi & badan surat (semua guru)</button>${c.g?`<button class="btn" onclick="ujSTIsiGuru('${c.g}')">✎ Isi khusus guru ini${(u.stIsi||{})[c.g]?' ●':''}</button>`:''}`+cetakBar(nm('Surat Tugas '+(get('guru',c.g)?.nama||'')),()=>[...gSuratTugas(u,P,UI.ujc.g),...(UI.ujc.g&&tugasSurat(u,P,UI.ujc.g).awas?gJadwalAwas(u,P,UI.ujc.g):[])],`Unduh semua guru + lampiran jadwal disorot (${L.length} guru)`,()=>stSemuaSorot(u,P));
      extra=`<p class="small muted">${L.length} guru mendapat surat tugas: panitia, pengawas, dan/atau korektor. Butir 1 otomatis dari isian kepanitiaan & pengawas (mis. "Sekretaris Panitia dan Pengawas"); bisa diganti per guru di kolom <b>Tugas</b>. Butir korektor hanya muncul bila guru itu menjadi korektor. Setiap surat untuk pengawas dicetak bersama lampiran jadwal mengawas yang menyorot nama guru itu. Tanda ● = guru yang isi suratnya diubah khusus.</p>`;break}
    case 'panitia':pages=gPanitia(u);bar=cetakBar(nm('Daftar Hadir Panitia'),()=>gPanitia(u),null,null,true);UI._land=true;extra=panitiaList(u).length?'':'<div class="alert warn">Belum ada panitia. Tandai di tab 3.</div>';break;
    case 'sk':pages=gSK(u);bar=cetakBar(nm('SK Panitia'),()=>gSK(u));break;
    case 'korektor':pages=gKorektor(u,P);bar=cetakBar(nm('Daftar Korektor'),()=>gKorektor(u,P));break;
    case 'denah':pages=gDenah(u);bar=`<span class="small muted">Klik kotak pada denah untuk mengubah tulisannya.</span><button class="btn sm" onclick="denahTambah()">+ Kotak</button>`+cetakBar(nm('Denah Ruang'),()=>gDenah(u));break;
    case 'tatibP':case 'tatibW':{const w=tab==='tatibW';pages=gTatib(u,w);bar=`<button class="btn" onclick="ujTatibEdit(${w})">Ubah isi</button>`+cetakBar(nm(w?'Tata Tertib Pengawas':'Tata Tertib Peserta'),()=>gTatib(u,w));break}
    case 'dpeserta':pages=gDPeserta(u,P,c.r);bar=rSel+cetakBar(nm('Daftar Peserta R'+c.r),()=>gDPeserta(u,P,c.r),'Semua ruang',allR(n=>gDPeserta(u,P,n)));break;
    case 'pkelas':pages=gPKelas(u,P,c.k);bar=kSel+cetakBar(nm('Peserta '+kn(c.k)),()=>gPKelas(u,P,c.k),'Semua kelas',()=>kelasList().flatMap(k=>gPKelas(u,P,k.id)));break;
    case 'kartu':{pages=gKartu(u,P,c.r);const r=R.find(x=>x.no===c.r);bar=rSel+cetakBar(nm('Kartu Peserta R'+c.r),()=>gKartu(u,P,c.r),'Semua ruang',allR(n=>gKartu(u,P,n)));
      extra=r?`<div class="small" style="margin-bottom:8px">Ruang ${r.no}: ${[[r.kKiri,r.ki],[r.kKanan,r.ka]].filter(x=>x[0]&&x[1].length).map(([k,ps])=>`<b>${esc(k.nama)}</b> ${ps.length} siswa (${esc(ps[0].no)} – ${esc(ps[ps.length-1].no)})`).join(' · ')} · total ${r.ps.length} · ${Math.ceil(r.ps.length/8)} halaman (8 kartu/halaman)</div>`:'';break}
    case 'dhadir':{const ds=c.dhK?-1:c.s;const sSelDH=`<select onchange="if(this.value==='-1')UI.ujc.dhK=true;else{UI.ujc.dhK=false;UI.ujc.s=+this.value}render()"><option value="-1" ${c.dhK?'selected':''}>— Kosongkan hari/tgl, jam & mapel (isi manual) —</option>${J.map(j=>`<option value="${j.sesi}" ${!c.dhK&&j.sesi===c.s?'selected':''}>Sesi ${j.sesi} · ${esc(hariOf(j.tanggal))} ${esc(tglL(j.tanggal))} · ${esc([...new Set([j.m7,j.m8,j.m9].filter(Boolean))].join('/'))}</option>`).join('')}</select>`;pages=gDHadir(u,P,c.r,c.pos,ds);bar=rSel+`<select onchange="UI.ujc.pos=this.value;render()">${[['all','Kedua kelas'],['Kiri','Kelas kiri'],['Kanan','Kelas kanan']].map(([a,b])=>`<option value="${a}" ${a===c.pos?'selected':''}>${b}</option>`).join('')}</select>`+sSelDH+cetakBar(nm(`Daftar Hadir R${c.r} `+(c.dhK?'kosong':'Sesi '+c.s)),()=>gDHadir(u,P,c.r,c.pos,ds),c.dhK?'Semua ruang (kosongan)':'Semua ruang (sesi ini)',allR(n=>gDHadir(u,P,n,'all',ds)));break}
    case 'dhmap':pages=gDHMap(u,P,c.r);bar=rSel+cetakBar(nm('DH Map R'+c.r),()=>gDHMap(u,P,c.r),'Semua ruang',allR(n=>gDHMap(u,P,n)));break;
    case 'ba':pages=gBA(u,P,c.r,c.s);bar=rSel+sSel+cetakBar(nm(`Berita Acara R${c.r} Sesi ${c.s}`),()=>gBA(u,P,c.r,c.s),'Semua ruang (sesi ini)',allR(n=>gBA(u,P,n,c.s)));extra='<p class="small muted">Jumlah hadir/tidak hadir & nomor peserta tidak hadir terisi otomatis bila sudah dicatat di Rekap Tidak Hadir.</p>';break;
    case 'dhpengawas':case 'serah':{const sr=tab==='serah';pages=gDHPengawas(u,P,c.s,sr);bar=sSel+cetakBar(nm((sr?'Serah Terima Naskah':'DH Pengawas')+' Sesi '+c.s),()=>gDHPengawas(u,P,c.s,sr),'Semua sesi',()=>dhSesi(u).flatMap(s=>gDHPengawas(u,P,s,sr)));break}
    case 'ijin':{const it=c.ijin=c.ijin||[{},{}];pages=gIjin(u,P,it);bar=[0,1].map(i=>`<input placeholder="No peserta ${i+1}" style="width:130px" value="${esc(it[i].no||'')}" onchange="UI.ujc.ijin[${i}].no=this.value.trim();render()"><input placeholder="Mapel" style="width:110px" value="${esc(it[i].mapel||'')}" onchange="UI.ujc.ijin[${i}].mapel=this.value;render()"><input placeholder="Jam ke" style="width:60px" value="${esc(it[i].jam||'')}" onchange="UI.ujc.ijin[${i}].jam=this.value;render()">`).join('<span class="muted">|</span>')+cetakBar(nm('Ijin Masuk'),()=>gIjin(u,P,c.ijin),'Blanko kosong (4 lembar)',()=>gIjin(u,P,[{},{},{},{},{},{},{},{}]));extra='<p class="small muted">Ketik nomor peserta → nama, kelas, dan ruang terisi otomatis. Kosongkan untuk blanko.</p>';break}
    case 'absen':pages=gAbsen(u,P);bar=`<button class="btn p" onclick="ujAbsenForm()">+ Catat tidak hadir</button>`+cetakBar(nm('Rekap Tidak Hadir'),()=>gAbsen(u,P));
      extra=(u.absen||[]).length?`<div class="tw" style="margin-bottom:12px"><table><thead><tr><th>Sesi</th><th>No peserta</th><th>Nama</th><th>Kelas</th><th>Ruang</th><th>Alasan</th><th>Ket.</th><th></th></tr></thead><tbody>${u.absen.map((a,i)=>{const p=P.find(x=>x.no===a.no);return `<tr><td>${a.sesi}</td><td>${esc(a.no)}</td><td>${esc(p?.s.nama||'tidak ditemukan')}</td><td>${esc(p?kn(p.s.kelasId):'')}</td><td>${p?.ruang??''}</td><td>${esc(a.alasan)}</td><td class="small">${esc(a.ket||'')}</td><td><button class="btn sm d" onclick="ujAbsenDel(${i})">✕</button></td></tr>`}).join('')}</tbody></table></div>`:'';break;
  }
  const land=UI._land;UI._land=false;return `<div class="bar">${bar}</div>${extra}${docPreview(pages,land)}`}
function ujTatibEdit(w){const u=UJ();const L=w?u.tatibPengawas:u.tatibPeserta;openModal(`<h2>Ubah ${w?'tata tertib pengawas':'tata tertib peserta'}</h2><p class="small muted">Satu butir per baris.</p><textarea id="ttE" rows="16" style="width:100%">${esc(L.join('\n'))}</textarea><div class="mfoot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn p" id="ttGo">Simpan</button></div>`,true);
  $('#ttGo').onclick=()=>{const v=$('#ttE').value.split('\n').map(x=>x.trim()).filter(Boolean);if(w)u.tatibPengawas=v;else u.tatibPeserta=v;saveUJ(u,1);closeModal();render()}}
function ujAbsenForm(){const u=UJ();const P=peserta(u);openModal(`<h2>Catat peserta tidak hadir</h2><div class="form"><label>Sesi<select id="abS">${sesiList(u).map(j=>`<option value="${j.sesi}">Sesi ${j.sesi} · ${esc(hariOf(j.tanggal))} ${esc(tglL(j.tanggal))}</option>`).join('')}</select></label>
  <label>No peserta<input id="abN" list="abNl" placeholder="mis. ${esc(P[0]?.no||'')}"><datalist id="abNl">${P.map(p=>`<option value="${esc(p.no)}">${esc(p.s.nama)} · ${esc(p.k.nama)}</option>`).join('')}</datalist></label>
  <label>Alasan<select id="abA"><option value="S">Sakit</option><option value="I">Ijin</option><option value="TK">Tanpa keterangan</option></select></label><label>Keterangan<input id="abK"></label></div><p class="small" id="abInfo"></p>
  <div class="mfoot"><button class="btn" onclick="closeModal()">Tutup</button><button class="btn p" id="abGo">Simpan & tambah lagi</button></div>`);
  $('#abN').oninput=()=>{const p=P.find(x=>x.no===$('#abN').value.trim());$('#abInfo').innerHTML=p?`<b>${esc(p.s.nama)}</b> · ${esc(p.k.nama)} · Ruang ${p.ruang}`:''};
  $('#abGo').onclick=()=>{const no=$('#abN').value.trim();if(!P.find(x=>x.no===no)){toast('Nomor peserta tidak ditemukan');return}const u2=UJ();u2.absen=[...(u2.absen||[]).filter(a=>!(a.no===no&&a.sesi===+$('#abS').value)),{sesi:+$('#abS').value,no,alasan:$('#abA').value,ket:$('#abK').value.trim()}];saveUJ(u2,1);$('#abN').value='';$('#abK').value='';$('#abInfo').textContent='Tersimpan.';render()}}
function ujAbsenDel(i){const u=UJ();u.absen=u.absen.filter((_,j)=>j!==i);saveUJ(u,1);render()}
document.addEventListener('click',e=>{const d=e.target.closest('[data-dn]');if(!d||!d.closest('#main'))return;const i=+d.dataset.dn;const u=UJ();const b=u.denah[i];
  openModal(`<h2>Ubah kotak denah</h2><div class="form"><label class="full">Tulisan<input id="dnT" value="${esc(b[4])}"></label><label>Warna<select id="dnF"><option value="">Putih</option><option value="#DDEBF7" ${b[5]==='#DDEBF7'?'selected':''}>Biru (ruang ujian)</option><option value="#FFF2CC" ${b[5]==='#FFF2CC'?'selected':''}>Kuning</option><option value="#E2EFDA" ${b[5]==='#E2EFDA'?'selected':''}>Hijau</option></select></label></div><div class="mfoot"><button class="btn d" id="dnDel" style="margin-right:auto">Hapus kotak</button><button class="btn" onclick="closeModal()">Batal</button><button class="btn p" id="dnGo">Simpan</button></div>`);
  $('#dnGo').onclick=()=>{const nb=[...b];nb[4]=$('#dnT').value;nb[5]=$('#dnF').value;u.denah=u.denah.map((x,j)=>j===i?nb:x);saveUJ(u,1);closeModal();render()};
  $('#dnDel').onclick=()=>{u.denah=u.denah.filter((_,j)=>j!==i);saveUJ(u,1);closeModal();render()}});
function denahTambah(){const u=UJ();const B=u.denah||[];const r=B.length?Math.max(...B.map(b=>b[2]))+2:10;u.denah=[...B,[r,1,r+4,8,'Ruang baru','#DDEBF7','tblr',true,8]];saveUJ(u,1);render();toast('Kotak baru ditambahkan di bawah denah')}

/* ============================ VIEW: PERANGKAT AJAR ============================ */
function vPerangkat(){
  const it=S.cfg.perangkat;const gs=guruList();
  if(!gs.length)return '<div class="card empty">Tambahkan data <a href="#guru">Guru</a> dulu.</div>';
  return `<div class="bar"><span class="muted small">Centang dokumen yang sudah dikumpulkan & diverifikasi. Daftar dokumen bisa diubah di Pengaturan.</span><span class="sp"></span><button class="btn" onclick="exportPerangkat()">Ekspor</button></div>
  <div class="tw"><table><thead><tr><th>Guru</th>${it.map(x=>`<th class="c" style="white-space:normal;min-width:70px">${esc(x)}</th>`).join('')}<th class="c">%</th><th>Catatan</th></tr></thead><tbody>
  ${gs.map(g=>{const d=get('perangkat',g.id)||{};const p=perangkatPct(g.id);return `<tr><td><b>${esc(g.nama)}</b></td>${it.map(x=>`<td class="c"><input class="chk" type="checkbox" ${d.items?.[x]?'checked':''} onchange="togglePerangkat('${g.id}',${JSON.stringify(x).replace(/"/g,'&quot;')},this.checked)"></td>`).join('')}<td class="c"><span class="tag ${p===100?'ok':p>=50?'warn':'bad'}">${p}%</span></td><td><input style="width:180px" value="${esc(d.catatan||'')}" onchange="catatanPerangkat('${g.id}',this.value)"></td></tr>`}).join('')}
  </tbody></table></div>`;
}
function togglePerangkat(gid,item,v){const d=Object.assign({id:gid,guruId:gid,items:{}},get('perangkat',gid));d.items=Object.assign({},d.items,{[item]:v});put('perangkat',d)}
function catatanPerangkat(gid,v){const d=Object.assign({id:gid,guruId:gid,items:{}},get('perangkat',gid));d.catatan=v;put('perangkat',d)}
function exportPerangkat(){const it=S.cfg.perangkat;exportTable('Kelengkapan Perangkat Ajar',['No','Guru',...it,'Persen','Catatan'],guruList().map((g,i)=>{const d=get('perangkat',g.id)||{};return [i+1,g.nama,...it.map(x=>d.items?.[x]?'✓':'-'),perangkatPct(g.id)+'%',d.catatan||'']}))}

/* ============================ VIEW: PENGATURAN ============================ */
function vPengaturan(){
  const c=S.cfg;
  const inp=(k,l,t='text')=>`<label>${l}<input data-c="${k}" type="${t}" value="${esc(c[k])}"></label>`;
  return `<div class="card"><h3>Identitas sekolah</h3><div class="form">${inp('sekolah','Nama sekolah')}${inp('npsn','NPSN')}<label class="full">Alamat<input data-c="alamat" value="${esc(c.alamat)}"></label>${inp('tahun','Tahun ajaran')}<label>Semester<select data-c="semester">${['Ganjil','Genap'].map(x=>`<option ${x===c.semester?'selected':''}>${x}</option>`).join('')}</select></label><label>Kepala sekolah<input data-c="kepsek" list="dlGuru" value="${esc(c.kepsek)}" onchange="const g=guruList().find(x=>x.nama===this.value);if(g&&g.nip)document.querySelector('[data-c=nipKepsek]').value=g.nip"></label>${inp('nipKepsek','NIP kepala sekolah')}<datalist id="dlGuru">${guruList().map(g=>`<option value="${esc(g.nama)}">`).join('')}</datalist>${inp('wakasek','Wakasek kurikulum')}${inp('nipWakasek','NIP wakasek')}</div></div>
  <div class="card"><h3>Penilaian</h3><div class="form">${inp('kktp7','KKTP kelas VII','number')}${inp('kktp8','KKTP kelas VIII','number')}${inp('kktp9','KKTP kelas IX','number')}${inp('pengayaan','Batas pengayaan','number')}${inp('bobotSLM','Bobot rerata SLM (%)','number')}${inp('bobotSTS','Bobot STS (%)','number')}${inp('bobotSAS','Bobot SAS (%)','number')}${inp('jmlSLM','Jumlah kolom SLM awal','number')}</div></div>
  <div class="card"><h3>Jam pelajaran & beban kerja</h3><div class="form">${inp('minJP','Minimal beban kerja (JP/minggu)','number')}<label>Hari sekolah<input id="cfHari" value="${esc(c.hari.join(', '))}"></label>${c.hari.map(h=>`<label>Jumlah jam ${h}<input data-jam="${esc(h)}" type="number" value="${esc(c.jam[h]??8)}"></label>`).join('')}</div></div>
  <div class="card small" style="background:var(--pri2);border-color:#cfe2da">Ekuivalensi jam tugas tambahan sekarang diatur per kategori di <a href="#tt" onclick="UI.tab.tt='ref'">Tugas Tambahan → Referensi</a>, dan per orang di Input Tugas.</div>
  <div class="card"><h3>Daftar dokumen perangkat ajar <small>satu per baris</small></h3><textarea id="cfPer" rows="6" style="width:100%">${esc(c.perangkat.join('\n'))}</textarea></div>
  <div class="card"><h3>Instrumen supervisi <small>satu per baris: Aspek | Indikator</small></h3><textarea id="cfIns" rows="10" style="width:100%;font-size:12.5px">${esc(c.instrumen.map(x=>x[0]+' | '+x[1]).join('\n'))}</textarea><p class="small muted">Catatan supervisi lama tetap memakai instrumen saat dicatat.</p></div>
  <div class="card"><h3>Kop surat <small>dipakai di semua berkas cetak</small></h3><img src="${KOP()}" style="max-width:100%;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff"><div class="bar" style="margin-top:10px"><label class="btn">Ganti gambar kop<input type="file" accept="image/*" style="display:none" onchange="gantiKop(this.files[0])"></label>${S.kop?'<button class="btn" onclick="hapusKop()">Kembalikan kop bawaan</button>':''}<span class="small muted">Gunakan gambar kop selebar halaman (PNG/JPG), sudah termasuk garis bawahnya.</span></div></div>${ttdKartu()}
  <div class="bar"><button class="btn p" onclick="simpanCfg()">Simpan pengaturan</button></div>
  <div class="card"><h3>Cadangan data</h3><p class="small muted">Simpan salinan seluruh data (JSON) secara berkala, misalnya tiap akhir semester.</p><div class="bar">${S.dl?'<button class="btn" onclick="backup()">Unduh cadangan</button>':''}<button class="btn" onclick="backupCopy()">Salin cadangan</button><label class="btn">Pulihkan dari file<input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label><span class="sp"></span><button class="btn d" onclick="hapusSemua()">Hapus semua data</button></div>
  <p class="small muted">Penyimpanan: ${S.mode==='db'?'tersimpan di akun (bisa dibuka dari perangkat lain dan oleh rekan yang Anda bagikan akses).':'hanya di browser ini.'}</p></div>`;
}
function simpanCfg(){
  const c=S.cfg;document.querySelectorAll('[data-c]').forEach(el=>{const k=el.dataset.c;c[k]=el.type==='number'?Number(el.value):el.value.trim()});
  const hari=$('#cfHari').value.split(',').map(x=>x.trim()).filter(Boolean);const jam={};hari.forEach(h=>{const el=document.querySelector(`[data-jam="${h}"]`);jam[h]=el?Number(el.value):(c.jam[h]??8)});c.hari=hari;c.jam=jam;
  c.perangkat=$('#cfPer').value.split('\n').map(x=>x.trim()).filter(Boolean);
  c.instrumen=$('#cfIns').value.split('\n').map(l=>{const p=l.split('|');return p.length>1?[p[0].trim(),p.slice(1).join('|').trim()]:['Umum',l.trim()]}).filter(x=>x[1]);
  saveCfg();render();toast('Pengaturan disimpan')
}
function gantiKop(f){if(!f)return;const img=new Image();const fr=new FileReader();fr.onload=()=>{img.onload=()=>{const w=Math.min(1600,img.width),h=Math.round(img.height*w/img.width);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);const d=c.toDataURL('image/png');
  if(d.length>240000){toast('Gambar terlalu besar, gunakan gambar yang lebih kecil');return}S.kop=d;S.kopData=d;simpanKop();render();toast('Kop surat diganti')};img.src=fr.result};fr.readAsDataURL(f)}
function gantiTtd(f,jenis){if(!f)return;const img=new Image();const fr=new FileReader();fr.onload=()=>{img.onload=()=>{const max=jenis==='cap'?500:700;const sc=Math.min(1,max/Math.max(img.width,img.height));const w=Math.round(img.width*sc),h=Math.round(img.height*sc);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const D=x.getImageData(0,0,w,h),a=D.data;for(let i=0;i<a.length;i+=4){const l=(a[i]+a[i+1]+a[i+2])/3;if(l>235)a[i+3]=0;else if(l>200)a[i+3]=Math.min(a[i+3],Math.round((235-l)/35*255))}x.putImageData(D,0,0);const d=c.toDataURL('image/png');
  if(d.length>300000){toast('Gambar terlalu besar, gunakan gambar yang lebih kecil');return}if(jenis==='cap')S.capKS=d;else{S.ttdKS=d;S.ttdGabung=false;if(S._ttdOnAfter){S._ttdOnAfter=false;S.cfg.ttdCetak=true;saveCfg()}}simpanTtd();render();toast(jenis==='cap'?'Stempel disimpan':'Tanda tangan disimpan')};img.src=fr.result};fr.readAsDataURL(f)}
function hapusTtd(jenis){if(jenis==='cap')S.capKS=null;else S.ttdKS=null;simpanTtd();render()}
function simpanTtd(){const o={};if(S.ttdKS)o.ttd=S.ttdKS;if(S.capKS)o.cap=S.capKS;if(S.ttdKS&&S.ttdGabung)o.gabung=true;if(S.mode!=='db'){try{localStorage.setItem(LSKEY+'-ttd',JSON.stringify(o))}catch(e){}return}const k='pengaturan/ttd';touched[k]=Date.now();S.db.doc(k).set(o).catch(writeErr)}
const TTDON=()=>!!(S.cfg.ttdCetak&&S.ttdKS);
function setTtdCetak(on){if(on&&!S.ttdKS){toast('Unggah dulu gambar tanda tangan di Pengaturan → Tanda tangan & stempel');render();return}S.cfg.ttdCetak=!!on;saveCfg();render();toast(on?'Surat dicetak dengan tanda tangan kepala sekolah':'Surat dicetak tanpa tanda tangan (ruang kosong untuk ttd basah)')}
function ttdUnggahCetak(f){if(!f)return;S._ttdOnAfter=true;gantiTtd(f,'ttd')}
function ttdToggle(){if(!S.ttdKS)return `<label class="small ttdtg" style="display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px dashed var(--line);border-radius:999px;background:#fff;cursor:pointer" title="Unggah gambar tanda tangan (+ stempel) kepala sekolah sekali saja; setelah itu surat bisa dicetak dengan atau tanpa ttd">✍ Cetak dengan ttd kepsek <span class="muted">· unggah gambar ttd</span><input type="file" accept="image/*" style="display:none" onchange="ttdUnggahCetak(this.files[0])"></label>`;return S.ttdKS?`<label class="small ttdtg" style="display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:${TTDON()?'#eaf5ef':'#fff'}" title="Berlaku untuk semua surat yang ditandatangani kepala sekolah"><input type="checkbox" class="chk" ${TTDON()?'checked':''} onchange="setTtdCetak(this.checked)">✍ Pakai tanda tangan & stempel kepsek</label>`:''}
function ttdBlok(on,tinggi=60,kecil=false){if(!on||!S.ttdKS)return '<br><br><br><br>';
  if(kecil)return `<div style="position:relative;height:${tinggi}px"><img class="ttdimg" src="${S.ttdKS}" alt="" style="position:absolute;left:50%;top:-3px;height:${tinggi+8}px;transform:translateX(-58%)"></div>`;
  if(S.ttdGabung&&!S.capKS)return `<div class="ttdbox gab" style="position:relative;height:${tinggi}px"><img class="ttdimg" src="${S.ttdKS}" alt="" style="position:absolute;left:-64px;top:-10px;height:${tinggi+30}px"></div>`;
  return `<div class="ttdbox" style="position:relative;height:${tinggi}px">${S.capKS?`<img class="capimg" src="${S.capKS}" alt="" style="position:absolute;left:-38px;top:-10px;height:${tinggi+20}px">`:''}<img class="ttdimg" src="${S.ttdKS}" alt="" style="position:absolute;left:6px;top:0;height:${tinggi}px;max-width:220px;object-fit:contain"></div>`}
function ttdKartu(){return `<div class="card"><h3>Tanda tangan & stempel Kepala Sekolah <small>dipakai bila opsi "cetak dengan tanda tangan" dinyalakan</small></h3>
  <div style="display:flex;gap:18px;flex-wrap:wrap">${[['ttd',S.ttdGabung?'Tanda tangan + stempel (satu gambar)':'Tanda tangan',S.ttdKS],['cap','Stempel sekolah'+(S.ttdGabung?' (tidak perlu, sudah menyatu)':''),S.capKS]].map(([j,l,v])=>`<div style="flex:1 1 240px"><div class="small" style="font-weight:700;margin-bottom:6px">${l}</div><div style="height:110px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff">${v?`<img src="${v}" style="max-height:100px;max-width:100%">`:'<span class="small muted">Belum ada</span>'}</div>
   <div class="bar" style="margin-top:8px"><label class="btn sm">${v?'Ganti':'Unggah'} gambar<input type="file" accept="image/*" style="display:none" onchange="gantiTtd(this.files[0],'${j}')"></label>${v?`<button class="btn sm d" onclick="hapusTtd('${j}')">Hapus</button>`:''}</div></div>`).join('')}</div>
  <p class="small muted">Foto/scan tanda tangan dengan tinta gelap di kertas putih. Latar putih otomatis dibuat transparan, jadi bisa ditimpa stempel. Gambar tersimpan di aplikasi ini saja.</p></div>`}
function hapusKop(){S.kop=null;S.kopData=null;simpanKop();render()}
function simpanKop(){if(S.mode!=='db'){try{S.kop?localStorage.setItem(LSKEY+'-kop',S.kop):localStorage.removeItem(LSKEY+'-kop')}catch(e){}return}const k='pengaturan/kop';touched[k]=Date.now();(S.kop?S.db.doc(k).set({data:S.kop}):S.db.doc(k).delete()).catch(writeErr)}
function dump(){return JSON.stringify({versi:1,dibuat:new Date().toISOString(),cfg:S.cfg,data:S.data})}

/* ===== keterangan cadangan & pulihkan ===== */
const RK_NM={siswa:'siswa',guru:'guru',tendik:'tendik',tu:'TU',kelas:'kelas',mapel:'mapel',jadwal:'jadwal',nilai:'nilai',tugas:'pembagian tugas',agenda:'agenda',supervisi:'supervisi',perangkat:'perangkat',rapor:'rapor',surat:'surat',ujian:'ujian',proker:'proker',kokurikuler:'kokurikuler',pengganti:'guru pengganti',tt:'tugas tambahan',pk:'penilaian kinerja',jadwalVersi:'versi jadwal',sk:'SK tim'};
function rkRingkas(data){const parts=[];let tot=0;for(const c of Object.keys(data||{})){const n=Object.keys(data[c]||{}).length;if(!n)continue;tot+=n;parts.push('<b>'+n.toLocaleString('id-ID')+'</b> '+(RK_NM[c]||c))}return{tot,html:parts.length?parts.join(' · '):'(belum ada data)'}}
function infoBox(judul,isi,warna){openModal('<h2 style="color:'+(warna||'var(--ink)')+'">'+judul+'</h2><div style="line-height:1.6">'+isi+'</div><div class="mfoot"><button class="btn p" onclick="closeModal()">Oke, mengerti</button></div>')}
function backup(){const fn='cadangan-wakasek-'+today()+'.json',r=rkRingkas(S.data);S.dl.save({filename:fn,data:dump()}).then(()=>infoBox('✅ Cadangan berhasil diunduh','File <b>'+fn+'</b> sudah tersimpan di folder <b>Unduhan / Download</b> perangkat ini.<br><br>Isinya: '+r.html+'.<br><br>Langkah berikutnya: buka aplikasi tujuan → <b>Pengaturan → Pulihkan dari file</b> → pilih file ini.','#1f7a4d')).catch(e=>infoBox('⚠️ Cadangan belum terunduh',(e&&e.code==='declined')?'Unduhan dibatalkan. Ketuk <b>Unduh cadangan</b> lagi lalu pilih <b>Simpan</b>.':'Unduhan gagal ('+esc(String(e&&e.code||e))+'). Coba lagi, atau pakai tombol <b>Salin cadangan</b>.','#b45309'))}
function backupCopy(){const r=rkRingkas(S.data);navigator.clipboard.writeText(dump()).then(()=>infoBox('✅ Cadangan berhasil disalin','Seluruh data ('+r.html+') sudah disalin ke papan klip. Tempel ke file teks lalu simpan dengan akhiran <b>.json</b>.','#1f7a4d')).catch(()=>infoBox('⚠️ Gagal menyalin','Browser menolak menyalin. Pakai tombol <b>Unduh cadangan</b>.','#b45309'))}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.data)throw 0;confirmBox('Pulihkan data dari file ini? Isinya: '+rkRingkas(j.data).html+'. Data dengan ID yang sama akan ditimpa.',async()=>{infoBox('⏳ Sedang memulihkan…','Mohon tunggu dan jangan tutup halaman ini. Kemajuan tampil di bagian bawah layar.');S.cfg=Object.assign(JSON.parse(JSON.stringify(DEF_CFG)),j.cfg||{});saveCfg();for(const c of Object.keys(j.data)){if(!/^[A-Za-z0-9_-]+$/.test(c))continue;if(!S.data[c])S.data[c]={};const arr=Object.values(j.data[c]||{}).filter(o=>o&&typeof o==='object');if(arr.length)await bulk(c,arr,'Memulihkan '+c)}const r=rkRingkas(j.data);if(S.mode==='db'){infoBox('✅ Data berhasil dipulihkan','Semua isi file sudah dimasukkan dan <b>tersimpan di akun</b>, jadi bisa dibuka dari perangkat mana pun.<br><br>Yang dipulihkan: '+r.html+'.','#1f7a4d')}else{infoBox('⚠️ Data dipulihkan, tapi BELUM tersimpan di akun','Isi file sudah masuk ('+r.html+'), tetapi aplikasi sedang dalam <b>mode lokal</b>, jadi data hanya tersimpan di browser perangkat ini.<br><br>Pastikan sudah login claude.ai, buka lewat Chrome/Safari, muat ulang sampai tulisan <b>lokal</b> di pojok kanan atas hilang, lalu pulihkan lagi.','#b45309')}},'Pulihkan')}catch(e){toast('File cadangan tidak valid')}};r.readAsText(f)}
function hapusSemua(){confirmBox('Hapus <b>SEMUA</b> data (siswa, guru, nilai, jadwal, dll.)? Unduh cadangan dulu bila perlu.',()=>confirmBox('Yakin? Ini tidak bisa dibatalkan.',async()=>{for(const c of COLS){const ids=Object.keys(S.data[c]);if(ids.length)await bulkDel(c,ids)}toast('Semua data dihapus')},'Ya, hapus semua'),'Lanjut')}

/* ============================ IMPOR PAKET SEKOLAH ============================ */
S.paket=null;
function cekPaket(){fetch('impor.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.data&&j.id){S.paket=j;scheduleRender()}}).catch(()=>{})}
function paketCard(){const p=S.paket;if(!p||S.cfg.imporId===p.id)return '';const n=c=>Object.keys(p.data[c]||{}).length;
  return `<div class="card" style="border-color:#9cc7b7;background:var(--pri2)"><h3>📥 ${p.mode==='gabung'?(p.data.siswa?'Data siswa Dapodik & nilai rapor siap dimasukkan':'Data DUK siap dimasukkan'):p.data.ujian?'Perangkat ujian ASAS siap dimasukkan':p.mode==='tambah'?'Data tugas tambahan siap dimasukkan':'Data sekolah siap dimasukkan'}</h3><p class="small">${esc(p.ket||'')}</p>
  ${p.mode==='gabung'&&p.data.siswa?`<div class="small" style="margin-bottom:10px"><b>${n('siswa')}</b> siswa kelas IX (nama, NISN, NIS, L/P, tempat & tanggal lahir, agama, rombel sesuai Dapodik) · nilai rapor semester 1–4 untuk <b>${n('rapor')}</b> siswa</div>`:p.mode==='gabung'?`<div class="small" style="margin-bottom:10px">Melengkapi <b>${n('guru')}</b> data guru (tempat lahir, pangkat & TMT, jabatan & TMT, masa kerja, pendidikan, catatan mutasi, no. urut DUK) · <b>${n('tendik')}</b> tenaga kependidikan</div>`:p.mode==='tambah'&&p.data.ujian?`<div class="small" style="margin-bottom:10px">Perangkat ujian <b>${esc(Object.values(p.data.ujian)[0].nama)}</b>: ${Object.values(p.data.ujian)[0].ruang.length} ruang · ${Object.values(p.data.ujian)[0].jadwal.length} sesi · panitia/pengawas/korektor ${Object.keys(Object.values(p.data.ujian)[0].flags).length} guru · pengawas & pengoreksi terisi · tata tertib & denah</div>`:p.mode==='tambah'?`<div class="small" style="margin-bottom:10px"><b>${n('tt')}</b> tugas tambahan & kepanitiaan · penilaian aspek <b>${n('pk')}</b> guru · referensi kategori, jenis tugas, nomor SK</div>`:`<div class="small" style="margin-bottom:10px"><b>${n('guru')}</b> guru · <b>${n('siswa')}</b> siswa · <b>${n('kelas')}</b> kelas · <b>${n('mapel')}</b> mapel · <b>${n('tugas')}</b> penugasan mengajar · jadwal <b>${n('jadwal')}</b> kelas · <b>${n('agenda')}</b> agenda</div>`}
  <button class="btn p" onclick="terapkanPaket()">Masukkan data sekarang</button> <span class="small muted">${p.mode==='gabung'?(p.data.siswa?'Data siswa kelas lain tidak berubah.':'Data guru lain (mapel, tugas, jadwal) tidak berubah.'):p.mode==='tambah'?'Data lain tidak berubah.':'Data lama di aplikasi (termasuk data contoh) akan diganti.'}</span></div>`}
function terapkanPaket(){const p=S.paket;if(p.mode==='gabung')return gabungPaket(p);const tambah=p.mode==='tambah';const cols=tambah?COLS.filter(c=>p.data[c]):COLS;confirmBox(tambah?`Masukkan ${p.data.ujian?'perangkat ujian':'data tugas tambahan & penilaian kinerja'} dari file Excel? Data siswa, guru, jadwal, dan nilai yang sudah ada <b>tidak</b> diubah.`:'Ganti seluruh data di aplikasi dengan data sekolah dari file Excel? Data contoh/data lama akan dihapus.',async()=>{
  const total=cols.reduce((s,c)=>s+Object.keys(S.data[c]).length+Object.keys(p.data[c]||{}).length,0);let done=0;
  openModal(`<h2>Memasukkan data…</h2><p class="muted small">Jangan tutup halaman ini.</p><div class="meter" style="height:12px"><span id="pgb" style="width:0%"></span></div><p class="small" id="pgt"></p>`);
  const tick=(n,lbl)=>{const b=document.getElementById('pgb');if(b){b.style.width=Math.round((done+n)/total*100)+'%';document.getElementById('pgt').textContent=lbl+' '+(done+n)+'/'+total}};
  for(const c of cols){const ids=Object.keys(S.data[c]);if(ids.length){await bulkDel(c,ids);done+=ids.length;tick(0,'Membersihkan data lama')}}
  S.cfg=Object.assign(JSON.parse(JSON.stringify(DEF_CFG)),S.cfg,p.cfg||{},{imporId:p.id});saveCfg();
  for(const c of cols){const arr=Object.values(p.data[c]||{}).map(o=>Object.assign({},o));if(arr.length){await bulk(c,arr,n=>tick(n,'Menyimpan '+c));done+=arr.length}}
  closeModal();toast('Data sekolah berhasil dimasukkan ✓');render()},'Ya, masukkan')}

function gabungPaket(p){confirmBox(p.data.siswa?`Perbarui data <b>${Object.keys(p.data.siswa).length} siswa</b> sesuai Dapodik (dicocokkan lewat NISN) dan masukkan <b>nilai rapor</b>? Siswa kelas lain dan data lain tidak berubah.`:'Lengkapi data guru dan masukkan data tenaga kependidikan dari DUK? Data guru yang lain tidak berubah.',async()=>{
  const nn=x=>String(x||'').replace(/\D/g,'');let miss=[];
  for(const c of Object.keys(p.data)){const arr=[];
    for(const o of Object.values(p.data[c])){let cur=null;
      if(c==='guru'){cur=all('guru').find(g=>nn(g.nip)&&nn(g.nip)===nn(o.nip));if(!cur){miss.push(o.nama);continue}}
      else if(c==='siswa'){cur=all('siswa').find(x=>nn(x.nisn)&&nn(x.nisn)===nn(o.nisn))||(o.nis&&all('siswa').find(x=>nn(x.nis)===nn(o.nis)));if(!cur){const id='s'+(o.nis||o.nisn);arr.push(Object.assign({status:'Aktif'},o,{id}));continue}}
      else if(c==='rapor'){const sw=all('siswa').find(x=>nn(x.nisn)&&nn(x.nisn)===nn(o.nisn));if(!sw){miss.push(o.nisn);continue}cur=S.data.rapor[sw.id]||{id:sw.id,n:{}};const d=clone(cur);d.id=sw.id;Object.entries(o.n||{}).forEach(([m,v])=>{d.n[m]=Object.assign({},d.n[m]||{},v)});arr.push(d);continue}
      else cur=S.data[c][o.id]||all(c).find(g=>nn(g.nip)&&nn(g.nip)===nn(o.nip));

function ckJobs(ids){const J=[];ids.forEach((id,n)=>{const d=ckItem(id);if(!d)return;const v=ckState().pick[id]||'';const dir=String(n+1).padStart(2,'0')+'_'+fnSafe(d.l);

async function ckTerpisahJalan(ids,fmt){if(CK_BUSY){toast('Masih memproses unduhan sebelumnya…');return}CK_BUSY=true;const files=[],gagal=[];const enc=new TextEncoder();const pakai=new Set();
  try{const J=ckJobs(ids);for(let i=0;i<J.length;i++){const jb=J[i];toast(`Menyiapkan ${i+1}/${J.length}: ${jb.nm}`);
      try{const p=jb.pages();if(!p.length){gagal.push(jb.nm+' (kosong)');continue}
        const r=await unduhDok(jb.nm,p,fmt==='word',false,false,false,true);
        let base=jb.file;while(pakai.has(base))base+='_';pakai.add(base);
        if(fmt==='word')files.push({name:base+'.doc',data:enc.encode(r.data)});
        else files.push({name:base+'.pdf',data:await pdfDariHtml(r.html,r.fn,true)})}
      catch(e){console.error(e);gagal.push(jb.nm)}}
    if(!files.length){toast('Tidak ada file yang berhasil dibuat');return}
    await S.dl.save({filename:'Paket_dokumen_'+fnSafe(tglJam())+'.zip',data:buatZip(files)});
    if(gagal.length)infoBox('⚠️ Sebagian dokumen dilewati',files.length+' file berhasil diunduh. Dilewati: '+esc(gagal.slice(0,20).join(', '))+(gagal.length>20?' …':''),'#b45309');else toast(files.length+' file terpisah berhasil diunduh (dalam 1 ZIP)')}
  catch(e){toast(e&&e.code==='declined'?'Unduhan dibatalkan':'Gagal mengunduh'+(e&&e.message?' ('+e.message+')':''))}finally{CK_BUSY=false}}

function skOrang(a){const g=a.gid?orang(a.gid):null;return {nama:a.nama||g?.nama||'……',nip:a.nip!=null&&a.nip!==''?a.nip:(g?.nip||''),
  gol:a.gol||(g?(g.pangkat||golTxt(g)):'')||'–',dinas:a.dinas!=null&&a.dinas!==''?a.dinas:skDinasDefault(g),peran:a.peran||'',grup:a.grup||'',g}}
function skSimpan(o,rerender){o.diubah=Date.now();return put('sk',o,{silent:!rerender})}
function skSet(k,v,rerender){const d=skCur();if(!d)return;skSimpan(Object.assign({},d,{[k]:v}),rerender)}
function skArr(k,i,f,v,rerender){const d=skCur();if(!d)return;const arr=(d[k]||[]).map(x=>Object.assign({},x));if(!arr[i])return;arr[i][f]=v;skSimpan(Object.assign({},d,{[k]:arr}),rerender)}
function skArrOp(k,op,i){const d=skCur();if(!d)return;const arr=(d[k]||[]).slice();
  if(op==='add')arr.push(k==='anggota'?{gid:'',peran:'',dinas:'',grup:(arr[arr.length-1]||{}).grup||''}:k==='tugas'?{jab:'',uraian:''}:{judul:'',isi:''});
  else if(op==='del')arr.splice(i,1);else if(op==='up'&&i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];else if(op==='dn'&&i<arr.length-1)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];
  skSimpan(Object.assign({},d,{[k]:arr}),true)}
function skPilihGuru(i,v){const d=skCur();if(!d)return;const arr=(d.anggota||[]).map(x=>Object.assign({},x));const a=arr[i];if(!a)return;
  if(v==='__m'){a.gid='';a.nama=a.nama||'';}else{a.gid=v;a.nama='';a.nip='';a.gol='';a.dinas=''}skSimpan(Object.assign({},d,{anggota:arr}),true)}
function skBaru(preset){const o=Object.assign(JSON.parse(JSON.stringify(SK_DEF)),{nomor:'400.3/……/SMPN 5/'+ROMBLN[new Date().getMonth()]+'/'+new Date().getFullYear(),dibuat:Date.now()},preset||{});
  if(!preset)Object.assign(o,{nama:'Tim baru',judul:'PEMBENTUKAN TIM …… SMP NEGERI 5 TANGERANG TAHUN PELAJARAN '+(S.cfg.tahun||''),
    menimbang:'bahwa ……;\nbahwa berdasarkan pertimbangan sebagaimana dimaksud pada huruf a, perlu menetapkan Keputusan Kepala SMP Negeri 5 Tangerang tentang ……',
    mengingat:'Undang-Undang Nomor 20 Tahun 2003 tentang Sistem Pendidikan Nasional;\nUndang-Undang Nomor 14 Tahun 2005 tentang Guru dan Dosen.',
    diktum:'Membentuk …… dengan susunan sebagaimana tercantum dalam Lampiran I Keputusan ini.\nTim mempunyai tugas sebagaimana tercantum dalam Lampiran II Keputusan ini.\nKeputusan ini berlaku sejak tanggal ditetapkan, dengan ketentuan apabila di kemudian hari terdapat kekeliruan akan diadakan perbaikan sebagaimana mestinya.',
    tembusan:'Kepala Dinas Pendidikan Kota Tangerang;\nYang bersangkutan untuk dilaksanakan;\nArsip.',anggota:[{gid:(kepsekGuru()||{}).id||'',peran:'Penanggung Jawab',dinas:'Kepala Sekolah'}]});
  put('sk',o).then(x=>{UI.skId=x.id;UI.tab.sk='buat';render()})}
function skDuplikat(id){const d=get('sk',id);if(!d)return;const o=JSON.parse(JSON.stringify(d));delete o.id;delete o.tpl;o.nama=(o.nama||'SK')+' (salinan)';o.dibuat=Date.now();
  put('sk',o).then(x=>{UI.skId=x.id;UI.tab.sk='buat';render();toast('SK diduplikat')})}
function skHapus(id){const d=get('sk',id);if(!d)return;confirmBox(`Hapus SK <b>${esc(d.nama||d.judul||'')}</b>? Bisa dibatalkan dengan ↶ Urungkan.`,()=>{if(UI.skId===id)UI.skId=null;del('sk',id);toast('SK dihapus. Tekan ↶ Urungkan untuk mengembalikan.')})}

/* ---------- tampilan cetak ---------- */
const skBr=t=>esc(t).replace(/\n/g,'<br>');
const SK_KECIL=new Set(['dan','di','ke','dari','dalam','melalui','untuk','pada','yang','atau','serta','tentang','bagi','oleh','sebagai']);
function skJudulKalimat(t){return String(t||'').split(/\s+/).filter(Boolean).map((w,i)=>{const b=w.replace(/[^A-Za-z]/g,'');if(/\(/.test(w)||/^(SMP|SMA|SD|UPT|SSK|LCC|BOS|IPA|IPS|TIK|UKS|PBLHS|PIK-R|OSIS|RKAS|GSS|ANBK)$/.test(w.replace(/[(),.;]/g,''))||(/^[IVX]+$/.test(b)&&b.length>1))return w;const l=w.toLowerCase();return i>0&&SK_KECIL.has(l)?l:l.replace(/^(\W*)(\w)/,(m,p,c)=>p+c.toUpperCase())}).join(' ')}
function skList(arr,mark){return `<table class="nb skt" style="margin:0">${arr.map((x,i)=>`<tr><td style="width:24px">${mark(i)}</td><td style="text-align:justify">${esc(x)}</td></tr>`).join('')}</table>`}
function skMarkup(t){const L=String(t||'').split('\n');let h='',tbl=[],lst=[];
  const fT=()=>{if(!tbl.length)return;const rows=tbl.map(r=>r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim())).filter(r=>!r.every(c=>/^:?-{2,}:?$/.test(c)));
    const hd=rows[0]||[];h+=`<table class="skg"><thead><tr>${hd.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map((c,i)=>`<td${i===0&&/^\d+$/.test(c)?' class="c"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;tbl=[]};
  const fL=()=>{if(!lst.length)return;h+=`<table class="nb skt" style="margin:0 0 4px 18px;width:calc(100% - 18px)">${lst.map(([m,x])=>`<tr><td style="width:24px">${esc(m)}</td><td style="text-align:justify">${esc(x)}</td></tr>`).join('')}</table>`;lst=[]};
  L.forEach(x=>{const s=x.trim();let m;
    if(s.startsWith('|')){fL();tbl.push(s);return}fT();
    if(m=s.match(/^([0-9]{1,2}|[a-z])[.)]\s+(.*)$/)){lst.push([m[1]+'.',m[2]]);return}fL();
    if(!s)return;
    if(m=s.match(/^###\s+(.*)$/))h+=`<p style="font-weight:700;margin:6px 0 2px 18px">${esc(m[1])}</p>`;
    else if(m=s.match(/^##\s+(.*)$/))h+=`<p style="font-weight:700;margin:10px 0 4px">${esc(m[1])}</p>`;
    else if(m=s.match(/^#\s+(.*)$/))h+=`<p class="ttl">${esc(m[1])}</p>`;
    else h+=`<p style="text-align:justify;margin:0 0 6px 18px">${esc(s)}</p>`});
  fT();fL();return h}
function skTtd(d,dgnTempat){const ks=kepsekGuru()||{};const nm=d.ttdNama||S.cfg.kepsek||ks.nama||'';const nip=d.ttdNip||S.cfg.nipKepsek||ks.nip||'';
  return `<div class="ttd" style="page-break-inside:avoid"><div style="min-width:300px">${dgnTempat?`<table class="nb skt" style="width:auto;margin:0"><tr><td style="padding:0">Ditetapkan di</td><td style="padding:0 4px">:</td><td style="padding:0">${esc(d.tempat||'')}</td></tr><tr><td style="padding:0">Pada tanggal</td><td style="padding:0 4px">:</td><td style="padding:0">${esc(skTglD(d))}</td></tr></table><div style="border-top:1px solid #000;margin:2px 0 4px"></div>`:''}${skBr(d.ttdJab)}${ttdBlok(TTDON())}${esc(nm)}<br>NIP. ${esc(nip)}</div></div>`}
function skLampHead(d,no){return `<table class="nb skt" style="width:auto;margin:0 0 10px">${[['Lampiran '+no,d.lampKet],['Nomor',skNo(d)||'……'],['Tanggal',skTglD(d)]].map(([a,b])=>`<tr><td style="padding:0 4px 0 0;min-width:86px">${esc(a)}</td><td style="padding:0 4px">:</td><td style="padding:0">${esc(b)}</td></tr>`).join('')}</table>`}
const skJudulL=t=>String(t||'').split('\n').filter(x=>x.trim()).map(x=>`<p class="ttl">${esc(x)}</p>`).join('');
function skDiktum(d){const out=[];lines(d.diktum).forEach(x=>{if(x.startsWith('>')&&out.length)out[out.length-1].push(x.slice(1).trim());else out.push([x])});return out}
function skNomorLamp(d){const n={};let i=0;if((d.anggota||[]).length)n.susunan=SK_ROM[i++];if((d.tugas||[]).length)n.tugas=SK_ROM[i++];n.lain=(d.lampLain||[]).map(()=>SK_ROM[i++]);return n}
function gSKTim(d0){const d=skV(d0);const N=skNomorLamp(d);const pages=[];
  const blok=(lbl,inner)=>`<tr><td style="width:104px">${lbl}</td><td style="width:10px">:</td><td>${inner}</td></tr>`;
  const mn=lines(d.menimbang),mg=lines(d.mengingat),mp=lines(d.memperhatikan),tb=lines(d.tembusan);
  const dk=skDiktum(d).map((ps,i)=>blok(SK_ORD[i]||String(i+1),ps.map((p,j)=>{const m=j>0&&p.match(/^(.+?)\s+:\s+(.+)$/);return m?`<table class="nb skt" style="width:auto;margin:0 0 0 0"><tr><td style="padding:0 6px 0 0;min-width:170px">${esc(m[1])}</td><td style="padding:0 4px">:</td><td style="padding:0">${esc(m[2])}</td></tr></table>`:`<div style="text-align:justify;margin:${j?'3px':'0'} 0 0">${esc(p)}</div>`}).join(''))).join('');
  pages.push(`${kopHtml()}<p class="ttl">KEPUTUSAN ${esc(d.penetap)}</p><p class="c" style="margin:0">NOMOR: ${esc(skNo(d)||'……')}</p>
   <p class="ttl" style="margin-top:10px">TENTANG</p><p class="ttl" style="margin:2px 30px 0">${esc(d.judul)}</p>
   <p class="ttl" style="margin:12px 0 8px">${esc(d.pembuka)}</p>
   <table class="nb skt">${mn.length?blok('Menimbang',skList(mn,i=>String.fromCharCode(97+i)+'.')):''}${mg.length?blok('Mengingat',skList(mg,i=>(i+1)+'.')):''}${mp.length?blok('Memperhatikan',skList(mp,i=>(i+1)+'.')):''}</table>
   <p class="ttl" style="margin:10px 0 8px">MEMUTUSKAN</p>
   <table class="nb skt">${blok('Menetapkan',`<div style="text-align:justify">KEPUTUSAN ${esc(d.penetap)} TENTANG ${esc(d.judul)}.</div>`)}${dk}</table>
   ${skTtd(d,true)}${tb.length?`<div style="margin-top:12px;font-size:11.5px;page-break-inside:avoid">Tembusan:${skList(tb,i=>(i+1)+'.')}</div>`:''}`);
  if(N.susunan){const showD=!!String(d.kolDinas||'').trim(),showG=d.kolGol==null||!!String(d.kolGol).trim();let no=0,last=null;const cols=3+(showD?1:0)+(showG?1:0);
    const rows=(d.anggota||[]).map(a=>{const o=skOrang(a);let gr='';if(o.grup&&o.grup!==last){gr=`<tr><td colspan="${cols}" style="font-weight:700;background:#f3f3f3">${esc(o.grup)}</td></tr>`;no=0}last=o.grup||last;no++;
      return gr+`<tr style="page-break-inside:avoid"><td class="c">${no}</td><td>${esc(o.nama)}${o.nip?`<br>NIP. ${esc(o.nip)}`:''}</td>${showG?`<td class="c">${esc(o.gol)}</td>`:''}${showD?`<td>${esc(o.dinas)}</td>`:''}<td>${esc(o.peran)}</td></tr>`}).join('');
    pages.push(skLampHead(d,N.susunan)+skJudulL(d.judulLamp1||('SUSUNAN '+d.judul.replace(/^PEMBENTUKAN\s+/i,'')))+`<div style="height:8px"></div>
     <table class="sks"><thead><tr><th style="width:34px">No</th><th>Nama / NIP</th>${showG?`<th style="width:96px">${esc(d.kolGol||'Pangkat/Gol')}</th>`:''}${showD?`<th style="width:150px">${esc(d.kolDinas)}</th>`:''}<th style="width:${showD?170:230}px">${esc(d.kolPeran||'Jabatan dalam Tim')}</th></tr></thead><tbody>${rows}</tbody></table>`+(String(d.catatanLamp1||'').trim()?`<div style="margin-top:6px">${skMarkup(d.catatanLamp1).replace(/margin:0 0 6px 18px/g,'margin:0 0 4px 0')}</div>`:'')+skTtd(d,false))}
  if(N.tugas)pages.push(skLampHead(d,N.tugas)+skJudulL(d.judulLamp2||('URAIAN TUGAS '+d.judul.replace(/^PEMBENTUKAN\s+/i,'')))+`<div style="height:8px"></div>
     <table class="sks"><thead><tr><th style="width:34px">No</th><th style="width:170px">${esc(d.kolPeran||'Jabatan dalam Tim')}</th><th>Uraian Tugas</th></tr></thead><tbody>${(d.tugas||[]).map((t,i)=>`<tr style="page-break-inside:avoid"><td class="c">${i+1}</td><td>${esc(t.jab)}</td><td style="text-align:justify">${skBr(t.uraian)}</td></tr>`).join('')}</tbody></table>`+skTtd(d,false));
  (d.lampLain||[]).forEach((L,i)=>pages.push(skLampHead(d,N.lain[i])+skJudulL(L.judul)+`<div style="height:6px"></div>`+skMarkup(L.isi)+skTtd(d,false)));
  return pages}

/* ---------- catat ke Tugas Tambahan (POKJA / Kepanitiaan) ---------- */
function skSinkronTT(){const d=skCur();if(!d)return;const K=d.kategori||'POKJA';const nm=String(d.nama||'').trim();if(!nm){toast('Isi dulu nama singkat tim');return}
  const A0=(d.anggota||[]).filter(a=>a.gid&&get('guru',a.gid));const A=[];A0.forEach(a=>{const x=A.find(y=>y.gid===a.gid);if(x){if(a.peran&&!String(x.peran||'').includes(a.peran))x.peran=(x.peran?x.peran+'; ':'')+a.peran}else A.push({gid:a.gid,peran:a.peran||''})});const ada=ttAll().filter(t=>t.kategori===K&&t.jenis===nm);
  confirmBox(`Catat ${A.length} anggota <b>${esc(nm)}</b> ke menu Tugas Tambahan (kategori ${esc(K)})? Peran mengikuti SK ini${ada.length?`; ${ada.length} catatan lama dengan nama yang sama akan diperbarui`:''}. Bisa dibatalkan dengan ↶ Urungkan.`,async()=>{
    if(!panList(K).includes(nm))panSimpanList([...panList(K),nm],K);
    const ids=new Set(A.map(a=>a.gid));for(const a of A){const ex=ada.find(t=>t.guruId===a.gid);const peran=a.peran||'Anggota';
      if(ex){if(ex.peran!==peran)await put('tt',Object.assign({},ex,{peran}),{silent:true})}else await put('tt',{guruId:a.gid,kategori:K,jenis:nm,peran,jam:'',ket:'SK '+(skNo(d)||'')},{silent:true})}
    for(const t of ada)if(!ids.has(t.guruId))await del('tt',t.id);
    skSimpan(Object.assign({},d,{sinkron:Date.now()}),true);toast('Anggota tercatat di Tugas Tambahan')},'Catat')}
function skSuratTugas(){const d=skCur();if(!d)return;const A=(d.anggota||[]).filter(a=>a.gid&&orang(a.gid)&&!/penanggung jawab|pembina|pengarah/i.test(a.peran||''));
  suBaru({kegiatan:d.nama||'',orang:A.map(a=>a.gid),peran:Object.fromEntries(A.map(a=>[a.gid,a.peran||''])),mode:'kolektif',
    dasar:`Keputusan ${skV(d).lampKet.replace(/^Keputusan\s+/,'')} Nomor ${skNo(d)||'……'} tanggal ${skTglD(d)} tentang ${skJudulKalimat(d.judul)}`,
    untuk:`Melaksanakan tugas sebagai anggota ${d.nama||'tim'} sesuai dengan peran masing-masing.`,tglSurat:d.tgl||undefined});location.hash='#surat'}

    render();toast(`${pil.length-upd} SK dimasukkan${upd?`, ${upd} diperbarui`:''}${tdk?` · ${tdk} nama tidak ketemu di DUK, diisi manual`:''}`)}}

 lampLain:[{judul:'URAIAN TUGAS POKOK DAN FUNGSI TIM PENGELOLA DAN GURU PIKET\nLAYANAN PERPUSTAKAAN',isi:[
  '## A. PENANGGUNG JAWAB','1. Menetapkan kebijakan dan mengesahkan program kerja perpustakaan.','2. Membina, memantau, dan mengevaluasi kinerja tim.','3. Memfasilitasi kebutuhan koleksi dan sarana sesuai kemampuan sekolah.','4. Menetapkan tindak lanjut berdasarkan laporan evaluasi.',
  'Dokumen/hasil kerja: Program yang disahkan, hasil monitoring, keputusan tindak lanjut.',
  '## B. KETUA TIM PENGELOLA','1. Menyusun program kerja tahunan bersama anggota.','2. Mengatur pembagian tugas dan jadwal piket guru.','3. Mengoordinasikan pengolahan koleksi, layanan, buku paket, dan kegiatan literasi.','4. Mengawasi penerapan tata tertib dan SOP.','5. Memantau kondisi ruang, fasilitas, dan koleksi.','6. Melaksanakan koordinasi dan evaluasi berkala.','7. Menyusun laporan semester dan tahunan kepada kepala sekolah.',
  'Dokumen/hasil kerja: Program kerja, jadwal piket, instrumen monitoring, laporan semester/tahunan.',
  '## C. BIDANG ADMINISTRASI DAN PELAPORAN','1. Mengarsipkan SK, SOP, program kerja, jadwal, dan dokumen perpustakaan.','2. Memperbarui data anggota perpustakaan.','3. Mengumpulkan data kunjungan, transaksi, dan jurnal piket.','4. Membuat rekapitulasi statistik bulanan.','5. Menyiapkan notula rapat dan dokumentasi kegiatan.','6. Membantu penyusunan laporan berkala.',
  'Dokumen/hasil kerja: Daftar anggota, arsip, rekap bulanan, notula, laporan.',
  '## D. BIDANG PENGOLAHAN DAN INVENTARIS KOLEKSI','1. Memeriksa dan memperbarui buku induk koleksi secara bertahap.','2. Melaksanakan klasifikasi, penentuan nomor panggil, katalogisasi, dan pelabelan.','3. Memberi stempel dan melengkapi identitas koleksi.','4. Menata buku pada rak sesuai kategori dan nomor panggil.','5. Mencatat penerimaan dan kondisi koleksi baru maupun lama.','6. Mendata buku rusak, hilang, dan memerlukan perbaikan.','7. Mengelola data buku paket yang berada dalam tanggung jawab perpustakaan.','8. Mengusulkan tindak lanjut koleksi sesuai ketentuan aset sekolah.',
  'Dokumen/hasil kerja: Buku induk, katalog, daftar penerimaan, daftar buku rusak/hilang, rekap inventaris.',
  '## E. BIDANG PELAYANAN DAN SIRKULASI','1. Menyiapkan dan menerapkan SOP kunjungan, peminjaman, dan pengembalian.','2. Mengoordinasikan guru piket dan kesiapan administrasi layanan.','3. Memastikan semua transaksi dicatat secara konsisten.','4. Memantau keterlambatan dan permasalahan pengembalian.','5. Memeriksa jurnal piket dan merekap layanan.','6. Mengoordinasikan distribusi/pengembalian buku paket apabila dikelola perpustakaan.','7. Melaporkan kendala layanan kepada ketua tim.',
  'Dokumen/hasil kerja: Buku kunjungan, register transaksi, daftar keterlambatan, jurnal piket, rekap layanan.',
  '## F. BIDANG LITERASI DAN PEMANFAATAN','1. Menyusun kegiatan literasi berbasis perpustakaan.','2. Mengatur kunjungan kelas dan koordinasi dengan guru mata pelajaran.','3. Mempromosikan koleksi melalui rekomendasi buku dan kegiatan membaca.','4. Mengumpulkan usulan kebutuhan koleksi dari guru dan siswa.','5. Mendokumentasikan dan mengevaluasi pelaksanaan kegiatan.',
  'Dokumen/hasil kerja: Jadwal literasi, jurnal kegiatan, usulan buku, dokumentasi, laporan evaluasi.',
  '## G. GURU PIKET LAYANAN PERPUSTAKAAN','1. Melaksanakan piket sesuai jadwal dan memeriksa kesiapan ruang.','2. Mengarahkan pengunjung mengisi daftar kunjungan.','3. Melayani dan mencatat peminjaman serta pengembalian buku.','4. Membantu pencarian koleksi dan menjaga ketertiban layanan.','5. Memeriksa kondisi buku yang dikembalikan dan mencatat temuan.','6. Menjaga kerapian koleksi dan fasilitas selama piket.','7. Mengisi jurnal harian berisi pengunjung, transaksi, kejadian, dan tindak lanjut.','8. Melaporkan kendala serta menyerahkan informasi yang belum selesai kepada petugas berikutnya.',
  'Dokumen/hasil kerja: Daftar kunjungan, register transaksi, jurnal piket, catatan kejadian.',
  '## H. KOORDINASI DAN PELAPORAN','1. Ketua tim bertanggung jawab kepada kepala sekolah.','2. Setiap anggota bertanggung jawab atas bidang tugas masing-masing.','3. Guru piket berkoordinasi dengan bidang pelayanan dan sirkulasi.','4. Rekap operasional dibuat bulanan dan evaluasi formal minimal setiap semester.','5. Penugasan tidak mengurangi kewajiban utama guru dalam pembelajaran.','6. Penanganan barang milik daerah mengikuti prosedur pengelolaan aset yang berlaku.',
  'Dokumen/hasil kerja: Laporan dan dokumentasi sesuai bidang.'].join('\n')}]},

 lampLain:[{judul:'URAIAN TUGAS DAN TANGGUNG JAWAB\nTIM SISTEM PENJAMINAN MUTU INTERNAL (SPMI)\nSMP NEGERI 5 TANGERANG TAHUN PELAJARAN 2026/2027',isi:[
  '## A. KETENTUAN UMUM',
  'Tim SPMI mengoordinasikan siklus penjaminan dan peningkatan mutu sekolah yang meliputi pemetaan kondisi, analisis akar masalah, penyusunan rekomendasi perencanaan pengembangan, pendampingan pelaksanaan, pemantauan, evaluasi, serta tindak lanjut. Program dijalankan oleh unit atau penanggung jawab kegiatan sesuai kewenangannya. Tim SPMI tidak mengambil alih fungsi pengelolaan anggaran, pengadaan barang/jasa, maupun keputusan Kepala Sekolah.',
  '## B. URAIAN TUGAS PER JABATAN',
  '### 1. Penanggung Jawab','a. Memberikan arahan kebijakan dan menetapkan prioritas peningkatan serta pengembangan sekolah berdasarkan data.','b. Memfasilitasi koordinasi antarbidang dan dukungan sumber daya sesuai kewenangan.','c. Menelaah, menetapkan tindak lanjut, dan mengevaluasi rekomendasi serta laporan SPMI.','Hasil kerja: Arahan prioritas mutu, keputusan tindak lanjut, dan pengesahan laporan.',
  '### 2. Ketua','a. Memimpin penyusunan program kerja terpadu SPMI dan pembagian tugas antar bidang.','b. Mengoordinasikan pemetaan mutu, perumusan prioritas pengembangan, pendampingan pelaksanaan, dan evaluasi.','c. Memastikan rekomendasi setiap bidang terintegrasi serta disampaikan kepada Kepala Sekolah untuk ditindaklanjuti.','Hasil kerja: Program kerja terpadu, matriks koordinasi, dan laporan capaian peningkatan mutu.',
  '### 3. Sekretaris','a. Mengelola agenda, undangan, notula, daftar hadir, dan arsip administrasi kegiatan.','b. Mengompilasi peta masalah, rekomendasi program, matriks tindak lanjut, dan bukti pelaksanaan dari seluruh bidang.','c. Menyiapkan rekapitulasi laporan semester dan akhir tahun.','Hasil kerja: Dokumentasi kegiatan, rekapitulasi program, matriks tindak lanjut, dan laporan tim.',
  '### 4. Koordinator Pemetaan Mutu dan Data','a. Menghimpun dan memvalidasi Rapor Pendidikan serta data internal sekolah yang relevan.','b. Mengidentifikasi kesenjangan capaian dan menganalisis akar masalah bersama koordinator terkait.','c. Menyediakan dasar data untuk penetapan prioritas pengembangan serta memelihara keamanan dan kerahasiaan data.','Hasil kerja: Peta mutu, analisis akar masalah, dan daftar prioritas berbasis data.',
  '### 5. Koordinator Kurikulum dan Pembelajaran','a. Mengkaji kebutuhan pengembangan kurikulum dan peningkatan kualitas pembelajaran.','b. Merumuskan rekomendasi program perbaikan pembelajaran, pendampingan, dan penguatan praktik baik.','c. Memantau pelaksanaan rekomendasi bersama penanggung jawab kegiatan pembelajaran.','Hasil kerja: Analisis kebutuhan dan usulan pengembangan kurikulum serta pembelajaran.',
  '### 6. Koordinator Asesmen dan Evaluasi Pembelajaran','a. Mengkaji kualitas asesmen dan penggunaan hasilnya untuk memperbaiki pembelajaran.','b. Menyusun rekomendasi penguatan literasi, numerasi, dan capaian belajar berdasarkan data.','c. Menganalisis perubahan hasil belajar sebagai bahan evaluasi program pengembangan akademik.','Hasil kerja: Telaah asesmen, rekomendasi pengembangan akademik, dan analisis kemajuan belajar.',
  '### 7. Koordinator Pendidik dan Tenaga Kependidikan','a. Memetakan kebutuhan kompetensi guru dan tenaga kependidikan.','b. Mengusulkan pengembangan profesional melalui komunitas belajar, pelatihan, pendampingan, atau berbagi praktik baik.','c. Menghimpun bukti pelaksanaan dan menelaah manfaat kegiatan bagi mutu layanan sekolah.','Hasil kerja: Peta kebutuhan kompetensi, usulan program pengembangan, dan telaah hasil kegiatan.',
  '### 8. Koordinator Kesiswaan dan Iklim Sekolah','a. Menganalisis kebutuhan penguatan karakter, keamanan, kebinekaan, inklusivitas, dan layanan peserta didik.','b. Mengusulkan program pengembangan iklim sekolah dan layanan kesiswaan berdasarkan temuan serta masukan warga sekolah.','c. Memantau tindak lanjut program dengan menjaga perlindungan dan kerahasiaan data peserta didik.','Hasil kerja: Peta kebutuhan kesiswaan dan iklim sekolah serta rekomendasi program pengembangan.',
  '### 9. Koordinator Sarana, Prasarana, dan Lingkungan','a. Mengidentifikasi kondisi dan kebutuhan sarana, prasarana, aksesibilitas, keselamatan, serta lingkungan belajar.','b. Menyusun rekomendasi prioritas pemeliharaan dan pengembangan fasilitas sesuai kebutuhan pembelajaran.','c. Memantau perkembangan tindak lanjut perbaikan bersama unit terkait tanpa mengambil alih proses pengadaan.','Hasil kerja: Peta kebutuhan fasilitas, skala prioritas, dan laporan tindak lanjut sarana prasarana.',
  '### 10. Koordinator Perencanaan Program dan Anggaran','a. Mengonsolidasikan rekomendasi prioritas dari seluruh bidang menjadi usulan pengembangan sekolah.','b. Menyusun matriks usulan program yang memuat tujuan, indikator keberhasilan, penanggung jawab, waktu, dan estimasi kebutuhan sumber daya.','c. Menyampaikan usulan sebagai bahan penyusunan atau penyesuaian RKT dan RKAS melalui mekanisme serta pejabat yang berwenang.','Hasil kerja: Matriks rencana pengembangan dan peningkatan mutu serta usulan prioritas untuk RKT/RKAS.',
  '### 11. Koordinator Pemantauan, Evaluasi, dan Tindak Lanjut','a. Menyusun indikator, instrumen, jadwal, dan mekanisme pemantauan program peningkatan mutu.','b. Menghimpun bukti keterlaksanaan dan capaian program, termasuk hambatan dan risiko yang ditemukan.','c. Mengoordinasikan evaluasi lintas bidang dan merumuskan rekomendasi korektif untuk siklus berikutnya.','Hasil kerja: Instrumen pemantauan, laporan evaluasi program, dan matriks tindak lanjut.',
  '## C. MEKANISME KERJA TERPADU',
  '1. Awal siklus: memetakan mutu berdasarkan Rapor Pendidikan dan data sekolah, menentukan masalah prioritas, serta menyusun analisis akar masalah.','2. Perencanaan: merumuskan target, indikator keberhasilan, program pengembangan, dan kebutuhan sumber daya sebagai bahan perencanaan sekolah.','3. Pelaksanaan: memfasilitasi koordinasi dan pendampingan tindak lanjut; pelaksanaan teknis tetap menjadi tanggung jawab unit atau pelaksana program terkait.','4. Pemantauan: melakukan peninjauan berkala terhadap pelaksanaan program, bukti kegiatan, capaian indikator, dan hambatan.','5. Evaluasi dan tindak lanjut: menyusun rekomendasi perbaikan, melaporkan hasil sekurang-kurangnya setiap semester, dan menggunakan temuan untuk siklus berikutnya.',
  '## D. BATAS KEWENANGAN DAN KOORDINASI',
  '1. Fungsi perencanaan dan pengembangan sekolah diintegrasikan dalam siklus kerja SPMI; tidak dibentuk TPS sebagai tim tersendiri melalui lampiran ini.','2. Tim SPMI menyampaikan rekomendasi kepada Kepala Sekolah dan berkoordinasi dengan wakil kepala sekolah, guru, tenaga kependidikan, komite sekolah, Tim BOS, serta pelaksana pengadaan barang/jasa sesuai kebutuhan dan kewenangannya.','3. Penyusunan dan pengesahan RKT/RKAS, pelaksanaan anggaran, serta pengadaan barang/jasa tetap mengikuti prosedur dan penanggung jawab yang berwenang.','4. Pemantauan dan evaluasi dilakukan secara berbasis bukti dan melibatkan penelaahan lintas bidang agar hasil evaluasi tidak hanya bergantung pada pelaksana program.',
  '## E. DOKUMEN HASIL KERJA',
  'Dokumen minimal meliputi program kerja SPMI, analisis Rapor Pendidikan dan data sekolah, peta masalah prioritas, matriks usulan program pengembangan dan indikator keberhasilan, notula koordinasi, instrumen pemantauan, laporan evaluasi semester, dan matriks tindak lanjut.'].join('\n')}]},

const ABK_MIN=24,ABK_MAX=40;

const abkAturan=()=>S.cfg.abkAturan||ABK_DEF;
function abkAturanOf(t){const K=String(t.kategori||''),J=String(t.jenis||'').toLowerCase(),P=String(t.peran||'').toLowerCase();
  for(const a of abkAturan()){if(a[0]&&a[0]!==K)continue;if(a[1]&&!J.includes(String(a[1]).toLowerCase()))continue;if(!a[0]&&!a[1])continue;
    let jp=+a[2]||0;if(String(a[1]).toLowerCase()==='tppk'&&/koordinator|ketua/.test(P))jp=2;return {jp,dasar:a[3],ada:true}}
  return {jp:0,dasar:'Tidak tercantum sebagai ekuivalensi JP — tidak dihitung',ada:false}}
function abkRombelBK(t){const s=String(t.peran||'');let n=0;(s.match(/[789]\s*[A-J]+/gi)||[]).forEach(x=>n+=x.replace(/[^A-J]/gi,'').length);return n}
const abkKor=()=>Object.assign({st:{},add:[],kemenag:[],cat:{},cuti:{}},S.cfg.abkKor||{});
const abkAsal=t=>{const m=String(t.id||'').match(/_(g\d+)$/);return m&&m[1]!==t.guruId?m[1]:null};
function abkCuti(gid){const K=abkKor();const c=K.cuti[gid]||{};openModal(`<h2>Guru cuti</h2><p class="small muted">${esc(gNama(gid))} · jam mengajarnya yang dialihkan ke guru lain ditandai sebagai <b>pengganti sementara</b>.</p><div class="form"><label>Jenis cuti<input id="cuJ" value="${esc(c.jenis||'Cuti melahirkan')}"></label><label>Mulai<input id="cuA" type="date" value="${esc(c.mulai||'')}"></label><label>Sampai<input id="cuB" type="date" value="${esc(c.sampai||'')}"></label></div>
  <div class="mfoot">${K.cuti[gid]?'<button class="btn d" style="margin-right:auto" id="cuX">Sudah aktif kembali</button>':''}<button class="btn" onclick="closeModal()">Batal</button><button class="btn p" id="cuGo">Simpan</button></div>`);
  $('#cuGo').onclick=()=>{const v={jenis:$('#cuJ').value.trim()||'Cuti',mulai:$('#cuA').value,sampai:$('#cuB').value};closeModal();abkKorSet(K=>{K.cuti[gid]=v});toast('Ditandai cuti. Bisa dibatalkan dengan ↶ Urungkan.')};
  if($('#cuX'))$('#cuX').onclick=()=>{closeModal();abkKorSet(K=>{delete K.cuti[gid]});toast('Status cuti dihapus')}}
const abkTglP=d=>{if(!d)return '';const x=new Date(d+'T00:00');return isNaN(x)?d:x.getDate()+' '+BULAN_P[x.getMonth()]+' '+x.getFullYear()};
function abkKorSet(f){const K=clone(abkKor());f(K);S.cfg.abkKor=K;saveCfg();render()}
const ABK_MODE={both:'SK & nyata',sk:'di SK saja',riil:'nyata saja'};
function abkModeGeser(id){abkKorSet(K=>{const o=['both','sk','riil'];const c=K.st[id]||'both';const n=o[(o.indexOf(c)+1)%3];if(n==='both')delete K.st[id];else K.st[id]=n});toast('Status tugas diubah. Bisa dibatalkan dengan ↶ Urungkan.')}
function abkAddModeGeser(id){abkKorSet(K=>{const x=K.add.find(a=>a.id===id);if(x)x.mode=x.mode==='sk'?'riil':'sk'})}
function abkKemenag(gid,on){abkKorSet(K=>{K.kemenag=K.kemenag.filter(x=>x!==gid);if(on)K.kemenag.push(gid)});toast(on?'Dihitung dengan aturan Kemenag (GPAI)':'Dihitung dengan aturan Kemendikdasmen')}
function abkCatatan(gid){const K=abkKor();openModal(`<h2>Catatan ABK</h2><p class="small muted">${esc(gNama(gid))}</p><textarea id="abkC" rows="4" style="width:100%">${esc(K.cat[gid]||'')}</textarea><div class="mfoot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn p" id="abkCG">Simpan</button></div>`);$('#abkCG').onclick=()=>{const v=$('#abkC').value.trim();closeModal();abkKorSet(K=>{if(v)K.cat[gid]=v;else delete K.cat[gid]})}}
function abkTambah(gid){const R=REF();openModal(`<h2>Tambah tugas (koreksi ABK)</h2><p class="small muted">${esc(gNama(gid))} · tidak mengubah SK/Tugas Tambahan, hanya dipakai di analisis ini.</p><div class="form">
  <label>Kategori<select id="akK">${R.kategori.map(k=>`<option>${esc(k.nama)}</option>`).join('')}</select></label><label>Nama tugas<input id="akJ" placeholder="mis. Waka Sarana Prasarana"></label>
  <label>JP di SK<input id="akH" type="number" placeholder="kosong = sesuai aturan"></label><label>Kondisi<select id="akM"><option value="sk">Tercantum di SK, tidak dijalankan</option><option value="riil">Dijalankan, tidak tercantum di SK</option></select></label>
  <label class="full">Keterangan<input id="akE"></label></div><div class="mfoot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn p" id="akGo">Simpan</button></div>`);
  $('#akGo').onclick=()=>{const o={id:'a'+Date.now().toString(36),guruId:gid,kategori:$('#akK').value,jenis:$('#akJ').value.trim()||$('#akK').value,jam:$('#akH').value===''?'':Number($('#akH').value),mode:$('#akM').value,ket:$('#akE').value.trim()};closeModal();abkKorSet(K=>K.add.push(o));toast('Ditambahkan')}}
function abkHapusAdd(id){abkKorSet(K=>{K.add=K.add.filter(a=>a.id!==id)});toast('Dihapus. Bisa dibatalkan dengan ↶ Urungkan.')}
const ABK_STRUK=t=>['Wakil Kepala Sekolah','Kepala / Pengelola'].includes(t.kategori)&&!/staf/i.test(t.jenis||'');
function abkGuru(g){const K=abkKor();const tg=all('tugas').filter(t=>t.guruId===g.id);const jpM=tg.reduce((s,t)=>s+tugasJP(t),0);
  const cuti=K.cuti[g.id]||null;const ganti=tg.filter(t=>{const a=abkAsal(t);return a&&K.cuti[a]});const jpGanti=ganti.reduce((s,t)=>s+tugasJP(t),0);
  const dialih=cuti?all('tugas').filter(t=>abkAsal(t)===g.id):[];
  const T=all('tt').filter(t=>t.guruId===g.id).map(t=>Object.assign({},t,{_mode:K.st[t.id]||'both'}));
  if(!T.some(t=>t.kategori==='Wali Kelas'))all('kelas').filter(k=>k.waliId===g.id).forEach(k=>T.push({kategori:'Wali Kelas',jenis:'Wali Kelas '+k.nama,jam:ekuiv('Wali Kelas')||2,_mode:'both'}));
  K.add.filter(a=>a.guruId===g.id).forEach(a=>T.push(Object.assign({},a,{_mode:a.mode,_add:a.id})));
  const it=T.map(t=>{const A=abkAturanOf(t);const at=A.jp;return {t,id:t.id,add:t._add,mode:t._mode,nama:t.jenis||t.kategori,sk:num(t.jam)??at,at,dasar:A.dasar,ada:A.ada,struk:ABK_STRUK(t)}}).filter(x=>x.sk||x.at);
  const inSK=it.filter(x=>x.mode!=='riil'),inR=it.filter(x=>x.mode!=='sk');
  const kmg=K.kemenag.includes(g.id);const ks=isKepsek(g);const plt=ks&&T.some(t=>t.kategori==='Wakil Kepala Sekolah'&&(K.st[t.id]||'both')!=='sk');
  const hitung=L=>{if(!kmg)return {ek:L.reduce((s,x)=>s+x.at,0),info:''};
    const st=L.filter(x=>x.struk);if(st.length)return {ek:Math.max(0,ABK_MIN-jpM),wajib12:true,info:'GPAI dengan tugas '+st.map(x=>x.nama).join(', ')+': wajib mengajar ≥12 JTM'};
    const gw=L.filter(x=>x.t.kategori==='Guru Wali').reduce((s,x)=>s+2,0);const lain=L.filter(x=>x.t.kategori!=='Guru Wali').reduce((s,x)=>s+x.at,0);return {ek:gw+Math.min(6,lain),info:lain>6?'GPAI: tugas tambahan lain diakui paling banyak 6 JTM':''}};
  const HR=hitung(inR),HS=hitung(inSK);const tot=jpM+HR.ek,totSK=jpM+HS.ek;const cat=[];
  if(K.cat[g.id])cat.push(K.cat[g.id]);
  it.filter(x=>x.mode==='sk').forEach(x=>cat.push(`${x.nama}: tercantum di SK, tidak dijalankan${x.t.ket?' ('+x.t.ket+')':''}`));
  it.filter(x=>x.mode==='riil').forEach(x=>cat.push(`${x.nama}: dijalankan, tidak tercantum di SK${x.t.ket?' ('+x.t.ket+')':''}`));
  inR.filter(x=>x.sk!==x.at&&!kmg).forEach(x=>cat.push(`${x.nama}: di SK ${x.sk} JP, menurut aturan ${x.at} JP`));
  if(HR.info)cat.push(HR.info);if(plt)cat.push('Plt. kepala sekolah merangkap wakil kepala sekolah');
  if(kmg&&ks)cat.push('Aturan Kemenag: jabatan Plt. tidak termasuk kepala sekolah yang dianggap memenuhi beban kerja');
  const bk=T.find(t=>t.kategori==='Layanan BK');if(bk){const r=abkRombelBK(bk);if(r&&r<5)cat.push(`Guru BK membimbing ${r} rombel (minimal 5 rombel)`)}
  if(ganti.length){const by={};ganti.forEach(t=>{const a=abkAsal(t);(by[a]=by[a]||[]).push(t)});Object.entries(by).forEach(([a,ts])=>cat.push(`Termasuk ${ts.reduce((s,t)=>s+tugasJP(t),0)} JP pengganti sementara ${gNama(a)} (${K.cuti[a].jenis||'cuti'}): ${ts.map(t=>mKode(t.mapelId)+' '+kNama(t.kelasId)).join(', ')}`))}
  if(cuti){const by={};dialih.forEach(t=>{(by[t.guruId]=by[t.guruId]||[]).push(t)});cat.unshift(`${cuti.jenis||'Cuti'}${cuti.mulai?' '+abkTglP(cuti.mulai):''}${cuti.sampai?' s.d. '+abkTglP(cuti.sampai):''}. Jam mengajar asal ${dialih.reduce((s,t)=>s+tugasJP(t),0)} JP dialihkan sementara ke: ${Object.entries(by).map(([gid,ts])=>`${gNama(gid)} (${ts.map(t=>mKode(t.mapelId)+' '+kNama(t.kelasId)).join(', ')})`).join('; ')||'-'}`)}
  const status=(tot,H)=>{if(cuti)return [cuti.jenis||'Cuti','cuti'];if(ks&&!kmg)return ['Kepala sekolah (37,5 jam/minggu)','ok'];if(H.wajib12)return jpM>=12?['Memenuhi (mengajar '+jpM+' JTM)','ok']:['Kurang '+(12-jpM)+' JTM mengajar','bad'];if(tot<ABK_MIN)return ['Kurang '+(ABK_MIN-tot)+' JP','bad'];if(tot>ABK_MAX)return ['Melebihi '+(tot-ABK_MAX)+' JP','warn'];return ['Memenuhi','ok']};
  const [st,kode]=status(tot,HR),[stSK,kodeSK]=status(totSK,HS);
  if(kmg){const per=tg.filter(t=>tugasJP(t)>3);if(per.length)cat.push('GPAI: maksimal 3 JTM per rombel (SMP)')}
  if(!cuti&&jpGanti&&kode==='ok'&&!ks&&tot-jpGanti<ABK_MIN)cat.push(`Tanpa jam pengganti hanya ${tot-jpGanti} JP — kurang ${ABK_MIN-(tot-jpGanti)} JP setelah guru yang cuti kembali`);
  return {g,cuti,jpGanti,jpAsal:dialih.reduce((s,t)=>s+tugasJP(t),0),jpM,it,inSK,inR,sk:HS.ek,at:HR.ek,tot,totSK,st,kode,stSK,kodeSK,cat,ks,kmg,bk:!!bk,mapel:mapelGuruTeksABK(g,tg)}}
function mapelGuruTeksABK(g,tg){const m=[...new Set(tg.map(t=>t.mapelId))].map(id=>get('mapel',id)?.nama).filter(Boolean);if(m.length)return m.join(', ');return all('tt').some(t=>t.guruId===g.id&&t.kategori==='Layanan BK')?'Bimbingan dan Konseling':(get('mapel',g.mapelUtama)?.nama||'')}
function abkData(){const R=dukUrut(guruList()).map(abkGuru);
  const surplus=R.filter(r=>!r.ks&&r.tot>ABK_MIN);
  R.forEach(r=>{if(r.kode!=='bad')return;const mp=new Set(all('tugas').filter(t=>t.guruId===r.g.id).map(t=>t.mapelId));if(r.g.mapelUtama)mp.add(r.g.mapelUtama);
    const kand=surplus.filter(s=>all('tugas').some(t=>t.guruId===s.g.id&&mp.has(t.mapelId))).sort((a,b)=>b.tot-a.tot).slice(0,3);
    r.saran=kand.length?`Alihkan ${ABK_MIN-r.tot} JP dari guru serumpun yang di atas 24 JP: ${kand.map(s=>`${s.g.nama} (${s.tot} JP)`).join(', ')}; atau beri tugas tambahan yang diakui (wali kelas/guru wali/pembina ekstrakurikuler).`:(r.kmg?'GPAI: tambah jam PAI di sekolah lain yang berizin atau TBQ (maks. 6 JTM).':'Tambah tugas tambahan yang diakui (wali kelas/guru wali/pembina ekskul/koord. kokurikuler) atau mengajar di sekolah lain.')});
  R.forEach(r=>{if(r.kode==='warn')r.saran=`Kurangi ${r.tot-ABK_MAX} JP: alihkan jam mengajar atau tugas tambahan ke guru serumpun yang masih di bawah/tepat 24 JP.`});
  const u=UI.abkS||'duk';const nm=(a,b)=>String(a.g.nama).replace(/^(dra?s?\.|h\.|hj\.|ir\.)\s*/gi,'').localeCompare(String(b.g.nama).replace(/^(dra?s?\.|h\.|hj\.|ir\.)\s*/gi,''),'id');
  if(u==='nama')R.sort(nm);else if(u==='besar')R.sort((a,b)=>b.tot-a.tot||nm(a,b));else if(u==='kecil')R.sort((a,b)=>a.tot-b.tot||nm(a,b));
  return R}
function abkMapel(){const kl=kelasList();return mapelList().map(m=>{const jp=kl.reduce((s,k)=>s+mapelJP(m,k.tingkat),0);const tg=all('tugas').filter(t=>t.mapelId===m.id);const gs=[...new Set(tg.map(t=>t.guruId))];const diampu=tg.reduce((s,t)=>s+tugasJP(t),0);
  const butuh=jp/ABK_MIN;const rata=gs.length?diampu/gs.length:0;const ke=Math.floor(butuh+1e-9);
  let st;if(!jp)st='—';else if(!gs.length)st='Belum ada guru';else if(gs.length>Math.max(1,Math.ceil(butuh))) st='Kelebihan '+(gs.length-Math.max(1,Math.ceil(butuh)))+' guru';else if(rata>ABK_MAX||gs.length<ke)st='Kekurangan '+Math.max(1,ke-gs.length)+' guru';else st='Seimbang';
  return {m,jp,gs,diampu,butuh,rata,st,belum:jp-diampu}}).filter(x=>x.jp)}
function abkTerapkan(){const L=[];all('tt').forEach(t=>{const A=abkAturanOf(t);if(!A.ada)return;const sk=num(t.jam)||0;if(sk!==A.jp)L.push(Object.assign({},t,{jam:A.jp}))});
  if(!L.length){toast('Jam tugas tambahan sudah sesuai aturan');return}
  confirmBox(`Samakan jam ekuivalensi <b>${L.length} tugas tambahan</b> dengan ketentuan aturan?<div class="small muted" style="margin-top:6px">${[...new Set(L.map(t=>t.jenis||t.kategori))].slice(0,12).map(esc).join(', ')}${L.length>12?' …':''}</div>`,()=>{bulk('tt',L,'Samakan jam dengan aturan ABK');render();toast(L.length+' tugas tambahan diperbarui. Bisa dibatalkan dengan ↶ Urungkan.')},'Samakan')}
function abkAturanForm(){const A=abkAturan();const row=(a,i)=>`<tr><td><input value="${esc(a[0])}" data-i="${i}" data-k="0" style="width:100%"></td><td><input value="${esc(a[1])}" data-i="${i}" data-k="1" style="width:100%"></td><td><input type="number" value="${esc(a[2])}" data-i="${i}" data-k="2" style="width:60px"></td><td><input value="${esc(a[3])}" data-i="${i}" data-k="3" style="width:100%"></td></tr>`;
